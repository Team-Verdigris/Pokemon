name: Build and Deploy Pokemon Site

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate Pokemon preview pages
        run: |
          rm -rf pokemon
          python generate_pokemon_preview_pages.py

      - name: Verify generated pages
        run: |
          test -f pokemon/routes-ready.txt
          echo "Generated preview routes:"
          find pokemon -name index.html | wc -l

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Verdigris Pokémon Asset Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f4f6f8;
            --panel: #ffffff;
            --border: #d8dde3;
            --text: #222222;
            --muted: #6e7681;
            --accent: #315f7d;
            --success: #426b43;
            --success-soft: #eaf4eb;
            --danger: #b12c2c;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 22px 24px;
        }

        .header-inner {
            width: min(1500px, calc(100% - 20px));
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        main {
            width: min(1500px, calc(100% - 32px));
            margin: 22px auto 48px;
        }

        /* =========================================================
           TOOLBAR
           ========================================================= */

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: end;
            margin-bottom: 24px;
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group > label:first-child {
            color: var(--muted);
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input[type="search"],
        select {
            min-height: 38px;
            padding: 8px 10px;
            border: 1px solid #c7ccd2;
            border-radius: 6px;
            background: #ffffff;
            color: var(--text);
            font-size: 14px;
        }

        input[type="search"] {
            width: 300px;
            max-width: 70vw;
        }

        select {
            min-width: 145px;
        }

        .toggle-group {
            display: flex;
            min-height: 38px;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            border: 1px solid #c7ccd2;
            border-radius: 6px;
            background: #ffffff;
        }

        .toggle-group input {
            margin: 0;
        }

        .toggle-group label {
            cursor: pointer;
            color: var(--text);
            font-size: 13px;
            white-space: nowrap;
        }

        /* =========================================================
           COMMON
           ========================================================= */

        .status {
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
        }

        .hidden {
            display: none !important;
        }

        .checkerboard {
            background:
                linear-gradient(45deg, #eceff1 25%, transparent 25%),
                linear-gradient(-45deg, #eceff1 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #eceff1 75%),
                linear-gradient(-45deg, transparent 75%, #eceff1 75%);
            background-size: 16px 16px;
            background-position:
                0 0,
                0 8px,
                8px -8px,
                -8px 0;
        }

        /* =========================================================
           FOLDER VIEW
           ========================================================= */

        .folder-section {
            margin-bottom: 34px;
        }

        .folder-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .folder-title {
            margin: 0;
            font-size: 20px;
        }

        .folder-count {
            color: var(--muted);
            font-size: 13px;
        }

        .asset-grid,
        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 14px;
        }

        .asset-card,
        .pokemon-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .asset-card {
            padding: 10px;
        }

        .asset-preview {
            position: relative;
            display: flex;
            min-height: 160px;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            overflow: hidden;
            border-radius: 5px;
        }

        .asset-preview img {
            max-width: 100%;
            max-height: 180px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .asset-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
            font-size: 12px;
        }

        .asset-warning {
            margin-top: 5px;
            color: var(--danger);
            font-size: 11px;
            text-align: center;
        }

        .archived-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 4;
            padding: 3px 6px;
            border-radius: 4px;
            background: rgba(130, 36, 36, 0.9);
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
        }

        /* =========================================================
           SHINY HOVER
           ========================================================= */

        .hover-stack {
            position: relative;
            width: 100%;
            min-height: 160px;
        }

        .hover-stack img {
            position: absolute;
            inset: 50% auto auto 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.16s ease;
        }

        .hover-stack .shiny-image {
            opacity: 0;
        }

        .hover-stack.has-shiny:hover .normal-image {
            opacity: 0;
        }

        .hover-stack.has-shiny:hover .shiny-image {
            opacity: 1;
        }

        .hover-stack.missing-shiny:hover .normal-image {
            opacity: 0.48;
        }

        .hover-indicator {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 5;
            display: flex;
            width: 25px;
            height: 25px;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            line-height: 1;
            transform: scale(0.8);
            transition:
                opacity 0.16s ease,
                transform 0.16s ease;
        }

        .shiny-indicator {
            color: #e4b216;
            font-size: 21px;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.45),
                0 0 3px rgba(255, 255, 255, 0.8);
        }

        .missing-shiny-indicator {
            color: #d12626;
            font-size: 25px;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
        }

        .hover-stack.has-shiny:hover .shiny-indicator,
        .hover-stack.missing-shiny:hover .missing-shiny-indicator {
            opacity: 1;
            transform: scale(1);
        }

        /* =========================================================
           SHINY TOGGLE
           ========================================================= */

        .toggle-wrap {
            display: flex;
            width: 100%;
            flex-direction: column;
            gap: 8px;
        }

        .toggle-stack {
            position: relative;
            min-height: 150px;
        }

        .toggle-stack img {
            position: absolute;
            inset: 50% auto auto 50%;
            transform: translate(-50%, -50%);
        }

        .toggle-stack .shiny-image {
            display: none;
        }

        .shiny-toggle-button,
        .view-assets-button,
        .alternate-form-button {
            border: 1px solid #bfc6cc;
            border-radius: 5px;
            background: #ffffff;
            cursor: pointer;
        }

        .shiny-toggle-button {
            align-self: center;
            padding: 5px 10px;
            font-size: 12px;
        }

        /* =========================================================
           ICON ANIMATION
           ========================================================= */

        .icon-animation {
            display: inline-block;
            flex: 0 0 auto;
            background-repeat: no-repeat;
            background-position: left top;
            background-size: 200% 100%;
            image-rendering: pixelated;
            animation: icon-two-frame-animation 0.5s steps(1, end) infinite;
        }

        @keyframes icon-two-frame-animation {
            0%,
            49.999% {
                background-position: left top;
            }

            50%,
            100% {
                background-position: right top;
            }
        }

        /* =========================================================
           POKEMON VIEW
           ========================================================= */

        .pokemon-card {
            --pokemon-main: 255, 255, 255;
            --pokemon-accent: 216, 221, 227;

            display: flex;
            flex-direction: column;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .pokemon-card.colored {
            background:
                linear-gradient(
                    180deg,
                    rgba(var(--pokemon-main), 0.22),
                    rgba(255, 255, 255, 0.96) 48%
                );
            box-shadow:
                0 3px 12px rgba(var(--pokemon-accent), 0.12);
        }

        .pokemon-cover {
            position: relative;
            display: flex;
            min-height: 220px;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .pokemon-card.colored .pokemon-cover {
            background-color:
                rgba(var(--pokemon-main), 0.11);
        }

        .pokemon-cover img {
            max-width: 100%;
            max-height: 220px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .pokemon-body {
            flex: 1;
            padding: 12px;
        }


        .pokemon-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 10px;
        }

        .pokemon-name {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            font-size: 16px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .variant-badge {
            flex: 0 0 auto;
            padding: 2px 5px;
            border-radius: 4px;
            background: #eef1f4;
            color: var(--muted);
            font-size: 9px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .variant-badge.old {
            background: #f3dddd;
            color: #922c2c;
        }

        .asset-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px 8px;
            margin-bottom: 10px;
        }

        .asset-status {
            font-size: 12px;
        }

        .asset-status.exists {
            color: var(--success);
        }

        .asset-status.missing {
            color: var(--danger);
        }

        .complete-summary {
            margin-top: 8px;
            padding: 7px 8px;
            border-radius: 5px;
            background: var(--success-soft);
            color: var(--success);
            font-size: 11px;
        }

        .view-assets-button {
            width: 100%;
            margin-top: 10px;
            padding: 8px 10px;
            color: var(--accent);
            font-size: 12px;
            font-weight: bold;
        }

        .view-assets-button:hover,
        .alternate-form-button:hover {
            background: #f5f7f9;
        }

        /* =========================================================
           GROUPED FORMS
           ========================================================= */

        .alternate-forms {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .alternate-forms-title {
            margin: 0 0 7px;
            color: var(--muted);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .alternate-form-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .alternate-form-button {
            padding: 5px 7px;
            color: var(--text);
            font-size: 10px;
        }

        /* =========================================================
           MODAL
           ========================================================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.67);
        }

        .modal {
            --pokemon-main: 255, 255, 255;
            --pokemon-accent: 216, 221, 227;

            width: min(1100px, 100%);
            max-height: calc(100vh - 48px);
            overflow: auto;
            background: var(--panel);
            border-radius: 10px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        }

        .modal.colored {
            border: 3px solid rgb(var(--pokemon-accent));
        }

        .modal-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 18px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .modal.colored .modal-header {
            background:
                linear-gradient(
                    90deg,
                    rgba(var(--pokemon-main), 0.24),
                    #ffffff
                );
            border-bottom:
                3px solid rgb(var(--pokemon-accent));
        }

        .modal-title {
            margin: 0;
            font-size: 20px;
        }

        .modal-close {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }

        .modal-body {
            padding: 18px;
        }

        .modal-asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .modal-asset {
            display: flex;
            min-height: 220px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .modal-asset-preview {
            display: flex;
            width: 100%;
            min-height: 170px;
            flex: 1;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .modal-asset-preview img {
            max-width: 100%;
            max-height: 190px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .modal-asset-label {
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        .modal-asset-missing {
            color: var(--muted);
            font-size: 12px;
        }

        /* =========================================================
           PROGRESS / MODAL NAVIGATION / ADDITIONAL ART
           ========================================================= */

        .progress-summary {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 10px;
            color: var(--muted);
            font-size: 11px;
        }

        .progress-track {
            height: 6px;
            flex: 1;
            overflow: hidden;
            border-radius: 999px;
            background: #e4e8ec;
        }

        .progress-fill {
            height: 100%;
            border-radius: inherit;
            background: var(--success);
        }

        .modal-variant-nav {
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .modal-section-title {
            margin: 0 0 9px;
            color: var(--muted);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .modal-variant-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .modal-variant-button {
            padding: 6px 9px;
            border: 1px solid #bfc6cc;
            border-radius: 5px;
            background: #ffffff;
            cursor: pointer;
            color: var(--text);
            font-size: 11px;
        }

        .modal-variant-button:hover:not(:disabled) {
            background: #f5f7f9;
        }

        .modal-variant-button.active,
        .modal-variant-button:disabled {
            border-color: var(--accent);
            background: #e8f0f5;
            color: var(--accent);
            cursor: default;
            font-weight: bold;
        }

        .additional-art-section {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }

        .additional-art-label {
            margin-top: 6px;
            color: var(--muted);
            font-size: 10px;
            text-align: center;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 700px) {
            main {
                width: calc(100% - 20px);
            }

            .toolbar {
                align-items: stretch;
            }

            input[type="search"] {
                width: 100%;
                max-width: none;
            }

            .control-group {
                flex: 1 1 100%;
            }

            .asset-grid,
            .pokemon-grid {
                grid-template-columns:
                    repeat(auto-fill, minmax(145px, 1fr));
                gap: 10px;
            }

            .modal-backdrop {
                padding: 10px;
            }

            .modal {
                max-height: calc(100vh - 20px);
            }

            .modal-asset-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1>Team Verdigris Pokémon Asset Viewer</h1>

        <p class="subtitle">
            Browse and audit Pokémon artwork and sprites.
        </p>
    </div>
</header>

<main>

    <div class="toolbar">

        <div class="control-group">
            <label for="searchInput">Search</label>

            <input
                type="search"
                id="searchInput"
                placeholder="Search Pokémon or filename..."
                autocomplete="off"
            >
        </div>

        <div class="control-group">
            <label for="viewMode">View</label>

            <select id="viewMode">
                <option value="pokemon" selected>By Pokémon</option>
                <option value="folder">By Folder</option>
            </select>
        </div>

        <div class="control-group">
            <label for="shinyMode">Shiny Display</label>

            <select id="shinyMode">
                <option value="hover" selected>Hover</option>
                <option value="separate">Separate</option>
                <option value="toggle">Toggle</option>
            </select>
        </div>

        <div class="control-group">
            <label for="iconMode">Icon Display</label>

            <select id="iconMode">
                <option value="animated" selected>GIF</option>
                <option value="sheet">Sheet</option>
            </select>
        </div>

        <div class="control-group">
            <label for="formMode">Forms</label>

            <select id="formMode">
                <option value="separate" selected>Separate</option>
                <option value="grouped">Group Under Pokémon</option>
            </select>
        </div>

        <div class="control-group">
            <label for="cardStyle">Card Style</label>

            <select id="cardStyle">
                <option value="neutral">Neutral</option>
                <option value="pokemon" selected>Pokémon Colors</option>
            </select>
        </div>

        <div class="control-group">
            <label for="sortMode">Sort</label>

            <select id="sortMode">
                <option value="name" selected>Name A–Z</option>
                <option value="progressAsc">Progress: Least → Most</option>
                <option value="progressDesc">Progress: Most → Least</option>
            </select>
        </div>

        <div class="control-group">
            <label for="progressFilter">Graphic Progress</label>

            <select id="progressFilter">
                <option value="all" selected>All</option>
                <option value="incomplete">Incomplete only</option>
                <option value="complete">Complete only</option>
                <option value="0">0 / 6 complete</option>
                <option value="1">1 / 6 complete</option>
                <option value="2">2 / 6 complete</option>
                <option value="3">3 / 6 complete</option>
                <option value="4">4 / 6 complete</option>
                <option value="5">5 / 6 complete</option>
                <option value="6">6 / 6 complete</option>
                <option value="missing:artwork">Missing Artwork</option>
                <option value="missing:front">Missing Front</option>
                <option value="missing:frontShiny">Missing Front Shiny</option>
                <option value="missing:back">Missing Back</option>
                <option value="missing:backShiny">Missing Back Shiny</option>
                <option value="missing:icon">Missing Icon</option>
            </select>
        </div>

        <div class="control-group">
            <label>Unused Assets</label>

            <div class="toggle-group">
                <input
                    id="hideUnusedAssets"
                    type="checkbox"
                    checked
                >

                <label for="hideUnusedAssets">
                    Hide non-sprite assets
                </label>
            </div>
        </div>

        <div class="control-group">
            <label>Archived Files</label>

            <div class="toggle-group">
                <input
                    id="showOldFiles"
                    type="checkbox"
                >

                <label for="showOldFiles">
                    Show _OLD
                </label>
            </div>
        </div>

    </div>

    <div id="content">
        <div class="status">
            Loading assets...
        </div>
    </div>

</main>

<div
    id="assetModal"
    class="modal-backdrop hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
>
    <div
        id="modalWindow"
        class="modal"
    >
        <div class="modal-header">

            <h2
                id="modalTitle"
                class="modal-title"
            ></h2>

            <button
                id="modalClose"
                class="modal-close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>

        </div>

        <div
            id="modalBody"
            class="modal-body"
        ></div>
    </div>
</div>

<script>
    /* =============================================================
       REPOSITORY
       ============================================================= */

    const organization = 'Team-Verdigris';
    const repository = 'Pokemon';


    /* =============================================================
       ASSET CONFIGURATION

       Set unused: true for folders that should disappear when
       "Hide non-sprite assets" is enabled.

       Egg remains a normal visible asset, but it does NOT count
       toward the required sprite checklist.

       If another unused folder exists later, just add it here.
       ============================================================= */

    const folderConfig = [
        {
            key: 'artwork',
            folder: 'Artworks',
            label: 'Artwork',
            required: true,
            unused: false
        },
        {
            key: 'front',
            folder: 'Front',
            label: 'Front',
            required: true,
            unused: false
        },
        {
            key: 'frontShiny',
            folder: 'Front shiny',
            label: 'Front Shiny',
            required: true,
            unused: false
        },
        {
            key: 'back',
            folder: 'Back',
            label: 'Back',
            required: true,
            unused: false
        },
        {
            key: 'backShiny',
            folder: 'Back shiny',
            label: 'Back Shiny',
            required: true,
            unused: false
        },
        {
            key: 'icon',
            folder: 'Icons',
            label: 'Icon',
            required: true,
            unused: false
        },
        {
            key: 'egg',
            folder: 'Eggs',
            label: 'Egg',
            required: false,
            unused: false
        },

        /*
         * Unused / utility assets.
         */
        {
            key: 'shadow',
            folder: 'Shadow',
            label: 'Shadow',
            required: false,
            unused: true
        },
        {
            key: 'return',
            folder: 'Return',
            label: 'Return',
            required: false,
            unused: true
        },
        {
            key: 'officialBackup',
            folder: 'Official Backup',
            label: 'Official Backup',
            required: false,
            unused: true
        }
    ];


    /* =============================================================
       ELEMENTS
       ============================================================= */

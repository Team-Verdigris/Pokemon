    function hideSearchSuggestions() {
        if (elements.searchSuggestions) elements.searchSuggestions.classList.add('hidden');
    }

    function renderSearchSuggestions() {
        if (!elements.searchSuggestions || !state.loaded) return;
        const raw=elements.searchInput.value.trim();
        elements.searchSuggestions.replaceChildren();
        if (!raw) {
            const help=document.createElement('div');help.className='search-help';help.innerHTML='<strong>Search everything</strong><br>Names, types, abilities, Pokédex text, Gallery, and files. Power filters: <code>type:steel</code>, <code>atk&gt;=100</code>, <code>bst&gt;=500</code>.';
            elements.searchSuggestions.appendChild(help);elements.searchSuggestions.classList.remove('hidden');return;
        }
        const q=raw.toLowerCase();let added=0;
        const addLabel=text=>{const label=document.createElement('div');label.className='suggestion-group-label';label.textContent=text;elements.searchSuggestions.appendChild(label);};
        const addSuggestion=(title,meta,kind,thumbFile,onClick)=>{const button=document.createElement('button');button.type='button';button.className='search-suggestion';const thumb=document.createElement('div');thumb.className='suggestion-thumb checkerboard';if(thumbFile)thumb.appendChild(createImage(thumbFile,title));const copy=document.createElement('div');const t=document.createElement('div');t.className='suggestion-title';t.textContent=title;const m=document.createElement('div');m.className='suggestion-meta';m.textContent=meta||'';copy.append(t,m);const k=document.createElement('div');k.className='suggestion-kind';k.textContent=kind;button.append(thumb,copy,k);button.addEventListener('click',()=>{hideSearchSuggestions();onClick();});elements.searchSuggestions.appendChild(button);added++;};
        if(state.currentView==='pokemon'){
            const typeMatches=[...state.recordsByType.keys()].filter(type=>type.toLowerCase().includes(q)).slice(0,3);if(typeMatches.length){addLabel('Types');typeMatches.forEach(type=>addSuggestion(type,`${state.recordsByType.get(type).size} matching records`,'Type',null,()=>{state.selectedTypes.add(type);elements.searchInput.value='';populateFilters();syncRoute({push:true});render();}));}
            const pokemon=state.speciesGroups.filter(group=>group.forms.some(record=>record.searchText.includes(q))).slice(0,6);if(pokemon.length){addLabel('Pokémon');pokemon.forEach(group=>{const record=group.forms.find(r=>r.searchText.includes(q))||group.primary;addSuggestion(getDisplayName(record),(record.dex?.types||[]).map(t=>t.name).join(' · ')||record.dex?.species_name,'Pokémon',getCoverForRecord(record),()=>openPokemon(record));});}
        } else if(state.currentView==='gallery') {
            const gallery=state.galleryItems.filter(item=>item.searchText.includes(q)).slice(0,8);if(gallery.length){addLabel('Gallery');gallery.forEach(item=>addSuggestion(item.title,item.categoryPath||'Uncategorized','Gallery',item,()=>openGallery(item)));}
        }
        if(!added){const empty=document.createElement('div');empty.className='search-help';empty.textContent='No quick suggestions. Press Enter or keep typing to filter the current view.';elements.searchSuggestions.appendChild(empty);}
        elements.searchSuggestions.classList.remove('hidden');
    }

    function render() {
        updateNavigation();
        updateFilterPanels();
        renderActiveFilterBar();
        if (!state.loaded) return;
        if (state.currentView === 'gallery') renderGalleryView();
        else if (state.currentView === 'folder') renderFolderView();
        else renderPokemonView();
    }

    function updateNavigation() {
        document.querySelectorAll('.nav-button').forEach(button => button.classList.toggle('active',button.dataset.view === state.currentView));
        elements.searchInput.placeholder = state.currentView === 'gallery'
            ? 'Search Gallery…'
            : state.currentView === 'folder'
                ? 'Search this folder…'
                : 'Search Pokémon, types, abilities, stats…';
    }

    function updateFilterPanels() {
        const pokemon = state.currentView === 'pokemon';
        elements.pokemonFilterSection.classList.toggle('hidden',!pokemon);
        elements.statFilterSection.classList.toggle('hidden',!pokemon);
        elements.assetFilterSection.classList.toggle('hidden',state.currentView === 'gallery');
        elements.galleryFilterSection.classList.toggle('hidden',state.currentView !== 'gallery');
        if(elements.groupModeField)elements.groupModeField.classList.toggle('hidden',state.currentView !== 'pokemon');
    }

    function renderActiveFilterBar() {
        const chips = [];
        state.selectedTypes.forEach(type => chips.push({ label: `Type: ${type}`, clear: () => state.selectedTypes.delete(type) }));
        if (state.ability) chips.push({ label: `Ability: ${state.ability}`, clear: () => { state.ability = ''; elements.abilityFilter.value = ''; } });
        STAT_CONFIG.forEach(stat => {
            const range = state.statRanges[stat.key] || {};
            if (range.min !== '' && range.min != null) chips.push({ label: `${stat.label} ≥ ${range.min}`, clear: () => { range.min = ''; syncStatInputs(); } });
            if (range.max !== '' && range.max != null) chips.push({ label: `${stat.label} ≤ ${range.max}`, clear: () => { range.max = ''; syncStatInputs(); } });
        });
        if (state.progressFilter !== 'all') chips.push({ label: `Assets: ${state.progressFilter}`, clear: () => { state.progressFilter = 'all'; elements.progressFilter.value = 'all'; } });
        if (state.currentView === 'gallery' && state.galleryRelation !== 'all') chips.push({ label: state.galleryRelation === 'pokemon' ? 'Pokémon-related' : 'General Gallery', clear: () => { state.galleryRelation = 'all'; elements.galleryRelationFilter.value = 'all'; } });
        if (state.currentView === 'gallery' && state.selectedGalleryCategory) chips.push({ label: state.selectedGalleryCategory, clear: () => state.selectedGalleryCategory = '' });

        elements.activeFilterBar.replaceChildren();
        chips.forEach(item => {
            const chip = document.createElement('span');
            chip.className = 'filter-chip';
            chip.append(document.createTextNode(item.label));
            const clear = document.createElement('button');
            clear.type = 'button';
            clear.textContent = '×';
            clear.addEventListener('click',() => { item.clear(); populateFilters(); render(); syncRoute({ replace: true }); });
            chip.appendChild(clear);
            elements.activeFilterBar.appendChild(chip);
        });
        elements.activeFilterBar.classList.toggle('hidden',chips.length === 0);
    }

    function populateFilters() {
        const types = new Map();
        const abilities = new Map();
        state.pokemonRecords.forEach(record => {
            (record.dex?.types || []).forEach(type => types.set(type.id,type));
            [...(record.dex?.abilities?.standard || []), ...(record.dex?.abilities?.hidden || [])].forEach(ability => abilities.set(ability.id,ability));
        });

        elements.typeFilterGrid.replaceChildren();
        [...types.values()].sort((a,b)=>compareText(a.name,b.name)).forEach(type => {
            const chip = makeTypeChip(type,{ filterable: false });
            chip.disabled = false;
            chip.classList.toggle('selected',state.selectedTypes.has(type.id));
            chip.addEventListener('click',() => {
                if (state.selectedTypes.has(type.id)) state.selectedTypes.delete(type.id);
                else state.selectedTypes.add(type.id);
                populateFilters(); render(); syncRoute({ replace: true });
            });
            elements.typeFilterGrid.appendChild(chip);
        });

        elements.abilityFilter.innerHTML = '<option value="">Any ability</option>';
        [...abilities.values()].sort((a,b)=>compareText(a.name,b.name)).forEach(ability => {
            const option = document.createElement('option'); option.value = ability.id; option.textContent = ability.name; elements.abilityFilter.appendChild(option);
        });
        elements.abilityFilter.value = state.ability;

        elements.statFilterGrid.replaceChildren();
        let activeStats=0;
        STAT_CONFIG.forEach(stat => {
            const range=ensureStatRange(stat.key);
            [['min','≥'],['max','≤']].forEach(([bound,op]) => {
                if (range[bound] === '' || range[bound] == null) return;
                activeStats++;
                const row=document.createElement('div'); row.className='stat-filter-row';
                const name=document.createElement('div'); name.className='stat-filter-name'; name.textContent=stat.label;
                const operator=document.createElement('div'); operator.className='stat-filter-op'; operator.textContent=op;
                const input=document.createElement('input'); input.type='number'; input.min='0'; input.step='1'; input.value=range[bound]; input.dataset.stat=stat.key; input.dataset.bound=bound;
                input.addEventListener('input',()=>{range[bound]=input.value;render();syncRoute({replace:true});});
                const remove=document.createElement('button');remove.type='button';remove.className='stat-filter-remove';remove.textContent='×';remove.title='Remove filter';
                remove.addEventListener('click',()=>{range[bound]='';populateFilters();render();syncRoute({replace:true});});
                row.append(name,operator,input,remove);elements.statFilterGrid.appendChild(row);
            });
        });
        if (!activeStats) {
            const hint=document.createElement('div');hint.className='search-help';hint.style.padding='0 0 8px';hint.textContent='No stat limits. Add only the comparisons you need.';elements.statFilterGrid.appendChild(hint);
        }

        if (elements.statBuilderStat && !elements.statBuilderStat.options.length) {
            STAT_CONFIG.forEach(stat=>{const option=document.createElement('option');option.value=stat.key;option.textContent=stat.label;elements.statBuilderStat.appendChild(option);});
            elements.statBuilderStat.value='total';
        }
        populateSortOptions();
    }

    function ensureStatRange(key) {
        if (!state.statRanges[key]) state.statRanges[key] = { min: '', max: '' };
        return state.statRanges[key];
    }

    function scrollPokemonDetailToSection(key, { smooth = true } = {}) {
        const target = document.getElementById(getPokemonDetailSectionId(key));

        const nav = elements.modalBody.querySelector('.detail-tabs');
        const bodyRect = elements.modalBody.getBoundingClientRect();
        const targetRect = target.getBoundingClientRect();
        const navHeight = nav?.offsetHeight || 0;
        const top = elements.modalBody.scrollTop + (targetRect.top - bodyRect.top) - navHeight - 8;
        setPokemonDetailNavActive(key);
        elements.modalBody.scrollTo({ top: Math.max(0, top), behavior: smooth ? 'smooth' : 'auto' });
    }

    function syncPokemonDetailNavFromScroll() {
        if (state.modal?.type !== 'pokemon') return;
        const nav = elements.modalBody.querySelector('.detail-tabs');
        const bodyRect = elements.modalBody.getBoundingClientRect();
        const threshold = bodyRect.top + (nav?.offsetHeight || 0) + 20;
        const keys = ['overview','assets','gallery','archive'];
        let active = 'overview';
        keys.forEach(key => {
            const section = document.getElementById(getPokemonDetailSectionId(key));
            if (section && section.getBoundingClientRect().top <= threshold) active = key;

        setPokemonDetailNavActive(active);

    function getEvolutionFamily(speciesId) {
        const start=String(speciesId||'').toUpperCase();if(!start)return null;
        const family=new Set([start]);const queue=[start];
        while(queue.length){const id=queue.shift();const neighbors=[...(state.evolutionChildren.get(id)||[]),...(state.evolutionParents.get(id)||[])];neighbors.forEach(next=>{if(!family.has(next)){family.add(next);queue.push(next);}});}
        const roots=[...family].filter(id=>![...(state.evolutionParents.get(id)||[])].some(parent=>family.has(parent)));
        return {nodes:family,roots:roots.length?roots:[start]};
    }

    function buildEvolutionFamilySection(record) {
        if(!record.dex)return null;
        const currentId=String(record.dex.pokemon_id||record.parsed.baseName).toUpperCase();
        const family=getEvolutionFamily(currentId);if(!family||family.nodes.size<=1)return null;
        const section=document.createElement('section');section.className='detail-section';
        const header=document.createElement('div');header.className='section-header';const title=document.createElement('h3');title.className='section-title';title.textContent='Evolution Family';const meta=document.createElement('span');meta.className='section-meta';meta.textContent=`${family.nodes.size} species`;header.append(title,meta);section.appendChild(header);
        const tree=document.createElement('div');tree.className='evolution-tree';
        family.roots.forEach(root=>tree.appendChild(buildEvolutionBranch(root,currentId,family.nodes,new Set())));
        section.appendChild(tree);return section;
    }

    function buildEvolutionBranch(id,currentId,familyNodes,path) {
        const branch=document.createElement('div');branch.className='evo-branch';
        const upper=String(id).toUpperCase();
        const group=state.speciesByBase.get(upper.toLowerCase());const species=state.snapshotSpeciesById.get(upper);const representative=group?.primary||null;
        const node=document.createElement('button');node.type='button';node.className=`evo-card${upper===currentId?' current':''}`;
        const thumb=document.createElement('div');thumb.className='evo-thumb checkerboard';const cover=representative?getCoverForRecord(representative):null;if(cover)thumb.appendChild(createImage(cover,species?.name||upper,{pixelated:!isGalleryCover(cover)&&cover!==representative?.assets?.artwork}));
        const copy=document.createElement('div');const name=document.createElement('div');name.className='evo-name';name.textContent=species?.name || (representative ? getDisplayName(representative) : upper);copy.appendChild(name);
        const typeWrap=document.createElement('div');typeWrap.className='evo-types';(representative?.dex?.types||species?.forms?.[0]?.types||[]).forEach(type=>typeWrap.appendChild(makeTypeChip(type,{filterable:false})));copy.appendChild(typeWrap);node.append(thumb,copy);
        if(representative)node.addEventListener('click',()=>{state.modal={type:'pokemon',id:representative.id,tab:'overview'};renderPokemonModal(representative);syncRoute({replace:true});updateDocumentMetadata(representative,null);});
        branch.appendChild(node);
        const nextPath=new Set(path);nextPath.add(upper);
        const children=[...(state.evolutionChildren.get(upper)||[])].filter(child=>familyNodes.has(child)&&!nextPath.has(child));
        if(children.length){const arrow=document.createElement('span');arrow.className='evo-arrow';arrow.textContent='→';branch.appendChild(arrow);const childWrap=document.createElement('div');childWrap.className='evo-children';children.forEach(child=>childWrap.appendChild(buildEvolutionBranch(child,currentId,familyNodes,nextPath)));branch.appendChild(childWrap);}
        return branch;
    }

    function getCurrentShareUrl() {
        if (state.modal?.type === 'pokemon') {
            const id = encodeURIComponent(state.modal.id);
            const siteRoot = new URL('./', window.location.href);
            return new URL(`pokemon/${id}/`, siteRoot).toString();
        }

        const url = new URL(window.location.href);
        if (state.modal?.type === 'gallery') {
            url.search = '';
            url.searchParams.set('gallery', state.modal.id);

    async function copyCurrentLink() {
        try { await navigator.clipboard.writeText(getCurrentShareUrl()); showToast('Copied link'); }
        catch { showToast('Could not copy link',true); }

    async function shareCurrent() {
        const url=getCurrentShareUrl();
        const title=elements.modalTitle.textContent || BASE_TITLE;
        if(navigator.share) {
            try { await navigator.share({title,url}); return; } catch(error) { if(error?.name==='AbortError')return; }
        }
        await copyCurrentLink();

    function updateDocumentMetadata(record,item) {
        let title=BASE_TITLE,description='Browse Team Verdigris Pokémon, artwork, sprites, stats, concept art, and archived assets.',image='';
        if(record) {
            title=`${getDisplayName(record)} — Verdigris Dex`;
            description=record.dex?.pokedex_entry || `Artwork, sprites, Gallery items, and asset status for ${getDisplayName(record)}.`;
            image=getCoverUrl(getCoverForRecord(record)) || '';
        } else if(item) {
            title=`${item.title} — Verdigris Gallery`;
            description=`${item.title}${item.categoryPath?` • ${item.categoryPath}`:''}${item.pokemon.length?` • ${item.pokemon.join(', ')}`:''}`;
            image=item.download_url;
        }
        document.title=title;
        setMeta('meta[property="og:title"]','content',title);
        setMeta('meta[property="og:description"]','content',description);
        setMeta('meta[name="description"]','content',description);
        if(image)setMeta('meta[property="og:image"]','content',image,true);
    }

    function setMeta(selector,attribute,value,create=false) {
        let element=document.querySelector(selector);
        if(!element && create) {
            element=document.createElement('meta');
            const match=selector.match(/meta\[(property|name)="([^"]+)"\]/);
            if(match)element.setAttribute(match[1],match[2]);
            document.head.appendChild(element);
        }
        if(element)element.setAttribute(attribute,value);
    }

    function syncRoute({push=false,replace=false}={}) {
        const url=new URL(window.location.href);
        url.search='';
        if(state.modal?.type==='pokemon') url.searchParams.set('pokemon',state.modal.id);
        else if(state.modal?.type==='gallery') url.searchParams.set('gallery',state.modal.id);
        else {
            if(state.currentView!=='pokemon')url.searchParams.set('view',state.currentView);
            if(state.currentView==='folder')url.searchParams.set('folder',state.selectedFolder);
            if(state.currentView==='gallery'&&state.selectedGalleryCategory)url.searchParams.set('category',state.selectedGalleryCategory);
            if(state.currentView==='gallery'&&state.galleryRelation!=='all')url.searchParams.set('relation',state.galleryRelation);
            state.selectedTypes.forEach(type=>url.searchParams.append('type',type));
            if(state.ability)url.searchParams.set('ability',state.ability);
            if(state.currentView==='pokemon'&&state.groupMode!=='none')url.searchParams.set('group',state.groupMode);
            STAT_CONFIG.forEach(stat=>{const range=state.statRanges[stat.key]||{};if(range.min!==' '&&range.min!==''&&range.min!=null)url.searchParams.set(`min_${stat.alias}`,range.min);if(range.max!==''&&range.max!=null)url.searchParams.set(`max_${stat.alias}`,range.max);});
        }
        const method=push?'pushState':'replaceState';
        history[method]({},'',url);
    }

    function applyRoute({initial=false}={}) {
        const params=new URLSearchParams(window.location.search);
        state.selectedTypes=new Set(params.getAll('type').map(v=>v.toUpperCase()));
        state.ability=params.get('ability')||'';
        state.groupMode=params.get('group')==='evolution'?'evolution':'none';
        state.selectedGalleryCategory=params.get('category')||'';
        state.galleryRelation=params.get('relation')||'all';
        state.selectedFolder=params.get('folder')||state.selectedFolder;
        STAT_CONFIG.forEach(stat=>{const range=ensureStatRange(stat.key);range.min=params.get(`min_${stat.alias}`)||'';range.max=params.get(`max_${stat.alias}`)||'';});

        const pokemon=params.get('pokemon');
        const gallery=params.get('gallery');
        if(pokemon) {
            const record=state.pokemonById.get(pokemon.toLowerCase());
            if(record){state.currentView='pokemon';openPokemon(record,{updateUrl:false});}
        } else if(gallery) {
            const item=state.galleryById.get(gallery);
            if(item){state.currentView='gallery';openGallery(item,{updateUrl:false});}
        } else {
            state.currentView=['pokemon','gallery','folder'].includes(params.get('view'))?params.get('view'):'pokemon';
            if(!initial)closeModal({updateUrl:false});
        }
        syncControlsFromState();
        populateFilters();
        render();
    }

    async function loadAllData() {
        elements.content.innerHTML='<div class="status loading-status" role="status" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><strong class="loading-pulse">Loading Verdigris Dex…</strong><span>Repository, Pokédex snapshot, and Gallery</span></div>';
        try {
            state.tree=await fetchRepositoryTree();
            buildAssetCollections(state.tree);
            buildGalleryItems(state.tree);
            state.snapshot=await loadSnapshotFromTree(state.tree);
            buildPokemonRecords();
            state.loaded=true;
            populateFilters();
            applyRoute({initial:true});
        } catch(error) {
            console.error(error);
            elements.content.innerHTML=`<div class="status"><strong>Could not load Verdigris Dex.</strong><div style="margin-top:6px">${String(error.message||error)}</div></div>`;
        }
    }

    function clearAllFilters() {
        state.selectedTypes.clear(); state.ability=''; state.progressFilter='all'; state.galleryRelation='all'; state.selectedGalleryCategory=''; state.groupMode='none';
        STAT_CONFIG.forEach(stat=>state.statRanges[stat.key]={min:'',max:''});
        syncControlsFromState(); populateFilters(); render(); syncRoute({replace:true});
    }

    document.querySelectorAll('.nav-button').forEach(button=>button.addEventListener('click',()=>{
        state.currentView=button.dataset.view;
        state.modal=null;
        elements.detailModal.classList.add('hidden'); document.body.style.overflow='';
        render(); syncRoute({push:true});
    }));

    document.querySelector('.brand')?.addEventListener('click',()=>{state.currentView='pokemon';state.modal=null;elements.detailModal.classList.add('hidden');document.body.style.overflow='';render();syncRoute({push:true});});

    elements.searchInput.addEventListener('input',()=>{clearTimeout(state.searchTimer);renderSearchSuggestions();state.searchTimer=setTimeout(render,120);});
    elements.searchInput.addEventListener('focus',renderSearchSuggestions);
    elements.clearSearch.addEventListener('click',()=>{elements.searchInput.value='';render();renderSearchSuggestions();elements.searchInput.focus();});
    elements.filtersButton.addEventListener('click',()=>openPanel(elements.filtersPanel));
    elements.settingsButton.addEventListener('click',()=>openPanel(elements.settingsPanel));
    elements.panelBackdrop.addEventListener('click',closePanels);
    document.querySelectorAll('.panel-close').forEach(button=>button.addEventListener('click',closePanels));
    elements.clearFiltersButton.addEventListener('click',clearAllFilters);

    elements.themeToggle.addEventListener('click',()=>{prefs.theme=prefs.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=prefs.theme;updateThemeButton();savePreferences();});
    elements.iconMode.addEventListener('change',()=>{prefs.iconMode=elements.iconMode.value;savePreferences();render();});
    elements.cardStyle.addEventListener('change',()=>{prefs.cardStyle=elements.cardStyle.value;savePreferences();render();});
    elements.progressDisplay.addEventListener('change',()=>{prefs.progressDisplay=elements.progressDisplay.value;savePreferences();render();});
    elements.formMode.addEventListener('change',()=>{prefs.formMode=elements.formMode.value;savePreferences();render();});
    elements.archiveMode.addEventListener('change',()=>{prefs.archiveMode=elements.archiveMode.value;savePreferences();render();});
    elements.hideUnusedAssets.addEventListener('change',()=>{prefs.hideUnusedAssets=elements.hideUnusedAssets.checked;savePreferences();render();});
    elements.abilityFilter.addEventListener('change',()=>{state.ability=elements.abilityFilter.value;render();syncRoute({replace:true});});
    elements.progressFilter.addEventListener('change',()=>{state.progressFilter=elements.progressFilter.value;render();syncRoute({replace:true});});
    elements.sortMode.addEventListener('change',()=>{state.sortMode=elements.sortMode.value;render();syncRoute({replace:true});});
    if(elements.groupMode)elements.groupMode.addEventListener('change',()=>{state.groupMode=elements.groupMode.value;render();syncRoute({replace:true});});
    elements.galleryRelationFilter.addEventListener('change',()=>{state.galleryRelation=elements.galleryRelationFilter.value;render();syncRoute({replace:true});});
    if (elements.addStatFilter) elements.addStatFilter.addEventListener('click',()=>{
        const key=elements.statBuilderStat.value; const bound=elements.statBuilderOp.value; const value=elements.statBuilderValue.value;
        if(!key||value==='')return;
        ensureStatRange(key)[bound]=value; elements.statBuilderValue.value=''; populateFilters(); render(); syncRoute({replace:true});
    });
    if (elements.statBuilderValue) elements.statBuilderValue.addEventListener('keydown',event=>{if(event.key==='Enter')elements.addStatFilter.click();});

    elements.modalClose.addEventListener('click',()=>closeModal());
    elements.modalCopyLink.addEventListener('click',copyCurrentLink);
    elements.modalShare.addEventListener('click',shareCurrent);
    elements.detailModal.addEventListener('click',event=>{if(event.target===elements.detailModal)closeModal();});
    document.addEventListener('keydown',event=>{
        const editable=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable;
        if((event.key==='/'&&!editable)||((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k')){event.preventDefault();elements.searchInput.focus();elements.searchInput.select();renderSearchSuggestions();return;}
        if(event.key==='Escape'){hideSearchSuggestions();if(!elements.detailModal.classList.contains('hidden'))closeModal();else closePanels();}
    });
    document.addEventListener('click',event=>{if(elements.searchSuggestions&&!event.target.closest('.search-wrap'))hideSearchSuggestions();});
    window.addEventListener('popstate',()=>applyRoute());

    loadPreferences();
    loadAllData();
})();
</script>
</body>
</html>

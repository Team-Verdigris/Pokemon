<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Verdigris Pokémon Asset Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f4f6f8;
            --panel: #ffffff;
            --border: #d8dde3;
            --text: #222222;
            --muted: #6e7681;
            --accent: #315f7d;
            --success: #426b43;
            --success-soft: #eaf4eb;
            --danger: #a33a3a;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 22px 24px;
        }

        .header-inner {
            width: min(1500px, calc(100% - 20px));
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        main {
            width: min(1500px, calc(100% - 32px));
            margin: 22px auto 48px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: end;
            margin-bottom: 24px;
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            color: var(--muted);
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input[type="search"],
        select {
            min-height: 38px;
            padding: 8px 10px;
            border: 1px solid #c7ccd2;
            border-radius: 6px;
            background: #ffffff;
            color: var(--text);
            font-size: 14px;
        }

        input[type="search"] {
            width: 320px;
            max-width: 70vw;
        }

        select {
            min-width: 160px;
        }

        .folder-section {
            margin-bottom: 34px;
        }

        .folder-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .folder-title {
            margin: 0;
            font-size: 20px;
        }

        .folder-count {
            color: var(--muted);
            font-size: 13px;
        }

        .asset-grid,
        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 14px;
        }

        .asset-card,
        .pokemon-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .asset-card {
            padding: 10px;
        }

        .asset-preview,
        .pokemon-cover {
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(45deg, #eceff1 25%, transparent 25%),
                linear-gradient(-45deg, #eceff1 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #eceff1 75%),
                linear-gradient(-45deg, transparent 75%, #eceff1 75%);
            background-size: 16px 16px;
            background-position:
                0 0,
                0 8px,
                8px -8px,
                -8px 0;
        }

        .asset-preview {
            position: relative;
            min-height: 160px;
            margin-bottom: 8px;
            overflow: hidden;
            border-radius: 5px;
        }

        .asset-preview img {
            max-width: 100%;
            max-height: 180px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .asset-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
            font-size: 12px;
        }

        .asset-warning {
            margin-top: 5px;
            color: var(--danger);
            font-size: 11px;
            text-align: center;
        }

        .hover-stack {
            position: relative;
            width: 100%;
            min-height: 160px;
        }

        .hover-stack img {
            position: absolute;
            inset: 50% auto auto 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.15s ease;
        }

        .hover-stack .shiny-image {
            opacity: 0;
        }

        .hover-stack.has-shiny:hover .normal-image {
            opacity: 0;
        }

        .hover-stack.has-shiny:hover .shiny-image {
            opacity: 1;
        }

        .hover-stack.missing-shiny:hover .normal-image {
            opacity: 0.5;
        }

        .hover-indicator {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 3;
            display: flex;
            width: 24px;
            height: 24px;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            border-radius: 50%;
            line-height: 1;
            transition:
                opacity 0.15s ease,
                transform 0.15s ease;
            transform: scale(0.85);
        }

        .shiny-indicator {
            color: #c79600;
            font-size: 18px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        }

        .missing-shiny-indicator {
            color: #c62828;
            font-size: 22px;
            font-weight: bold;
        }

        .hover-stack.has-shiny:hover .shiny-indicator,
        .hover-stack.missing-shiny:hover .missing-shiny-indicator {
            opacity: 1;
            transform: scale(1);
        }

        .toggle-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .toggle-stack {
            position: relative;
            min-height: 150px;
        }

        .toggle-stack img {
            position: absolute;
            inset: 50% auto auto 50%;
            transform: translate(-50%, -50%);
        }

        .toggle-stack .shiny-image {
            display: none;
        }

        .shiny-toggle-button,
        .view-assets-button {
            border: 1px solid #bfc6cc;
            border-radius: 5px;
            background: #ffffff;
            cursor: pointer;
            font-size: 12px;
        }

        .shiny-toggle-button {
            align-self: center;
            padding: 5px 10px;
        }

        .pokemon-card {
            display: flex;
            flex-direction: column;
        }

        .pokemon-cover {
            min-height: 220px;
            padding: 12px;
        }

        .pokemon-cover img {
            max-width: 100%;
            max-height: 220px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .pokemon-body {
            padding: 12px;
        }

        .pokemon-name {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .asset-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px 8px;
            margin-bottom: 10px;
        }

        .asset-status {
            font-size: 12px;
        }

        .asset-status.exists {
            color: var(--success);
        }

        .asset-status.missing {
            color: var(--danger);
        }

        .complete-summary {
            margin-top: 10px;
            padding: 8px;
            border-radius: 5px;
            background: var(--success-soft);
            color: var(--success);
            font-size: 12px;
        }

        .view-assets-button {
            width: 100%;
            margin-top: 10px;
            padding: 8px 10px;
            color: var(--accent);
            font-weight: bold;
        }

        .view-assets-button:hover {
            background: #f5f7f9;
        }

        .icon-animation {
            display: inline-block;
            flex: 0 0 auto;
            background-repeat: no-repeat;
            background-position: left top;
            background-size: 200% 100%;
            image-rendering: pixelated;
            animation: icon-two-frame-animation 0.5s steps(1, end) infinite;
        }

        @keyframes icon-two-frame-animation {
            0%,
            49.999% {
                background-position: left top;
            }

            50%,
            100% {
                background-position: right top;
            }
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.65);
        }

        .modal {
            width: min(1000px, 100%);
            max-height: calc(100vh - 48px);
            overflow: auto;
            background: var(--panel);
            border-radius: 10px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        }

        .modal-header {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 18px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            margin: 0;
            font-size: 20px;
        }

        .modal-close {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }

        .modal-body {
            padding: 18px;
        }

        .modal-asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .modal-asset {
            display: flex;
            min-height: 220px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .modal-asset-preview {
            display: flex;
            width: 100%;
            min-height: 170px;
            flex: 1;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            background:
                linear-gradient(45deg, #eceff1 25%, transparent 25%),
                linear-gradient(-45deg, #eceff1 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #eceff1 75%),
                linear-gradient(-45deg, transparent 75%, #eceff1 75%);
            background-size: 16px 16px;
            background-position:
                0 0,
                0 8px,
                8px -8px,
                -8px 0;
            border-radius: 5px;
        }

        .modal-asset-preview img {
            max-width: 100%;
            max-height: 190px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .modal-asset-label {
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        .modal-asset-missing {
            color: var(--muted);
            font-size: 12px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {
            main {
                width: calc(100% - 20px);
            }

            .toolbar {
                align-items: stretch;
            }

            input[type="search"] {
                width: 100%;
                max-width: none;
            }

            .control-group {
                flex: 1 1 100%;
            }

            .asset-grid,
            .pokemon-grid {
                grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
                gap: 10px;
            }

            .modal-backdrop {
                padding: 10px;
            }

            .modal {
                max-height: calc(100vh - 20px);
            }

            .modal-asset-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1>Team Verdigris Pokémon Asset Viewer</h1>

        <p class="subtitle">
            Browse artwork and sprites from the Team-Verdigris / Pokemon repository.
        </p>
    </div>
</header>

<main>

    <div class="toolbar">

        <div class="control-group">
            <label for="searchInput">Search</label>

            <input
                type="search"
                id="searchInput"
                placeholder="Search Pokémon or filename..."
                autocomplete="off"
            >
        </div>

        <div class="control-group">
            <label for="viewMode">View</label>

            <select id="viewMode">
                <option value="folder">By Folder</option>
                <option value="pokemon">By Pokémon</option>
            </select>
        </div>

        <div class="control-group">
            <label for="shinyMode">Shiny Display</label>

            <select id="shinyMode">
                <option value="separate">Separate</option>
                <option value="hover">Hover</option>
                <option value="toggle">Toggle</option>
            </select>
        </div>

        <div class="control-group">
            <label for="iconMode">Icon Display</label>

            <select id="iconMode">
                <option value="sheet">Sheet</option>
                <option value="animated">GIF</option>
            </select>
        </div>

    </div>

    <div id="content">
        <div class="status">
            Loading assets...
        </div>
    </div>

</main>

<div
    id="assetModal"
    class="modal-backdrop hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
>
    <div class="modal">
        <div class="modal-header">
            <h2
                id="modalTitle"
                class="modal-title"
            ></h2>

            <button
                id="modalClose"
                class="modal-close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>
        </div>

        <div
            id="modalBody"
            class="modal-body"
        ></div>
    </div>
</div>

<script>
    const organization = 'Team-Verdigris';
    const repository = 'Pokemon';

    const folderConfig = [
        {
            key: 'artwork',
            folder: 'Artworks',
            label: 'Artwork'
        },
        {
            key: 'backShiny',
            folder: 'Back shiny',
            label: 'Back Shiny'
        },
        {
            key: 'back',
            folder: 'Back',
            label: 'Back'
        },
        {
            key: 'egg',
            folder: 'Eggs',
            label: 'Egg'
        },
        {
            key: 'frontShiny',
            folder: 'Front shiny',
            label: 'Front Shiny'
        },
        {
            key: 'front',
            folder: 'Front',
            label: 'Front'
        },
        {
            key: 'icon',
            folder: 'Icons',
            label: 'Icon'
        },
        {
            key: 'shadow',
            folder: 'Shadow',
            label: 'Shadow'
        }
    ];

    const expectedPokemonAssets = [
        'artwork',
        'front',
        'frontShiny',
        'back',
        'backShiny',
        'icon'
    ];

    const content =
        document.getElementById('content');

    const searchInput =
        document.getElementById('searchInput');

    const viewMode =
        document.getElementById('viewMode');

    const shinyMode =
        document.getElementById('shinyMode');

    const iconMode =
        document.getElementById('iconMode');

    const assetModal =
        document.getElementById('assetModal');

    const modalTitle =
        document.getElementById('modalTitle');

    const modalBody =
        document.getElementById('modalBody');

    const modalClose =
        document.getElementById('modalClose');

    const folderData = {};

    const pokemonData =
        new Map();


    function isImageFile(filename) {
        const lower =
            filename.toLowerCase();

        return (
            lower.endsWith('.png') ||
            lower.endsWith('.jpg') ||
            lower.endsWith('.jpeg')
        );
    }


    function stripExtension(filename) {
        return filename.replace(
            /\.(png|jpg|jpeg)$/i,
            ''
        );
    }


    function normalizePokemonName(filename) {
        return stripExtension(filename).trim();
    }


    function comparePokemonNames(a, b) {
        return a.localeCompare(
            b,
            undefined,
            {
                numeric: true,
                sensitivity: 'base'
            }
        );
    }


    function getConfig(key) {
        return folderConfig.find(
            config =>
                config.key === key
        );
    }


    async function fetchFolder(folder) {
        const url =
            `https://api.github.com/repos/` +
            `${organization}/${repository}/contents/` +
            encodeURIComponent(folder);

        const response =
            await fetch(url);

        if (!response.ok) {
            throw new Error(
                `GitHub returned ${response.status} for ${folder}`
            );
        }

        const data =
            await response.json();

        if (!Array.isArray(data)) {
            throw new Error(
                `Unexpected GitHub response for ${folder}`
            );
        }

        return data
            .filter(file =>
                file.type === 'file' &&
                isImageFile(file.name)
            )
            .sort((a, b) =>
                comparePokemonNames(
                    a.name,
                    b.name
                )
            );
    }


    async function loadAllData() {
        content.innerHTML =
            '<div class="status">Loading assets...</div>';

        pokemonData.clear();

        await Promise.allSettled(
            folderConfig.map(
                async config => {
                    const files =
                        await fetchFolder(
                            config.folder
                        );

                    folderData[config.key] =
                        files;

                    files.forEach(file => {
                        const pokemonName =
                            normalizePokemonName(
                                file.name
                            );

                        if (
                            !pokemonData.has(
                                pokemonName
                            )
                        ) {
                            pokemonData.set(
                                pokemonName,
                                {
                                    name: pokemonName,
                                    assets: {}
                                }
                            );
                        }

                        pokemonData
                            .get(pokemonName)
                            .assets[config.key] =
                            file;
                    });
                }
            )
        );

        render();
    }


    function render() {
        closeAssetModal();

        if (
            viewMode.value ===
            'pokemon'
        ) {
            renderPokemonView();
        } else {
            renderFolderView();
        }
    }


    function renderFolderView() {
        content.innerHTML = '';

        const mode =
            shinyMode.value;

        if (mode === 'separate') {
            folderConfig.forEach(
                config => {
                    renderFolderSection(
                        config.label,
                        folderData[
                            config.key
                        ] || [],
                        config.key
                    );
                }
            );

            applySearch();
            return;
        }

        renderFolderSectionWithShinyPair(
            'Front',
            folderData.front || [],
            folderData.frontShiny || [],
            mode
        );

        renderFolderSectionWithShinyPair(
            'Back',
            folderData.back || [],
            folderData.backShiny || [],
            mode
        );

        folderConfig
            .filter(config =>
                ![
                    'front',
                    'frontShiny',
                    'back',
                    'backShiny'
                ].includes(
                    config.key
                )
            )
            .forEach(
                config => {
                    renderFolderSection(
                        config.label,
                        folderData[
                            config.key
                        ] || [],
                        config.key
                    );
                }
            );

        applySearch();
    }


    function renderFolderSection(
        label,
        files,
        configKey
    ) {
        const section =
            document.createElement(
                'section'
            );

        section.className =
            'folder-section';

        const header =
            document.createElement(
                'div'
            );

        header.className =
            'folder-header';

        const title =
            document.createElement(
                'h2'
            );

        title.className =
            'folder-title';

        title.textContent =
            label;

        const count =
            document.createElement(
                'span'
            );

        count.className =
            'folder-count';

        count.textContent =
            `${files.length} image` +
            `${files.length === 1 ? '' : 's'}`;

        const grid =
            document.createElement(
                'div'
            );

        grid.className =
            'asset-grid';

        files.forEach(file => {
            grid.appendChild(
                createBasicAssetCard(
                    file,
                    configKey
                )
            );
        });

        header.appendChild(title);
        header.appendChild(count);

        section.appendChild(header);
        section.appendChild(grid);

        content.appendChild(section);
    }


    function renderFolderSectionWithShinyPair(
        label,
        normalFiles,
        shinyFiles,
        mode
    ) {
        const normalMap =
            new Map(
                normalFiles.map(
                    file => [
                        normalizePokemonName(
                            file.name
                        ),
                        file
                    ]
                )
            );

        const shinyMap =
            new Map(
                shinyFiles.map(
                    file => [
                        normalizePokemonName(
                            file.name
                        ),
                        file
                    ]
                )
            );

        const allNames =
            Array.from(
                new Set([
                    ...normalMap.keys(),
                    ...shinyMap.keys()
                ])
            ).sort(
                comparePokemonNames
            );

        const section =
            document.createElement(
                'section'
            );

        section.className =
            'folder-section';

        const header =
            document.createElement(
                'div'
            );

        header.className =
            'folder-header';

        const title =
            document.createElement(
                'h2'
            );

        title.className =
            'folder-title';

        title.textContent =
            label;

        const count =
            document.createElement(
                'span'
            );

        count.className =
            'folder-count';

        count.textContent =
            `${allNames.length} Pokémon`;

        const grid =
            document.createElement(
                'div'
            );

        grid.className =
            'asset-grid';

        allNames.forEach(name => {
            grid.appendChild(
                createPairedAssetCard(
                    name,
                    normalMap.get(name),
                    shinyMap.get(name),
                    mode
                )
            );
        });

        header.appendChild(title);
        header.appendChild(count);

        section.appendChild(header);
        section.appendChild(grid);

        content.appendChild(section);
    }


    function createBasicAssetCard(
        file,
        assetType
    ) {
        const card =
            document.createElement(
                'div'
            );

        card.className =
            'asset-card';

        card.dataset.search =
            file.name.toLowerCase();

        const preview =
            document.createElement(
                'div'
            );

        preview.className =
            'asset-preview';

        let display;

        if (
            assetType === 'icon' &&
            iconMode.value ===
            'animated'
        ) {
            display =
                createAnimatedIcon(
                    file,
                    150,
                    150
                );
        } else {
            display =
                createImageElement(
                    file,
                    file.name
                );
        }

        const name =
            document.createElement(
                'div'
            );

        name.className =
            'asset-name';

        name.textContent =
            normalizePokemonName(
                file.name
            );

        preview.appendChild(
            display
        );

        card.appendChild(
            preview
        );

        card.appendChild(
            name
        );

        return card;
    }


    function createPairedAssetCard(
        name,
        normalFile,
        shinyFile,
        mode
    ) {
        const card =
            document.createElement(
                'div'
            );

        card.className =
            'asset-card';

        card.dataset.search =
            name.toLowerCase();

        const preview =
            document.createElement(
                'div'
            );

        preview.className =
            'asset-preview';

        if (mode === 'hover') {
            const stack =
                document.createElement(
                    'div'
                );

            stack.className =
                'hover-stack';

            if (normalFile) {
                const normal =
                    createImageElement(
                        normalFile,
                        `${name} normal`
                    );

                normal.className =
                    'normal-image';

                stack.appendChild(
                    normal
                );
            }

            if (shinyFile) {
                stack.classList.add(
                    'has-shiny'
                );

                const shiny =
                    createImageElement(
                        shinyFile,
                        `${name} shiny`
                    );

                shiny.className =
                    'shiny-image';

                stack.appendChild(
                    shiny
                );

                const star =
                    document.createElement(
                        'div'
                    );

                star.className =
                    'hover-indicator shiny-indicator';

                star.textContent =
                    '★';

                star.title =
                    'Shiny';

                stack.appendChild(
                    star
                );
            } else {
                stack.classList.add(
                    'missing-shiny'
                );

                const missingIndicator =
                    document.createElement(
                        'div'
                    );

                missingIndicator.className =
                    'hover-indicator missing-shiny-indicator';

                missingIndicator.textContent =
                    '⊘';

                missingIndicator.title =
                    'No shiny sprite';

                stack.appendChild(
                    missingIndicator
                );
            }

            preview.appendChild(
                stack
            );
        }

        if (mode === 'toggle') {
            const wrap =
                document.createElement(
                    'div'
                );

            wrap.className =
                'toggle-wrap';

            const stack =
                document.createElement(
                    'div'
                );

            stack.className =
                'toggle-stack';

            let normal = null;
            let shiny = null;

            if (normalFile) {
                normal =
                    createImageElement(
                        normalFile,
                        `${name} normal`
                    );

                normal.className =
                    'normal-image';

                stack.appendChild(
                    normal
                );
            }

            if (shinyFile) {
                shiny =
                    createImageElement(
                        shinyFile,
                        `${name} shiny`
                    );

                shiny.className =
                    'shiny-image';

                stack.appendChild(
                    shiny
                );
            }

            wrap.appendChild(
                stack
            );

            if (
                normalFile &&
                shinyFile
            ) {
                const button =
                    document.createElement(
                        'button'
                    );

                button.className =
                    'shiny-toggle-button';

                button.textContent =
                    'Show Shiny';

                let showingShiny =
                    false;

                button.addEventListener(
                    'click',
                    event => {
                        event.stopPropagation();

                        showingShiny =
                            !showingShiny;

                        normal.style.display =
                            showingShiny
                                ? 'none'
                                : '';

                        shiny.style.display =
                            showingShiny
                                ? 'block'
                                : 'none';

                        button.textContent =
                            showingShiny
                                ? 'Show Normal'
                                : 'Show Shiny';
                    }
                );

                wrap.appendChild(
                    button
                );
            }

            preview.appendChild(
                wrap
            );
        }

        const nameElement =
            document.createElement(
                'div'
            );

        nameElement.className =
            'asset-name';

        nameElement.textContent =
            name;

        card.appendChild(
            preview
        );

        card.appendChild(
            nameElement
        );

        /*
         * In Hover mode, missing shiny is indicated
         * by the faded sprite and red ⊘ instead of
         * additional text underneath the card.
         */
        if (
            mode !== 'hover'
        ) {
            if (!normalFile) {
                const warning =
                    document.createElement(
                        'div'
                    );

                warning.className =
                    'asset-warning';

                warning.textContent =
                    'Missing normal';

                card.appendChild(
                    warning
                );
            } else if (!shinyFile) {
                const warning =
                    document.createElement(
                        'div'
                    );

                warning.className =
                    'asset-warning';

                warning.textContent =
                    'Missing shiny';

                card.appendChild(
                    warning
                );
            }
        }

        return card;
    }


    function createImageElement(
        file,
        alt
    ) {
        const image =
            document.createElement(
                'img'
            );

        image.src =
            file.download_url;

        image.alt =
            alt;

        image.loading =
            'lazy';

        return image;
    }


    function createAnimatedIcon(
        file,
        maxWidth,
        maxHeight
    ) {
        const wrapper =
            document.createElement(
                'div'
            );

        const loader =
            new Image();

        loader.onload = () => {
            const frameWidth =
                loader.naturalWidth / 2;

            const frameHeight =
                loader.naturalHeight;

            if (
                frameWidth <= 0 ||
                frameHeight <= 0
            ) {
                return;
            }

            let scale =
                Math.min(
                    maxWidth / frameWidth,
                    maxHeight / frameHeight
                );

            if (
                !Number.isFinite(scale) ||
                scale <= 0
            ) {
                scale = 1;
            }

            const width =
                Math.max(
                    1,
                    Math.floor(
                        frameWidth *
                        scale
                    )
                );

            const height =
                Math.max(
                    1,
                    Math.floor(
                        frameHeight *
                        scale
                    )
                );

            wrapper.style.width =
                `${width}px`;

            wrapper.style.height =
                `${height}px`;

            wrapper.style.backgroundImage =
                `url("${file.download_url}")`;

            wrapper.className =
                'icon-animation';
        };

        loader.src =
            file.download_url;

        return wrapper;
    }


    function renderPokemonView() {
        content.innerHTML = '';

        const grid =
            document.createElement(
                'div'
            );

        grid.className =
            'pokemon-grid';

        const pokemon =
            Array.from(
                pokemonData.values()
            ).sort(
                (a, b) =>
                    comparePokemonNames(
                        a.name,
                        b.name
                    )
            );

        pokemon.forEach(entry => {
            grid.appendChild(
                createPokemonCard(
                    entry
                )
            );
        });

        content.appendChild(
            grid
        );

        applySearch();
    }


    function createPokemonCard(
        entry
    ) {
        const card =
            document.createElement(
                'article'
            );

        card.className =
            'pokemon-card';

        card.dataset.search =
            entry.name.toLowerCase();

        const cover =
            document.createElement(
                'div'
            );

        cover.className =
            'pokemon-cover';

        const coverFile =
            entry.assets.artwork ||
            entry.assets.front ||
            entry.assets.icon ||
            entry.assets.back;

        if (coverFile) {
            let coverDisplay;

            if (
                coverFile ===
                entry.assets.icon &&
                iconMode.value ===
                'animated'
            ) {
                coverDisplay =
                    createAnimatedIcon(
                        coverFile,
                        200,
                        200
                    );
            } else {
                coverDisplay =
                    createImageElement(
                        coverFile,
                        entry.name
                    );
            }

            cover.appendChild(
                coverDisplay
            );
        } else {
            cover.textContent =
                'No preview';
        }

        const body =
            document.createElement(
                'div'
            );

        body.className =
            'pokemon-body';

        const title =
            document.createElement(
                'h2'
            );

        title.className =
            'pokemon-name';

        title.textContent =
            entry.name;

        const assetList =
            document.createElement(
                'div'
            );

        assetList.className =
            'asset-list';

        let missingRequired =
            0;

        expectedPokemonAssets.forEach(
            key => {
                const config =
                    getConfig(key);

                const exists =
                    Boolean(
                        entry.assets[key]
                    );

                const status =
                    document.createElement(
                        'div'
                    );

                status.className =
                    `asset-status ` +
                    `${
                        exists
                            ? 'exists'
                            : 'missing'
                    }`;

                status.textContent =
                    `${
                        exists
                            ? '✓'
                            : '✗'
                    } ${config.label}`;

                assetList.appendChild(
                    status
                );

                if (!exists) {
                    missingRequired++;
                }
            }
        );

        body.appendChild(
            title
        );

        body.appendChild(
            assetList
        );

        if (
            missingRequired === 0
        ) {
            const summary =
                document.createElement(
                    'div'
                );

            summary.className =
                'complete-summary';

            summary.textContent =
                'All required image types exist.';

            body.appendChild(
                summary
            );
        }

        const button =
            document.createElement(
                'button'
            );

        button.className =
            'view-assets-button';

        button.type =
            'button';

        button.textContent =
            'View All Assets';

        button.addEventListener(
            'click',
            () => {
                openAssetModal(
                    entry
                );
            }
        );

        body.appendChild(
            button
        );

        card.appendChild(
            cover
        );

        card.appendChild(
            body
        );

        return card;
    }


    function openAssetModal(
        entry
    ) {
        modalTitle.textContent =
            entry.name;

        modalBody.innerHTML = '';

        const grid =
            document.createElement(
                'div'
            );

        grid.className =
            'modal-asset-grid';

        /*
         * Popup shows every configured asset,
         * including Egg and Shadow.
         */
        folderConfig.forEach(
            config => {
                const item =
                    document.createElement(
                        'div'
                    );

                item.className =
                    'modal-asset';

                const preview =
                    document.createElement(
                        'div'
                    );

                preview.className =
                    'modal-asset-preview';

                const file =
                    entry.assets[
                        config.key
                    ];

                if (file) {
                    let display;

                    if (
                        config.key ===
                            'icon' &&
                        iconMode.value ===
                            'animated'
                    ) {
                        display =
                            createAnimatedIcon(
                                file,
                                170,
                                170
                            );
                    } else {
                        display =
                            createImageElement(
                                file,
                                `${entry.name} ${config.label}`
                            );
                    }

                    preview.appendChild(
                        display
                    );
                } else {
                    const missing =
                        document.createElement(
                            'div'
                        );

                    missing.className =
                        'modal-asset-missing';

                    missing.textContent =
                        'Not available';

                    preview.appendChild(
                        missing
                    );
                }

                const label =
                    document.createElement(
                        'div'
                    );

                label.className =
                    'modal-asset-label';

                label.textContent =
                    config.label;

                item.appendChild(
                    preview
                );

                item.appendChild(
                    label
                );

                grid.appendChild(
                    item
                );
            }
        );

        modalBody.appendChild(
            grid
        );

        assetModal.classList.remove(
            'hidden'
        );

        document.body.style.overflow =
            'hidden';
    }


    function closeAssetModal() {
        assetModal.classList.add(
            'hidden'
        );

        modalBody.innerHTML = '';

        document.body.style.overflow =
            '';
    }


    function applySearch() {
        const query =
            searchInput.value
                .trim()
                .toLowerCase();

        document
            .querySelectorAll(
                '.asset-card, .pokemon-card'
            )
            .forEach(card => {
                const matches =
                    card.dataset.search
                        .includes(query);

                card.classList.toggle(
                    'hidden',
                    !matches
                );
            });

        document
            .querySelectorAll(
                '.folder-section'
            )
            .forEach(section => {
                const visibleCards =
                    section.querySelectorAll(
                        '.asset-card:not(.hidden)'
                    );

                section.classList.toggle(
                    'hidden',
                    query !== '' &&
                    visibleCards.length === 0
                );
            });
    }


    modalClose.addEventListener(
        'click',
        closeAssetModal
    );

    assetModal.addEventListener(
        'click',
        event => {
            if (
                event.target ===
                assetModal
            ) {
                closeAssetModal();
            }
        }
    );

    document.addEventListener(
        'keydown',
        event => {
            if (
                event.key ===
                    'Escape' &&
                !assetModal.classList.contains(
                    'hidden'
                )
            ) {
                closeAssetModal();
            }
        }
    );

    searchInput.addEventListener(
        'input',
        applySearch
    );

    viewMode.addEventListener(
        'change',
        render
    );

    shinyMode.addEventListener(
        'change',
        render
    );

    iconMode.addEventListener(
        'change',
        render
    );


    loadAllData();
</script>

</body>
</html>

    function parseSearchQuery(query) {
        const filters = { text: '', types: [], ability: null, stats: [] };
        let remaining = ` ${query || ''} `;

        remaining = remaining.replace(/\btype:([^\s]+)/gi, (_, value) => { filters.types.push(value.toUpperCase()); return ' '; });
        remaining = remaining.replace(/\bability:([^\s]+)/gi, (_, value) => { filters.ability = value.replace(/[_-]+/g,' ').toLowerCase(); return ' '; });

        const aliasMap = Object.fromEntries(STAT_CONFIG.map(stat => [stat.alias, stat.key]));
        const statRegex = /\b(hp|atk|def|spa|spd|spe|bst)\s*(>=|<=|>|<|=)\s*(\d+)\b/gi;
        remaining = remaining.replace(statRegex, (_, alias, op, value) => {
            filters.stats.push({ key: aliasMap[alias.toLowerCase()], op, value: Number(value) });
            return ' ';
        });

        filters.text = remaining.trim().toLowerCase();
        return filters;
    }

    function compareNumeric(value, op, target) {
        if (!Number.isFinite(value)) return false;
        if (op === '>=') return value >= target;
        if (op === '<=') return value <= target;
        if (op === '>') return value > target;
        if (op === '<') return value < target;
        return value === target;
    }

    function recordMatchesFilters(record, queryFilters) {
        if (record.parsed.isOld) {
            if (prefs.archiveMode === 'hidden') return false;
            if (prefs.archiveMode === 'search' && !elements.searchInput.value.trim()) return false;
        }

        if (queryFilters.text && !record.searchText.includes(queryFilters.text)) return false;

        const typeIds = new Set((record.dex?.types || []).map(type => type.id.toUpperCase()));
        const requestedTypes = new Set([...state.selectedTypes, ...queryFilters.types]);
        if ([...requestedTypes].some(type => !typeIds.has(type))) return false;

        const abilityNeedle = (state.ability || queryFilters.ability || '').toLowerCase();
        if (abilityNeedle) {
            const abilities = [...(record.dex?.abilities?.standard || []), ...(record.dex?.abilities?.hidden || [])];
            const matched = abilities.some(ability => ability.id.toLowerCase() === abilityNeedle || ability.name.toLowerCase().includes(abilityNeedle));
            if (!matched) return false;
        }

        const stats = record.dex?.base_stats || {};
        for (const filter of queryFilters.stats) {
            if (!compareNumeric(Number(stats[filter.key]), filter.op, filter.value)) return false;
        }

        for (const stat of STAT_CONFIG) {
            const range = state.statRanges[stat.key] || {};
            const value = Number(stats[stat.key]);
            if (range.min !== null && range.min !== undefined && range.min !== '' && (!Number.isFinite(value) || value < Number(range.min))) return false;
            if (range.max !== null && range.max !== undefined && range.max !== '' && (!Number.isFinite(value) || value > Number(range.max))) return false;
        }

        if (state.progressFilter !== 'all') {
            const progress = getRecordProgress(record);
            if (state.progressFilter === 'complete' && progress.complete !== progress.total) return false;
            if (state.progressFilter === 'incomplete' && progress.complete >= progress.total) return false;
            if (state.progressFilter.startsWith('missing:')) {
                const key = state.progressFilter.slice(8);
                if (record.assets[key]) return false;
            }
        }
        return true;
    }

    function groupMatchesFilters(group, queryFilters) {
        return group.forms.some(record => recordMatchesFilters(record, queryFilters));
    }

    function sortPokemon(items, grouped) {
        const getRecord = item => grouped ? (item.displayRecord || item.primary) : item;
        return [...items].sort((a,b) => {
            const ar = getRecord(a), br = getRecord(b);
            const mode = state.sortMode;
            if (mode === 'name') return compareText(getDisplayName(ar), getDisplayName(br));
            if (mode === 'progressAsc' || mode === 'progressDesc') {
                const diff = getRecordProgress(ar).complete - getRecordProgress(br).complete;
                return mode === 'progressAsc' ? diff : -diff;
            }
            if (mode === 'dex') return (ar.dex?.pokedex_number ?? 999999) - (br.dex?.pokedex_number ?? 999999) || compareText(getDisplayName(ar),getDisplayName(br));
            const statKey = mode.replace(/^stat:/,'');
            if (mode.startsWith('stat:')) return (Number(br.dex?.base_stats?.[statKey]) || -1) - (Number(ar.dex?.base_stats?.[statKey]) || -1);
            return 0;
        });
    }

    function renderProgress(container, record) {
        if (prefs.progressDisplay === 'none') return;
        const progress = getRecordProgress(record);
        if (prefs.progressDisplay === 'text') {
            const text = document.createElement('div');
            text.className = 'progress-text';
            text.textContent = `${progress.complete}/${progress.total} key graphics`;
            container.appendChild(text);
            return;
        }
        const meter = document.createElement('div');
        meter.className = 'progress-meter';
        getRequiredConfig().forEach(config => {
            const segment = document.createElement('div');
            segment.className = `progress-segment${record.assets[config.key] ? ' complete' : ''}`;
            segment.title = `${config.label}: ${record.assets[config.key] ? 'Complete' : 'Missing'}`;
            meter.appendChild(segment);
        });
        const text = document.createElement('div');
        text.className = 'progress-text';
        text.textContent = `${progress.complete}/${progress.total}`;
        container.append(meter,text);
    }

    function makePokemonCard(record, group = null) {
        const card = document.createElement('article');
        card.className = 'pokemon-card';
        card.tabIndex = 0;
        card.setAttribute('role','button');

        const cover = document.createElement('div');
        cover.className = 'pokemon-cover checkerboard';
        const coverFile = getCoverForRecord(record);
        if (coverFile) {
            if (!isGalleryCover(coverFile) && coverFile === record.assets.icon && prefs.iconMode === 'animated') {
                cover.appendChild(createAnimatedIcon(coverFile,180,180));
            } else {
                cover.appendChild(createImage(coverFile,getDisplayName(record),{ pixelated: !isGalleryCover(coverFile) && coverFile !== record.assets.artwork }));
            }
        } else {
            const missing = document.createElement('span');
            missing.className = 'missing-asset';
            missing.textContent = 'No artwork yet';
            cover.appendChild(missing);
        }

        if (record.parsed.isOld) {
            const badge = document.createElement('span');
            badge.className = 'archive-badge';
            badge.style.position = 'absolute';
            badge.style.top = '8px';
            badge.style.right = '8px';
            badge.textContent = 'Archived';
            cover.appendChild(badge);
        }

        const body = document.createElement('div');
        body.className = 'pokemon-card-body';
        const eyebrow = document.createElement('div');
        eyebrow.className = 'card-eyebrow';
        eyebrow.textContent = record.dex?.pokedex_number ? `#${String(record.dex.pokedex_number).padStart(3,'0')}` : 'Asset record';

        const titleRow = document.createElement('div');
        titleRow.className = 'card-title-row';
        const title = document.createElement('h2');
        title.className = 'card-title';
        title.textContent = record.dex?.pokemon_name || record.parsed.baseName;
        titleRow.appendChild(title);

        if (group && group.forms.length > 1) {
            const forms = document.createElement('span');
            forms.className = 'form-count';
            forms.textContent = `${group.forms.length} forms`;
            titleRow.appendChild(forms);
        } else if (getVariantLabel(record)) {
            const form = document.createElement('span');
            form.className = 'form-count';
            form.textContent = getVariantLabel(record);
            titleRow.appendChild(form);
        }

        const subtitle = document.createElement('div');
        subtitle.className = 'card-subtitle';
        subtitle.textContent = record.dex?.species_name || (record.gallery.length ? `${record.gallery.length} Gallery item${record.gallery.length === 1 ? '' : 's'}` : '');

        const chips = document.createElement('div');
        chips.className = 'card-chip-row';
        (record.dex?.types || []).forEach(type => chips.appendChild(makeTypeChip(type)));
        const galleryCount = group ? group.gallery.length : record.gallery.length;
        if (galleryCount) {
            const badge = document.createElement('span');
            badge.className = 'gallery-count';
            badge.textContent = `Gallery ${galleryCount}`;
            chips.appendChild(badge);
        }
        if (record.archivedVariants.length) {
            const badge = document.createElement('span');
            badge.className = 'archive-badge';
            badge.textContent = `Archive ${record.archivedVariants.length}`;
            chips.appendChild(badge);
        }

        body.append(eyebrow,titleRow,subtitle,chips);
        renderProgress(body,record);
        card.append(cover,body);

        const open = () => openPokemon(record);
        card.addEventListener('click',open);
        card.addEventListener('keydown',event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } });
        applyCardColor(card,record);
        return card;
    }

    function renderPokemonView() {
        const query = parseSearchQuery(elements.searchInput.value);
        const grouped = prefs.formMode === 'grouped';
        let items = grouped
            ? state.speciesGroups
                .map(group => {
                    const matchingForms = group.forms.filter(
                        record => recordMatchesFilters(record, query)
                    );
                    if (!matchingForms.length) return null;
                    return {
                        ...group,
                        displayRecord:
                            matchingForms.includes(group.primary)
                                ? group.primary
                                : matchingForms[0]
                    };
                })
                .filter(Boolean)
            : state.pokemonRecords.filter(record => recordMatchesFilters(record,query));
        items = sortPokemon(items,grouped);

        const wrapper = document.createDocumentFragment();
        const heading = makeViewHeading('Pokémon', `${items.length} ${grouped ? 'species' : 'records'}${state.snapshot ? ` • snapshot ${state.snapshotGeneratedAt ? new Date(state.snapshotGeneratedAt).toLocaleString() : 'loaded'}` : ' • asset-only mode'}`);
        wrapper.appendChild(heading);

        if (!items.length) {
            const status = document.createElement('div');
            status.className = 'status';
            status.textContent = 'No Pokémon match the current search and filters.';
            wrapper.appendChild(status);
        } else {
            const grid = document.createElement('div');
            grid.className = 'pokemon-grid';
            items.forEach(item => {
                const record = grouped ? (item.displayRecord || item.primary) : item;
                grid.appendChild(makePokemonCard(record,grouped ? item : null));
            });
            wrapper.appendChild(grid);
        }

        elements.content.replaceChildren(wrapper);
    }

    function makeViewHeading(titleText, metaText, controls = null) {
        const heading = document.createElement('div');
        heading.className = 'view-heading';
        const left = document.createElement('div');
        const title = document.createElement('h1');
        title.className = 'view-title';
        title.textContent = titleText;
        const meta = document.createElement('div');
        meta.className = 'view-meta';
        meta.textContent = metaText;
        left.append(title,meta);
        heading.appendChild(left);
        if (controls) heading.appendChild(controls);
        return heading;
    }

    function galleryItemMatches(item) {
        const query = elements.searchInput.value.trim().toLowerCase();
        if (query && !item.searchText.includes(query)) return false;
        if (state.galleryRelation === 'pokemon' && !item.pokemon.length) return false;
        if (state.galleryRelation === 'general' && item.pokemon.length) return false;
        if (state.selectedGalleryCategory) {
            const target = state.selectedGalleryCategory.toLowerCase();
            if (!(item.categoryPath.toLowerCase() === target || item.categoryPath.toLowerCase().startsWith(`${target}/`))) return false;
        }
        return true;
    }

    function getTopGalleryCategories() {
        return [...new Set(state.galleryItems.map(item => item.categories[0]).filter(Boolean))].sort(compareText);
    }

    function getGalleryCategoryNavigation() {
        const currentParts = state.selectedGalleryCategory
            ? state.selectedGalleryCategory.split('/').filter(Boolean)
            : [];
        const childIndex = currentParts.length;
        const prefix = currentParts.join('/');
        const children = new Set();

        state.galleryItems.forEach(item => {
            if (
                prefix &&
                item.categoryPath !== prefix &&
                !item.categoryPath.startsWith(`${prefix}/`)
            ) {
                return;
            }

            const child = item.categories[childIndex];
            if (child) children.add(child);
        });

        return {
            currentParts,
            children: [...children].sort(compareText)
        };
    }

    function makeGalleryCard(item) {
        const card = document.createElement('article');
        card.className = 'gallery-card';
        card.tabIndex = 0;
        card.setAttribute('role','button');
        const cover = document.createElement('div');
        cover.className = 'gallery-cover checkerboard';
        cover.appendChild(createImage(item,item.title));
        const body = document.createElement('div');
        body.className = 'gallery-card-body';
        const category = document.createElement('div');
        category.className = 'gallery-category';
        category.textContent = item.categoryPath || 'Uncategorized';
        const title = document.createElement('h2');
        title.className = 'card-title';
        title.textContent = item.title;
        const chips = document.createElement('div');
        chips.className = 'card-chip-row';
        item.pokemon.slice(0,4).forEach(base => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'pokemon-chip';
            chip.textContent = base;
            chip.addEventListener('click',event => {
                event.stopPropagation();
                const group = state.speciesByBase.get(base.toLowerCase());
                if (group) openPokemon(group.primary);
            });
            chips.appendChild(chip);
        });
        if (item.pokemon.length > 4) {
            const extra = document.createElement('span');
            extra.className = 'tag-chip';
            extra.textContent = `+${item.pokemon.length - 4}`;
            chips.appendChild(extra);
        }
        item.tags.slice(0,3).forEach(tag => {
            const chip = document.createElement('span');
            chip.className = 'tag-chip';
            chip.textContent = tag;
            chips.appendChild(chip);
        });
        body.append(category,title,chips);
        card.append(cover,body);
        const open = () => openGallery(item);
        card.addEventListener('click',open);
        card.addEventListener('keydown',event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } });
        return card;
    }

    function renderGalleryView() {
        const items = state.galleryItems.filter(galleryItemMatches);
        const controls = document.createElement('div');
        controls.className = 'view-controls';
        const select = document.createElement('select');
        select.className = 'compact-select';
        select.innerHTML = '<option value="all">All items</option><option value="pokemon">Pokémon-related</option><option value="general">General</option>';
        select.value = state.galleryRelation;
        select.addEventListener('change',() => { state.galleryRelation = select.value; elements.galleryRelationFilter.value = select.value; render(); syncRoute({ replace: true }); });
        controls.appendChild(select);

        const wrapper = document.createDocumentFragment();
        wrapper.appendChild(makeViewHeading('Gallery', `${items.length} of ${state.galleryItems.length} saved image${state.galleryItems.length === 1 ? '' : 's'}`,controls));

        const categories = document.createElement('div');
        categories.className = 'gallery-toolbar';
        const categoryNav = getGalleryCategoryNavigation();

        const all = document.createElement('button');
        all.type = 'button';
        all.className = `category-chip${state.selectedGalleryCategory ? '' : ' active'}`;
        all.textContent = 'All';
        all.addEventListener('click',() => {
            state.selectedGalleryCategory = '';
            render();
            syncRoute({ replace: true });
        });
        categories.appendChild(all);

        if (categoryNav.currentParts.length) {
            const up = document.createElement('button');
            up.type = 'button';
            up.className = 'category-chip';
            up.textContent = '← Up';
            up.addEventListener('click',() => {
                state.selectedGalleryCategory =
                    categoryNav.currentParts.slice(0, -1).join('/');
                render();
                syncRoute({ replace: true });
            });
            categories.appendChild(up);

            const current = document.createElement('span');
            current.className = 'filter-chip';
            current.textContent =
                `Gallery / ${categoryNav.currentParts.join(' / ')}`;
            categories.appendChild(current);
        }

        categoryNav.children.forEach(categoryName => {
            const path = [
                ...categoryNav.currentParts,
                categoryName
            ].join('/');
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'category-chip';
            chip.textContent = categoryName;
            chip.addEventListener('click',() => {
                state.selectedGalleryCategory = path;
                render();
                syncRoute({ replace: true });
            });
            categories.appendChild(chip);
        });
        wrapper.appendChild(categories);

        if (!items.length) {
            const status = document.createElement('div');
            status.className = 'status';
            status.textContent = state.galleryItems.length ? 'No Gallery items match the current search and filters.' : `No images were found under ${GALLERY_ROOT}/.`;
            wrapper.appendChild(status);
        } else {
            const grid = document.createElement('div');
            grid.className = 'gallery-grid';
            items.forEach(item => grid.appendChild(makeGalleryCard(item)));
            wrapper.appendChild(grid);
        }
        elements.content.replaceChildren(wrapper);
    }

    function getFolderFiles(key) {
        if (key === 'gallery') return state.galleryItems.map(item => ({ ...item, name: item.file, parsed: { originalStem: item.title } }));
        const raw = state.rawAssets[key] || [];
        const active = raw.filter(file => !file.parsed?.isOld);
        const legacyArchived = raw.filter(file => file.parsed?.isOld);
        const archived = [...legacyArchived, ...(state.archivedAssets[key] || [])];
        if (prefs.archiveMode === 'all') return [...active,...archived];
        if (prefs.archiveMode === 'search' && elements.searchInput.value.trim()) return [...active,...archived];
        return active;
    }

    function makeAssetCard(file, config) {
        const card = document.createElement('div');
        card.className = 'asset-card';
        const preview = document.createElement('div');
        preview.className = 'asset-preview checkerboard';
        if (config.key === 'icon' && prefs.iconMode === 'animated') preview.appendChild(createAnimatedIcon(file,145,145,true));
        else preview.appendChild(createImage(file,file.name,{ copyable: true, pixelated: config.key !== 'artwork' && config.key !== 'gallery' }));
        const body = document.createElement('div');
        body.className = 'asset-card-body';
        body.textContent = file.parsed?.originalStem || file.title || file.name;
        card.append(preview,body);
        return card;
    }

    function renderFolderView() {
        const visible = getActiveAssetConfig();
        const folderEntries = [...visible.map(config => ({ key: config.key, label: config.label })), { key: 'gallery', label: 'Gallery' }];
        if (!folderEntries.some(entry => entry.key === state.selectedFolder)) state.selectedFolder = folderEntries[0]?.key || 'artwork';
        const config = state.selectedFolder === 'gallery' ? { key: 'gallery', label: 'Gallery' } : ASSET_CONFIG.find(c => c.key === state.selectedFolder);
        let files = getFolderFiles(state.selectedFolder);
        const query = elements.searchInput.value.trim().toLowerCase();
        if (query) files = files.filter(file => escapeSearchText([file.name,file.path,file.title,file.categoryPath,file.parsed?.baseName,file.parsed?.originalStem].filter(Boolean).join(' ')).includes(query));

        const browser = document.createElement('div');
        browser.className = 'folder-browser';
        const sidebar = document.createElement('div');
        sidebar.className = 'folder-sidebar';
        folderEntries.forEach(entry => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = entry.key === state.selectedFolder ? 'active' : '';
            button.textContent = entry.label;
            button.addEventListener('click',() => { state.selectedFolder = entry.key; render(); syncRoute({ replace: true }); });
            sidebar.appendChild(button);
        });
        const area = document.createElement('div');
        const grid = document.createElement('div');
        grid.className = 'asset-grid';
        files.forEach(file => grid.appendChild(makeAssetCard(file,config)));
        area.appendChild(makeViewHeading(config.label, `${files.length} image${files.length === 1 ? '' : 's'}`));
        if (files.length) area.appendChild(grid);
        else {
            const status = document.createElement('div');
            status.className = 'status';
            status.textContent = 'No files match this folder and search.';
            area.appendChild(status);
        }
        browser.append(sidebar,area);
        elements.content.replaceChildren(browser);
    }

    function render() {
        updateNavigation();
        updateFilterPanels();
        renderActiveFilterBar();
        if (!state.loaded) return;
        if (state.currentView === 'gallery') renderGalleryView();
        else if (state.currentView === 'folder') renderFolderView();
        else renderPokemonView();
    }

    function updateNavigation() {
        document.querySelectorAll('.nav-button').forEach(button => button.classList.toggle('active',button.dataset.view === state.currentView));
        elements.searchInput.placeholder = state.currentView === 'gallery'
            ? 'Search Gallery titles, categories, Pokémon, tags…'
            : state.currentView === 'folder'
                ? 'Search files in this folder…'
                : 'Search Pokémon, types, abilities, stats…';
    }

    function updateFilterPanels() {
        const pokemon = state.currentView === 'pokemon';
        elements.pokemonFilterSection.classList.toggle('hidden',!pokemon);
        elements.statFilterSection.classList.toggle('hidden',!pokemon);
        elements.assetFilterSection.classList.toggle('hidden',state.currentView === 'gallery');
        elements.galleryFilterSection.classList.toggle('hidden',state.currentView !== 'gallery');
    }

    function renderActiveFilterBar() {
        const chips = [];
        state.selectedTypes.forEach(type => chips.push({ label: `Type: ${type}`, clear: () => state.selectedTypes.delete(type) }));
        if (state.ability) chips.push({ label: `Ability: ${state.ability}`, clear: () => { state.ability = ''; elements.abilityFilter.value = ''; } });
        STAT_CONFIG.forEach(stat => {
            const range = state.statRanges[stat.key] || {};
            if (range.min !== '' && range.min != null) chips.push({ label: `${stat.label} ≥ ${range.min}`, clear: () => { range.min = ''; syncStatInputs(); } });
            if (range.max !== '' && range.max != null) chips.push({ label: `${stat.label} ≤ ${range.max}`, clear: () => { range.max = ''; syncStatInputs(); } });
        });
        if (state.progressFilter !== 'all') chips.push({ label: `Assets: ${state.progressFilter}`, clear: () => { state.progressFilter = 'all'; elements.progressFilter.value = 'all'; } });
        if (state.currentView === 'gallery' && state.galleryRelation !== 'all') chips.push({ label: state.galleryRelation === 'pokemon' ? 'Pokémon-related' : 'General Gallery', clear: () => { state.galleryRelation = 'all'; elements.galleryRelationFilter.value = 'all'; } });
        if (state.currentView === 'gallery' && state.selectedGalleryCategory) chips.push({ label: state.selectedGalleryCategory, clear: () => state.selectedGalleryCategory = '' });

        elements.activeFilterBar.replaceChildren();
        chips.forEach(item => {
            const chip = document.createElement('span');
            chip.className = 'filter-chip';
            chip.append(document.createTextNode(item.label));
            const clear = document.createElement('button');
            clear.type = 'button';
            clear.textContent = '×';
            clear.addEventListener('click',() => { item.clear(); render(); syncRoute({ replace: true }); });
            chip.appendChild(clear);
            elements.activeFilterBar.appendChild(chip);
        });
        elements.activeFilterBar.classList.toggle('hidden',chips.length === 0);
    }

    function populateFilters() {
        const types = new Map();
        const abilities = new Map();
        state.pokemonRecords.forEach(record => {
            (record.dex?.types || []).forEach(type => types.set(type.id,type));
            [...(record.dex?.abilities?.standard || []), ...(record.dex?.abilities?.hidden || [])].forEach(ability => abilities.set(ability.id,ability));
        });

        elements.typeFilterGrid.replaceChildren();
        [...types.values()].sort((a,b)=>compareText(a.name,b.name)).forEach(type => {
            const chip = makeTypeChip(type,{ filterable: false });
            chip.disabled = false;
            chip.classList.toggle('selected',state.selectedTypes.has(type.id));
            chip.addEventListener('click',() => {
                if (state.selectedTypes.has(type.id)) state.selectedTypes.delete(type.id);
                else state.selectedTypes.add(type.id);
                populateFilters();
                render();
                syncRoute({ replace: true });
            });
            elements.typeFilterGrid.appendChild(chip);
        });

        elements.abilityFilter.innerHTML = '<option value="">Any ability</option>';
        [...abilities.values()].sort((a,b)=>compareText(a.name,b.name)).forEach(ability => {
            const option = document.createElement('option');
            option.value = ability.id;
            option.textContent = ability.name;
            elements.abilityFilter.appendChild(option);
        });
        elements.abilityFilter.value = state.ability;

        elements.statFilterGrid.replaceChildren();
        STAT_CONFIG.forEach(stat => {
            const minField = document.createElement('div');
            minField.className = 'field';
            const minLabel = document.createElement('label');
            minLabel.textContent = `${stat.label} minimum`;
            const min = document.createElement('input');
            min.type = 'number'; min.min = '0'; min.step = '1'; min.dataset.stat = stat.key; min.dataset.bound = 'min';
            min.value = state.statRanges[stat.key]?.min ?? '';
            min.addEventListener('input',() => { ensureStatRange(stat.key).min = min.value; render(); syncRoute({ replace: true }); });
            minField.append(minLabel,min);
            const maxField = document.createElement('div');
            maxField.className = 'field';
            const maxLabel = document.createElement('label');
            maxLabel.textContent = `${stat.label} maximum`;
            const max = document.createElement('input');
            max.type = 'number'; max.min = '0'; max.step = '1'; max.dataset.stat = stat.key; max.dataset.bound = 'max';
            max.value = state.statRanges[stat.key]?.max ?? '';
            max.addEventListener('input',() => { ensureStatRange(stat.key).max = max.value; render(); syncRoute({ replace: true }); });
            maxField.append(maxLabel,max);
            elements.statFilterGrid.append(minField,maxField);
        });

        populateSortOptions();
    }

    function ensureStatRange(key) {
        if (!state.statRanges[key]) state.statRanges[key] = { min: '', max: '' };
        return state.statRanges[key];
    }

    function syncStatInputs() {
        document.querySelectorAll('#statFilterGrid input[data-stat]').forEach(input => {
            input.value = state.statRanges[input.dataset.stat]?.[input.dataset.bound] ?? '';
        });
    }

    function populateSortOptions() {
        const options = [
            ['dex','Pokédex number'],
            ['name','Name A–Z'],
            ['progressAsc','Asset progress: least first'],
            ['progressDesc','Asset progress: most first'],
            ...STAT_CONFIG.map(stat => [`stat:${stat.key}`,`${stat.label}: highest first`])
        ];
        elements.sortMode.replaceChildren();
        options.forEach(([value,label]) => {
            const option = document.createElement('option');
            option.value = value; option.textContent = label;
            elements.sortMode.appendChild(option);
        });
        elements.sortMode.value = state.sortMode;
    }

    function syncControlsFromState() {
        elements.abilityFilter.value = state.ability;
        elements.progressFilter.value = state.progressFilter;
        elements.galleryRelationFilter.value = state.galleryRelation;
        elements.sortMode.value = state.sortMode;
        syncStatInputs();
    }

    function openPanel(panel) {
        elements.filtersPanel.classList.toggle('hidden',panel !== elements.filtersPanel);
        elements.settingsPanel.classList.toggle('hidden',panel !== elements.settingsPanel);
        elements.panelBackdrop.classList.remove('hidden');
    }

    function closePanels() {
        elements.filtersPanel.classList.add('hidden');
        elements.settingsPanel.classList.add('hidden');
        elements.panelBackdrop.classList.add('hidden');
    }

    function openPokemon(record, { updateUrl = true } = {}) {
        state.modal = { type: 'pokemon', id: record.id };
        renderPokemonModal(record);
        elements.detailModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        if (updateUrl) syncRoute({ push: true });
        updateDocumentMetadata(record,null);
    }

    function getSpeciesGroup(record) {
        return state.speciesByBase.get(record.parsed.baseName.toLowerCase());
    }

    function renderPokemonModal(record) {
        const group = getSpeciesGroup(record);
        elements.modalKicker.textContent = record.dex?.pokedex_number ? `Pokédex #${String(record.dex.pokedex_number).padStart(3,'0')}` : 'Pokémon asset record';
        elements.modalTitle.textContent = getDisplayName(record);
        elements.modalBody.replaceChildren();

        if (group && group.forms.length > 1) {
            const tabs = document.createElement('div');
            tabs.className = 'form-tabs';
            group.forms.forEach(form => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `form-tab${form.id === record.id ? ' active' : ''}`;
                button.textContent = form.dex?.form_name || (form === group.primary ? 'Base' : getVariantLabel(form) || form.id);
                button.addEventListener('click',() => {
                    state.modal = { type: 'pokemon', id: form.id };
                    renderPokemonModal(form);
                    syncRoute({ replace: true });
                    updateDocumentMetadata(form,null);
                });
                tabs.appendChild(button);
            });
            elements.modalBody.appendChild(tabs);
        }

        const hero = document.createElement('div');
        hero.className = 'detail-hero';
        const imageWrap = document.createElement('div');
        imageWrap.className = 'hero-image checkerboard';
        const cover = getCoverForRecord(record);
        if (cover) imageWrap.appendChild(createImage(cover,getDisplayName(record),{ copyable: true, pixelated: !isGalleryCover(cover) && cover !== record.assets.artwork }));
        else {
            const missing = document.createElement('span'); missing.className = 'missing-asset'; missing.textContent = 'No artwork or related Gallery image yet'; imageWrap.appendChild(missing);
        }
        const copy = document.createElement('div');
        copy.className = 'hero-copy';
        const dexNo = document.createElement('div');
        dexNo.className = 'dex-number';
        dexNo.textContent = record.dex?.pokedex_number ? `#${String(record.dex.pokedex_number).padStart(3,'0')}` : 'Uncatalogued';
        const name = document.createElement('h3');
        name.className = 'detail-name';
        name.textContent = getDisplayName(record);
        const species = document.createElement('div');
        species.className = 'species-line';
        species.textContent = record.dex?.species_name || 'No Pokédex data available';
        const types = document.createElement('div');
        types.className = 'detail-types';
        (record.dex?.types || []).forEach(type => types.appendChild(makeTypeChip(type)));
        const entry = document.createElement('p');
        entry.className = 'dex-entry';
        entry.textContent = record.dex?.pokedex_entry && record.dex.pokedex_entry !== '???' ? record.dex.pokedex_entry : 'Pokédex entry not available.';
        copy.append(dexNo,name,species,types,entry);

        if (record.dex?.abilities) {
            const abilities = document.createElement('div');
            abilities.className = 'ability-row';
            (record.dex.abilities.standard || []).forEach(ability => abilities.appendChild(makeAbilityChip(ability,false)));
            (record.dex.abilities.hidden || []).forEach(ability => abilities.appendChild(makeAbilityChip(ability,true)));
            copy.appendChild(abilities);
        }
        const evolution = buildEvolutionRow(record);
        if (evolution) copy.appendChild(evolution);
        hero.append(imageWrap,copy);
        elements.modalBody.appendChild(hero);

        if (record.dex?.base_stats) elements.modalBody.appendChild(buildStatsSection(record.dex.base_stats));
        elements.modalBody.appendChild(buildAssetsSection(record));

        const gallery = getGalleryForBase(record.parsed.baseName);
        if (gallery.length) elements.modalBody.appendChild(buildPokemonGallerySection(gallery));

        const archives = group ? group.forms.flatMap(form => form.archivedVariants) : record.archivedVariants;
        if (archives.length) elements.modalBody.appendChild(buildArchiveSection(archives));
    }

    function buildStatsSection(stats) {
        const section = document.createElement('section');
        section.className = 'detail-section';
        const header = document.createElement('div'); header.className = 'section-header';
        const title = document.createElement('h3'); title.className = 'section-title'; title.textContent = 'Base Stats';
        header.appendChild(title);
        const grid = document.createElement('div'); grid.className = 'stats-grid';
        STAT_CONFIG.filter(stat => stat.key !== 'total').forEach(stat => {
            const value = Number(stats[stat.key]) || 0;
            const row = document.createElement('div'); row.className = 'stat-row';
            const label = document.createElement('span'); label.className = 'stat-label'; label.textContent = stat.label;
            const number = document.createElement('span'); number.className = 'stat-value'; number.textContent = value;
            const track = document.createElement('div'); track.className = 'stat-track';
            const fill = document.createElement('div'); fill.className = 'stat-fill'; fill.style.width = `${Math.min(100,(value/150)*100)}%`; track.appendChild(fill);
            row.append(label,number,track); grid.appendChild(row);
        });
        const bst = document.createElement('div'); bst.className = 'bst-row'; bst.innerHTML = `<span>Base Stat Total</span><span>${Number(stats.total) || 0}</span>`;
        section.append(header,grid,bst);
        return section;
    }

    function buildEvolutionRow(record) {
        if (!record.dex) return null;
        const speciesId = record.dex.pokemon_id;
        const previous = [];
        if (state.snapshot) {
            state.snapshot.pokemon.forEach(species => species.forms.forEach(form => {
                if ((form.evolves_into || []).some(evo => evo.id === speciesId)) previous.push({ id: species.id, name: species.name });
            }));
        }
        const next = record.dex.evolves_into || [];
        if (!previous.length && !next.length) return null;
        const wrap = document.createElement('div'); wrap.className = 'evolution-row';
        const addNode = (node,current=false) => {
            const button = document.createElement('button'); button.type = 'button'; button.className = `evolution-node${current ? ' current' : ''}`; button.textContent = node.name || node.id;
            if (!current) button.addEventListener('click',() => {
                const group = state.speciesByBase.get(node.id.toLowerCase());
                if (group) { state.modal = { type:'pokemon', id:group.primary.id }; renderPokemonModal(group.primary); syncRoute({ replace:true }); updateDocumentMetadata(group.primary,null); }
            });
            wrap.appendChild(button);
        };
        previous.forEach((node,index) => { addNode(node); const arrow = document.createElement('span'); arrow.className='evolution-arrow'; arrow.textContent='→'; wrap.appendChild(arrow); });
        addNode({ id: speciesId, name: record.dex.pokemon_name },true);
        next.forEach(node => { const arrow = document.createElement('span'); arrow.className='evolution-arrow'; arrow.textContent='→'; wrap.appendChild(arrow); addNode(node); });
        return wrap;
    }

    function buildAssetsSection(record) {
        const section = document.createElement('section'); section.className='detail-section';
        const progress = getRecordProgress(record);
        const header = document.createElement('div'); header.className='section-header';
        const title = document.createElement('h3'); title.className='section-title'; title.textContent='Assets';
        const meta = document.createElement('span'); meta.className='section-meta'; meta.textContent=`${progress.complete}/${progress.total} key graphics complete`;
        header.append(title,meta);
        const grid = document.createElement('div'); grid.className='modal-asset-grid';
        getActiveAssetConfig().forEach(config => {
            const item = document.createElement('div'); item.className='modal-asset';
            const preview = document.createElement('div'); preview.className='modal-asset-preview checkerboard';
            const file = record.assets[config.key];
            if (file) {
                if (config.key === 'icon' && prefs.iconMode === 'animated') preview.appendChild(createAnimatedIcon(file,155,155,true));
                else preview.appendChild(createImage(file,`${getDisplayName(record)} ${config.label}`,{ copyable:true, pixelated: config.key !== 'artwork' }));
            } else {
                const missing = document.createElement('span'); missing.className='missing-asset'; missing.textContent='Not available'; preview.appendChild(missing);
            }
            const label = document.createElement('div'); label.className='modal-asset-label'; label.textContent=config.label;
            item.append(preview,label); grid.appendChild(item);
        });
        section.append(header,grid);

        const additional = getActiveAssetConfig().flatMap(config => (record.additionalArt[config.key] || []).map(file => ({config,file})));
        if (additional.length) {
            const sub = document.createElement('div'); sub.className='section-header'; sub.style.marginTop='14px';
            const t = document.createElement('h4'); t.className='section-title'; t.textContent=`Additional Art (${additional.length})`; sub.appendChild(t); section.appendChild(sub);
            const extraGrid = document.createElement('div'); extraGrid.className='modal-asset-grid';
            additional.forEach(({config,file}) => {
                const item=document.createElement('div'); item.className='modal-asset';
                const preview=document.createElement('div'); preview.className='modal-asset-preview checkerboard'; preview.appendChild(createImage(file,file.name,{copyable:true,pixelated:config.key!=='artwork'}));
                const label=document.createElement('div'); label.className='modal-asset-label'; label.textContent=`${config.label} · ${file.parsed.additionalArtLabel || file.parsed.originalStem}`;
                item.append(preview,label); extraGrid.appendChild(item);
            });
            section.appendChild(extraGrid);
        }
        return section;
    }

    function buildPokemonGallerySection(items) {
        const section=document.createElement('section'); section.className='detail-section';
        const header=document.createElement('div'); header.className='section-header';
        const title=document.createElement('h3'); title.className='section-title'; title.textContent='Gallery';
        const meta=document.createElement('span'); meta.className='section-meta'; meta.textContent=`${items.length} related item${items.length===1?'':'s'}`;
        header.append(title,meta);
        const strip=document.createElement('div'); strip.className='gallery-strip';
        items.forEach(item => {
            const card=document.createElement('button'); card.type='button'; card.className='gallery-mini';
            const image=document.createElement('div'); image.className='gallery-mini-image checkerboard'; image.appendChild(createImage(item,item.title));
            const label=document.createElement('div'); label.className='gallery-mini-title'; label.textContent=item.title;
            card.append(image,label); card.addEventListener('click',()=>openGallery(item,{updateUrl:true})); strip.appendChild(card);
        });
        section.append(header,strip); return section;
    }

    function buildArchiveSection(archives) {
        const section=document.createElement('section'); section.className='detail-section';
        const header=document.createElement('div'); header.className='section-header';
        const title=document.createElement('h3'); title.className='section-title'; title.textContent='Archived Assets';
        const meta=document.createElement('span'); meta.className='section-meta'; meta.textContent='Historical versions'; header.append(title,meta);
        const list=document.createElement('div'); list.className='archive-list';
        archives.forEach(record => { const button=document.createElement('button'); button.type='button'; button.className='archive-link'; button.textContent=getDisplayName(record); button.addEventListener('click',()=>{state.modal={type:'pokemon',id:record.id};renderPokemonModal(record);syncRoute({replace:true});}); list.appendChild(button); });
        section.append(header,list); return section;
    }

    function openGallery(item,{updateUrl=true}={}) {
        state.modal={type:'gallery',id:item.id};
        elements.modalKicker.textContent=item.categoryPath || 'Gallery';
        elements.modalTitle.textContent=item.title;
        elements.modalBody.replaceChildren();
        const image=document.createElement('div'); image.className='gallery-detail-image checkerboard'; image.appendChild(createImage(item,item.title,{copyable:true}));
        elements.modalBody.appendChild(image);
        const meta=document.createElement('div'); meta.className='gallery-detail-meta';

        const categoryBlock=metadataBlock('Category',item.categoryPath || 'Uncategorized');
        const filenameBlock=metadataBlock('File',item.file);
        meta.append(categoryBlock,filenameBlock);

        if (item.pokemon.length) {
            const block=document.createElement('div'); block.className='metadata-block';
            const label=document.createElement('div'); label.className='metadata-label'; label.textContent='Related Pokémon';
            const value=document.createElement('div'); value.className='card-chip-row';
            item.pokemon.forEach(base => { const chip=document.createElement('button'); chip.type='button'; chip.className='pokemon-chip'; chip.textContent=base; chip.addEventListener('click',()=>{const group=state.speciesByBase.get(base.toLowerCase());if(group)openPokemon(group.primary,{updateUrl:true});}); value.appendChild(chip); });
            block.append(label,value); meta.appendChild(block);
        }
        if (item.tags.length) {
            const block=document.createElement('div'); block.className='metadata-block';
            const label=document.createElement('div'); label.className='metadata-label'; label.textContent='Tags';
            const value=document.createElement('div'); value.className='card-chip-row';
            item.tags.forEach(tag => { const chip=document.createElement('span'); chip.className='tag-chip'; chip.textContent=tag; value.appendChild(chip); });
            block.append(label,value); meta.appendChild(block);
        }
        elements.modalBody.appendChild(meta);
        elements.detailModal.classList.remove('hidden'); document.body.style.overflow='hidden';
        if(updateUrl)syncRoute({push:true}); updateDocumentMetadata(null,item);
    }

    function metadataBlock(labelText,valueText) {
        const block=document.createElement('div'); block.className='metadata-block';
        const label=document.createElement('div'); label.className='metadata-label'; label.textContent=labelText;
        const value=document.createElement('div'); value.className='metadata-value'; value.textContent=valueText;
        block.append(label,value); return block;
    }

    function closeModal({updateUrl=true}={}) {
        const had=Boolean(state.modal); state.modal=null;
        elements.detailModal.classList.add('hidden'); elements.modalBody.replaceChildren(); document.body.style.overflow='';
        if(updateUrl && had)syncRoute({replace:true});
        updateDocumentMetadata(null,null);
    }

    function getCurrentShareUrl() {
        const url=new URL(window.location.href);
        if(state.modal?.type==='pokemon') { url.search=''; url.searchParams.set('pokemon',state.modal.id); }
        else if(state.modal?.type==='gallery') { url.search=''; url.searchParams.set('gallery',state.modal.id); }
        return url.toString();
    }

    async function copyCurrentLink() {
        try { await navigator.clipboard.writeText(getCurrentShareUrl()); showToast('Copied link'); }
        catch { showToast('Could not copy link',true); }
    }

    async function shareCurrent() {
        const url=getCurrentShareUrl();
        const title=elements.modalTitle.textContent || BASE_TITLE;
        if(navigator.share) {
            try { await navigator.share({title,url}); return; } catch(error) { if(error?.name==='AbortError')return; }
        }
        await copyCurrentLink();
    }

    function updateDocumentMetadata(record,item) {
        let title=BASE_TITLE,description='Browse Team Verdigris Pokémon, artwork, sprites, stats, concept art, and archived assets.',image='';
        if(record) {
            title=`${getDisplayName(record)} — Verdigris Dex`;
            description=record.dex?.pokedex_entry || `Artwork, sprites, Gallery items, and asset status for ${getDisplayName(record)}.`;
            image=getCoverUrl(getCoverForRecord(record)) || '';
        } else if(item) {
            title=`${item.title} — Verdigris Gallery`;
            description=`${item.title}${item.categoryPath?` • ${item.categoryPath}`:''}${item.pokemon.length?` • ${item.pokemon.join(', ')}`:''}`;
            image=item.download_url;
        }
        document.title=title;
        setMeta('meta[property="og:title"]','content',title);
        setMeta('meta[property="og:description"]','content',description);
        setMeta('meta[name="description"]','content',description);
        if(image)setMeta('meta[property="og:image"]','content',image,true);
    }

    function setMeta(selector,attribute,value,create=false) {
        let element=document.querySelector(selector);
        if(!element && create) {
            element=document.createElement('meta');
            const match=selector.match(/meta\[(property|name)="([^"]+)"\]/);
            if(match)element.setAttribute(match[1],match[2]);
            document.head.appendChild(element);
        }
        if(element)element.setAttribute(attribute,value);
    }

    function syncRoute({push=false,replace=false}={}) {
        const url=new URL(window.location.href);
        url.search='';
        if(state.modal?.type==='pokemon') url.searchParams.set('pokemon',state.modal.id);
        else if(state.modal?.type==='gallery') url.searchParams.set('gallery',state.modal.id);
        else {
            if(state.currentView!=='pokemon')url.searchParams.set('view',state.currentView);
            if(state.currentView==='folder')url.searchParams.set('folder',state.selectedFolder);
            if(state.currentView==='gallery'&&state.selectedGalleryCategory)url.searchParams.set('category',state.selectedGalleryCategory);
            if(state.currentView==='gallery'&&state.galleryRelation!=='all')url.searchParams.set('relation',state.galleryRelation);
            state.selectedTypes.forEach(type=>url.searchParams.append('type',type));
            if(state.ability)url.searchParams.set('ability',state.ability);
            STAT_CONFIG.forEach(stat=>{const range=state.statRanges[stat.key]||{};if(range.min!==' '&&range.min!==''&&range.min!=null)url.searchParams.set(`min_${stat.alias}`,range.min);if(range.max!==''&&range.max!=null)url.searchParams.set(`max_${stat.alias}`,range.max);});
        }
        const method=push?'pushState':'replaceState';
        history[method]({},'',url);
    }

    function applyRoute({initial=false}={}) {
        const params=new URLSearchParams(window.location.search);
        state.selectedTypes=new Set(params.getAll('type').map(v=>v.toUpperCase()));
        state.ability=params.get('ability')||'';
        state.selectedGalleryCategory=params.get('category')||'';
        state.galleryRelation=params.get('relation')||'all';
        state.selectedFolder=params.get('folder')||state.selectedFolder;
        STAT_CONFIG.forEach(stat=>{const range=ensureStatRange(stat.key);range.min=params.get(`min_${stat.alias}`)||'';range.max=params.get(`max_${stat.alias}`)||'';});

        const pokemon=params.get('pokemon');
        const gallery=params.get('gallery');
        if(pokemon) {
            const record=state.pokemonById.get(pokemon.toLowerCase());
            if(record){state.currentView='pokemon';openPokemon(record,{updateUrl:false});}
        } else if(gallery) {
            const item=state.galleryById.get(gallery);
            if(item){state.currentView='gallery';openGallery(item,{updateUrl:false});}
        } else {
            state.currentView=['pokemon','gallery','folder'].includes(params.get('view'))?params.get('view'):'pokemon';
            if(!initial)closeModal({updateUrl:false});
        }
        syncControlsFromState();
        populateFilters();
        render();
    }

    async function loadAllData() {
        elements.content.innerHTML='<div class="status">Loading repository, Pokédex snapshot, and Gallery…</div>';
        try {
            state.tree=await fetchRepositoryTree();
            buildAssetCollections(state.tree);
            buildGalleryItems(state.tree);
            state.snapshot=await loadSnapshotFromTree(state.tree);
            buildPokemonRecords();
            state.loaded=true;
            populateFilters();
            applyRoute({initial:true});
        } catch(error) {
            console.error(error);
            elements.content.innerHTML=`<div class="status"><strong>Could not load Verdigris Dex.</strong><div style="margin-top:6px">${String(error.message||error)}</div></div>`;
        }
    }

    function clearAllFilters() {
        state.selectedTypes.clear(); state.ability=''; state.progressFilter='all'; state.galleryRelation='all'; state.selectedGalleryCategory='';
        STAT_CONFIG.forEach(stat=>state.statRanges[stat.key]={min:'',max:''});
        syncControlsFromState(); populateFilters(); render(); syncRoute({replace:true});
    }

    document.querySelectorAll('.nav-button').forEach(button=>button.addEventListener('click',()=>{
        state.currentView=button.dataset.view;
        state.modal=null;
        elements.detailModal.classList.add('hidden'); document.body.style.overflow='';
        render(); syncRoute({push:true});
    }));

    elements.searchInput.addEventListener('input',render);
    elements.clearSearch.addEventListener('click',()=>{elements.searchInput.value='';render();elements.searchInput.focus();});
    elements.filtersButton.addEventListener('click',()=>openPanel(elements.filtersPanel));
    elements.settingsButton.addEventListener('click',()=>openPanel(elements.settingsPanel));
    elements.panelBackdrop.addEventListener('click',closePanels);
    document.querySelectorAll('.panel-close').forEach(button=>button.addEventListener('click',closePanels));
    elements.clearFiltersButton.addEventListener('click',clearAllFilters);

    elements.themeToggle.addEventListener('click',()=>{prefs.theme=prefs.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=prefs.theme;updateThemeButton();savePreferences();});
    elements.iconMode.addEventListener('change',()=>{prefs.iconMode=elements.iconMode.value;savePreferences();render();});
    elements.cardStyle.addEventListener('change',()=>{prefs.cardStyle=elements.cardStyle.value;savePreferences();render();});
    elements.progressDisplay.addEventListener('change',()=>{prefs.progressDisplay=elements.progressDisplay.value;savePreferences();render();});
    elements.formMode.addEventListener('change',()=>{prefs.formMode=elements.formMode.value;savePreferences();render();});
    elements.archiveMode.addEventListener('change',()=>{prefs.archiveMode=elements.archiveMode.value;savePreferences();render();});
    elements.hideUnusedAssets.addEventListener('change',()=>{prefs.hideUnusedAssets=elements.hideUnusedAssets.checked;savePreferences();render();});
    elements.abilityFilter.addEventListener('change',()=>{state.ability=elements.abilityFilter.value;render();syncRoute({replace:true});});
    elements.progressFilter.addEventListener('change',()=>{state.progressFilter=elements.progressFilter.value;render();syncRoute({replace:true});});
    elements.sortMode.addEventListener('change',()=>{state.sortMode=elements.sortMode.value;render();});
    elements.galleryRelationFilter.addEventListener('change',()=>{state.galleryRelation=elements.galleryRelationFilter.value;render();syncRoute({replace:true});});

    elements.modalClose.addEventListener('click',()=>closeModal());
    elements.modalCopyLink.addEventListener('click',copyCurrentLink);
    elements.modalShare.addEventListener('click',shareCurrent);
    elements.detailModal.addEventListener('click',event=>{if(event.target===elements.detailModal)closeModal();});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!elements.detailModal.classList.contains('hidden'))closeModal();else closePanels();}});
    window.addEventListener('popstate',()=>applyRoute());

    loadPreferences();
    loadAllData();
})();
</script>
</body>
</html>

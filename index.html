<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Verdigris Pokémon Asset Viewer</title>

    <meta
        name="description"
        content="Browse Team Verdigris Pokémon artwork, front and back sprites, shiny sprites, icons, and additional assets."
    >
    <link
        id="canonicalLink"
        rel="canonical"
        href="https://team-verdigris.github.io/Pokemon/"
    >

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Team Verdigris Pokémon Assets">
    <meta property="og:title" content="Team Verdigris Pokémon Asset Viewer">
    <meta
        property="og:description"
        content="Browse Team Verdigris Pokémon artwork, front and back sprites, shiny sprites, icons, and additional assets."
    >
    <meta property="og:url" content="https://team-verdigris.github.io/Pokemon/">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Team Verdigris Pokémon Asset Viewer">
    <meta
        name="twitter:description"
        content="Browse Team Verdigris Pokémon artwork, front and back sprites, shiny sprites, icons, and additional assets."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --bg: #0f1416;
            --panel: #181f22;
            --panel-rgb: 24, 31, 34;
            --panel-raised: #20292d;
            --field-bg: #111719;
            --border: #334044;
            --border-strong: #46565b;
            --text: #e7eeee;
            --muted: #92a1a4;
            --accent: #66b8ad;
            --success: #55b6a8;
            --success-soft: #17332f;
            --danger: #b98552;
            --danger-soft: #3a2a1d;
            --checker: #273136;
            --checker-alt: #1c2427;
            --shadow: rgba(0, 0, 0, 0.38);
        }

        html[data-theme="light"] {
            color-scheme: light;
            --bg: #f4f6f8;
            --panel: #ffffff;
            --panel-rgb: 255, 255, 255;
            --panel-raised: #ffffff;
            --field-bg: #ffffff;
            --border: #d8dde3;
            --border-strong: #c7ccd2;
            --text: #222222;
            --muted: #6e7681;
            --accent: #315f7d;
            --success: #2f8f83;
            --success-soft: #e4f3f0;
            --danger: #a56f3a;
            --danger-soft: #f3e7da;
            --checker: #eceff1;
            --checker-alt: transparent;
            --shadow: rgba(0, 0, 0, 0.18);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 22px 24px;
        }

        .header-inner {
            width: min(1500px, calc(100% - 20px));
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        main {
            width: min(1500px, calc(100% - 32px));
            margin: 22px auto 48px;
        }

        /* =========================================================
           TOOLBAR
           ========================================================= */

        .toolbar {
            margin-bottom: 24px;
            padding: 0;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 10px 30px var(--shadow);
        }

        .settings-primary {
            display: grid;
            grid-template-columns: minmax(260px, 1.7fr) repeat(3, minmax(140px, 0.7fr));
            gap: 12px;
            padding: 16px;
            background: linear-gradient(180deg, var(--panel-raised), var(--panel));
            border-bottom: 1px solid var(--border);
        }

        .settings-groups {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .settings-section {
            min-width: 0;
            padding: 14px 16px 16px;
        }

        .settings-section + .settings-section {
            border-left: 1px solid var(--border);
        }

        .settings-section-title {
            margin: 0 0 11px;
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .settings-section-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .control-group {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 6px;
        }

        .control-group > label:first-child {
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        input[type="search"],
        select {
            width: 100%;
            min-height: 38px;
            padding: 8px 34px 8px 10px;
            border: 1px solid var(--border-strong);
            border-radius: 7px;
            background: var(--field-bg);
            color: var(--text);
            font-size: 13px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="search"] {
            padding-right: 10px;
        }

        input[type="search"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(85, 182, 168, 0.14);
        }

        select {
            cursor: pointer;
        }

        .toggle-group {
            display: flex;
            min-height: 38px;
            align-items: center;
            gap: 9px;
            padding: 0 10px;
            border: 1px solid var(--border-strong);
            border-radius: 7px;
            background: var(--field-bg);
        }

        .toggle-group input {
            width: 15px;
            height: 15px;
            margin: 0;
            accent-color: var(--success);
        }

        .toggle-group label {
            min-width: 0;
            cursor: pointer;
            color: var(--text);
            font-size: 12px;
            line-height: 1.2;
        }

        /* =========================================================
           COMMON
           ========================================================= */

        .status {
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
        }

        .hidden {
            display: none !important;
        }

        .checkerboard {
            background:
                linear-gradient(45deg, var(--checker) 25%, transparent 25%),
                linear-gradient(-45deg, var(--checker) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--checker) 75%),
                linear-gradient(-45deg, transparent 75%, var(--checker) 75%);
            background-size: 16px 16px;
            background-position:
                0 0,
                0 8px,
                8px -8px,
                -8px 0;
        }

        /* =========================================================
           FOLDER VIEW
           ========================================================= */

        .folder-section {
            margin-bottom: 34px;
        }

        .folder-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .folder-title {
            margin: 0;
            font-size: 20px;
        }

        .folder-count {
            color: var(--muted);
            font-size: 13px;
        }

        .asset-grid,
        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 14px;
        }

        .asset-card,
        .pokemon-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .asset-card {
            padding: 10px;
        }

        .asset-preview {
            position: relative;
            display: flex;
            height: 160px;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            overflow: hidden;
            border-radius: 5px;
        }

        .asset-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .asset-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
            font-size: 12px;
        }

        .asset-warning {
            margin-top: 5px;
            color: var(--danger);
            font-size: 11px;
            text-align: center;
        }

        .archived-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 4;
            padding: 3px 6px;
            border-radius: 4px;
            background: rgba(143, 94, 51, 0.94);
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
        }

        /* =========================================================
           SHINY HOVER
           ========================================================= */

        .hover-stack {
            position: relative;
            width: 100%;
            min-height: 160px;
        }

        .hover-stack img {
            position: absolute;
            inset: 50% auto auto 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.16s ease;
        }

        .hover-stack .shiny-image {
            opacity: 0;
        }

        .hover-stack.has-shiny:hover .normal-image {
            opacity: 0;
        }

        .hover-stack.has-shiny:hover .shiny-image {
            opacity: 1;
        }

        .hover-stack.missing-shiny:hover .normal-image {
            opacity: 0.48;
        }

        .hover-indicator {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 5;
            display: flex;
            width: 25px;
            height: 25px;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            line-height: 1;
            transform: scale(0.8);
            transition:
                opacity 0.16s ease,
                transform 0.16s ease;
        }

        .shiny-indicator {
            color: #e4b216;
            font-size: 21px;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.45),
                0 0 3px rgba(255, 255, 255, 0.8);
        }

        .missing-shiny-indicator {
            color: #a56f3a;
            font-size: 25px;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
        }

        .hover-stack.has-shiny:hover .shiny-indicator,
        .hover-stack.missing-shiny:hover .missing-shiny-indicator {
            opacity: 1;
            transform: scale(1);
        }

        /* =========================================================
           SHINY TOGGLE
           ========================================================= */

        .toggle-wrap {
            display: flex;
            width: 100%;
            flex-direction: column;
            gap: 8px;
        }

        .toggle-stack {
            position: relative;
            min-height: 150px;
        }

        .toggle-stack img {
            position: absolute;
            inset: 50% auto auto 50%;
            transform: translate(-50%, -50%);
        }

        .toggle-stack .shiny-image {
            display: none;
        }

        .shiny-toggle-button,
        .alternate-form-button {
            border: 1px solid var(--border-strong);
            border-radius: 5px;
            background: var(--field-bg);
            cursor: pointer;
        }

        .shiny-toggle-button {
            align-self: center;
            padding: 5px 10px;
            font-size: 12px;
        }

        /* =========================================================
           ICON ANIMATION
           ========================================================= */

        .icon-animation {
            display: inline-block;
            flex: 0 0 auto;
            background-repeat: no-repeat;
            background-position: left top;
            background-size: 200% 100%;
            image-rendering: pixelated;
            animation: icon-two-frame-animation 0.5s steps(1, end) infinite;
        }

        @keyframes icon-two-frame-animation {
            0%,
            49.999% {
                background-position: left top;
            }

            50%,
            100% {
                background-position: right top;
            }
        }

        /* =========================================================
           POKEMON VIEW
           ========================================================= */

        .pokemon-card {
            --pokemon-main: 255, 255, 255;
            --pokemon-accent: 216, 221, 227;

            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition:
                transform 0.12s ease,
                box-shadow 0.2s ease;
        }

        .pokemon-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.10);
        }

        .pokemon-card:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .pokemon-card.colored {
            background:
                linear-gradient(
                    180deg,
                    rgba(var(--pokemon-main), 0.22),
                    rgba(var(--panel-rgb), 0.96) 48%
                );
            box-shadow:
                0 3px 12px rgba(var(--pokemon-accent), 0.12);
        }

        .pokemon-cover {
            position: relative;
            display: flex;
            height: 220px;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
        }

        .pokemon-card.colored .pokemon-cover {
            background-color:
                rgba(var(--pokemon-main), 0.11);
        }

        .pokemon-cover img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .pokemon-body {
            flex: 1;
            padding: 12px;
        }


        .pokemon-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 10px;
        }

        .pokemon-name {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            font-size: 16px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .variant-badge {
            flex: 0 0 auto;
            padding: 2px 5px;
            border-radius: 4px;
            background: var(--panel-raised);
            color: var(--muted);
            font-size: 9px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .variant-badge.old {
            background: var(--danger-soft);
            color: var(--danger);
        }

        .asset-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px 8px;
            margin-bottom: 10px;
        }

        .asset-status {
            font-size: 12px;
        }

        .asset-status.exists {
            color: var(--success);
        }

        .asset-status.missing {
            color: var(--danger);
        }

        .complete-summary {
            margin-top: 8px;
            padding: 7px 8px;
            border-radius: 5px;
            background: var(--success-soft);
            color: var(--success);
            font-size: 11px;
        }

        .alternate-form-button:hover {
            background: var(--panel-raised);
        }

        /* =========================================================
           GROUPED FORMS
           ========================================================= */

        .alternate-forms {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .alternate-forms-title {
            margin: 0 0 7px;
            color: var(--muted);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .alternate-form-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .alternate-form-button {
            padding: 5px 7px;
            color: var(--text);
            font-size: 10px;
        }

        /* =========================================================
           MODAL
           ========================================================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.67);
        }

        .modal {
            --pokemon-main: 255, 255, 255;
            --pokemon-accent: 216, 221, 227;

            width: min(1100px, 100%);
            max-height: calc(100vh - 48px);
            overflow: auto;
            background: var(--panel);
            border-radius: 10px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        }

        .modal.colored {
            border: 3px solid rgb(var(--pokemon-accent));
        }

        .modal-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 18px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .modal.colored .modal-header {
            background:
                linear-gradient(
                    90deg,
                    rgba(var(--pokemon-main), 0.24),
                    rgb(var(--panel-rgb))
                );
            border-bottom:
                3px solid rgb(var(--pokemon-accent));
        }

        .modal-title {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            font-size: 20px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-header-actions {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .modal-link-button {
            min-height: 34px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--field-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .modal-link-button:hover {
            border-color: var(--accent);
            background: var(--panel-raised);
        }

        .modal-close {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--field-bg);
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }

        .modal-body {
            padding: 18px;
        }

        .modal-asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .modal-asset {
            display: flex;
            min-height: 220px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .modal-asset-preview {
            display: flex;
            width: 100%;
            height: 170px;
            flex: 0 0 170px;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            overflow: hidden;
            border-radius: 5px;
        }

        .modal-asset-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .modal-asset-label {
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        .modal-asset-missing {
            color: var(--muted);
            font-size: 12px;
        }


        /* =========================================================
           COPY TO CLIPBOARD
           ========================================================= */

        .copyable-image,
        .icon-animation.copyable-image {
            cursor: copy;

            /*
             * Keep the native mobile long-press image menu available.
             * This is useful on iOS/other browsers that do not allow
             * websites to write image data directly to the clipboard.
             */
            -webkit-touch-callout: default;
            user-select: auto;
            -webkit-user-select: auto;
        }

        .copyable-image:hover {
            filter: brightness(1.06);
        }

        .copy-toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            z-index: 2000;
            max-width: min(420px, calc(100vw - 32px));
            padding: 10px 14px;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 10px);
            border: 1px solid var(--border-strong);
            border-radius: 7px;
            background: var(--panel-raised);
            color: var(--text);
            box-shadow: 0 8px 24px var(--shadow);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            transition:
                opacity 0.16s ease,
                transform 0.16s ease;
        }

        .copy-toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .copy-toast.error {
            border-color: var(--bronze);
            color: var(--bronze-light);
        }

        /* =========================================================
           PROGRESS / MODAL NAVIGATION / ADDITIONAL ART
           ========================================================= */

        .progress-meter {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin: 8px 0 10px;
        }

        .progress-segment {
            height: 8px;
            border-radius: 3px;
            background: var(--border);
        }

        .progress-segment.complete {
            background: var(--success);
        }

        .progress-segment.missing {
            background: var(--danger);
        }

        .modal-variant-nav {
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .modal-section-title {
            margin: 0 0 9px;
            color: var(--muted);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .modal-variant-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .modal-variant-button {
            padding: 6px 9px;
            border: 1px solid var(--border-strong);
            border-radius: 5px;
            background: var(--field-bg);
            cursor: pointer;
            color: var(--text);
            font-size: 11px;
        }

        .modal-variant-button:hover:not(:disabled) {
            background: var(--panel-raised);
        }

        .modal-variant-button.active,
        .modal-variant-button:disabled {
            border-color: var(--accent);
            background: var(--success-soft);
            color: var(--accent);
            cursor: default;
            font-weight: bold;
        }

        .additional-art-section {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }

        .additional-art-label {
            margin-top: 6px;
            color: var(--muted);
            font-size: 10px;
            text-align: center;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 1000px) {
            .settings-primary {
                grid-template-columns: 1fr 1fr;
            }

            .settings-groups {
                grid-template-columns: 1fr;
            }

            .settings-section + .settings-section {
                border-left: 0;
                border-top: 1px solid var(--border);
            }
        }

        @media (max-width: 700px) {
            .settings-primary {
                grid-template-columns: 1fr;
            }

            .settings-section-grid {
                grid-template-columns: 1fr;
            }

            main {
                width: calc(100% - 20px);
            }

            .toolbar {
                align-items: stretch;
            }

            input[type="search"] {
                width: 100%;
                max-width: none;
            }

            .control-group {
                flex: 1 1 100%;
            }

            .asset-grid,
            .pokemon-grid {
                grid-template-columns:
                    repeat(auto-fill, minmax(145px, 1fr));
                gap: 10px;
            }

            .modal-backdrop {
                padding: 10px;
            }

            .modal {
                max-height: calc(100vh - 20px);
            }

            .modal-header {
                gap: 10px;
                padding: 11px 12px;
            }

            .modal-header-actions {
                gap: 5px;
            }

            .modal-link-button {
                min-height: 32px;
                padding: 5px 7px;
                font-size: 11px;
            }

            .modal-close {
                width: 32px;
                height: 32px;
            }

    /* =============================================================
       FILE / NAME PARSING
       ============================================================= */

    function isImageFile(filename) {
        return /\.(png|jpe?g)$/i.test(
            filename
        );
    }


    function stripExtension(filename) {
        return filename.replace(
            /\.(png|jpe?g)$/i,
            ''
        );
    }


    /*
     * Recognized examples:
     *
     * PIKACHU
     * PIKACHU_female
     * DEOXYS_1
     * DEOXYS_2
     * DEOXYS_1_female
     * PIKACHU_old
     * PIKACHU_OLD
     * DEOXYS_1_old
     */
    function parsePokemonFilename(filename) {
        const originalStem =
            stripExtension(
                filename
            );

        let stem =
            originalStem;

        let isOld =
            false;

        if (/_old$/i.test(stem)) {
            isOld = true;

            stem =
                stem.replace(
                    /_old$/i,
                    ''
                );
        }

        /*
         * Naming rules:
         *
         * MON                -> base
         * MON_1              -> Form 1
         * MON_female         -> female variant
         * MON_1_female       -> female Form 1
         * MON_old            -> archived base
         * MON_ALT            -> Additional Art for MON
         * MON_1_ALT          -> Additional Art for Form 1
         * MON_female_ALT     -> Additional Art for female variant
         *
         * Any suffix token that is not a number, "female", or
         * the already-stripped "old" is Additional Art.
         */
        const parts =
            stem.split('_');

        const baseName =
            parts.shift() || stem;

        let formNumber =
            null;

        let isFemale =
            false;

        const additionalParts =
            [];

        if (
            parts.length > 0 &&
            /^\d+$/.test(parts[0])
        ) {
            formNumber =
                Number(parts.shift());
        }

        if (
            parts.length > 0 &&
            /^female$/i.test(parts[0])
        ) {
            isFemale = true;
            parts.shift();
        }

        additionalParts.push(
            ...parts
        );

        const additionalArtLabel =
            additionalParts.length > 0
                ? additionalParts.join('_')
                : null;

        const isAdditionalArt =
            additionalArtLabel !== null;

        let variantId =
            baseName;

        if (formNumber !== null) {
            variantId +=
                `_${formNumber}`;
        }

        if (isFemale) {
            variantId +=
                '_female';
        }

        if (isOld) {
            variantId +=
                '_old';
        }

        return {
            originalStem,
            baseName,
            formNumber,
            isFemale,
            isOld,
            isAdditionalArt,
            additionalArtLabel,
            variantId
        };
    }


    function getVariantLabel(parsed) {
        const parts = [];

        if (
            parsed.formNumber !== null
        ) {
            parts.push(
                `Form ${parsed.formNumber}`
            );
        }

        if (parsed.isFemale) {
            parts.push(
                'Female'
            );
        }

        if (parsed.isOld) {
            parts.push(
                'OLD'
            );
        }

        return parts.join(' · ');
    }


    function getDisplayName(record) {
        const variant =
            getVariantLabel(
                record.parsed
            );

        if (!variant) {
            return record.parsed.baseName;
        }

        return (
            `${record.parsed.baseName} — ` +
            variant
        );
    }


    function compareNames(a, b) {
        return a.localeCompare(
            b,
            undefined,
            {
                numeric: true,
                sensitivity: 'base'
            }
        );
    }


    /* =============================================================
       URL ROUTING / SHARE METADATA
       ============================================================= */

    function normalizePokemonRouteId(value) {
        if (!value) {
            return null;
        }

        try {
            return decodeURIComponent(
                String(value)
                    .trim()
                    .replace(/^\/+|\/+$/g, '')
            );
        } catch (error) {
            return String(value)
                .trim()
                .replace(/^\/+|\/+$/g, '');
        }
    }


    function getPokemonIdFromLocation() {
        const url =
            new URL(
                window.location.href
            );

        const queryId =
            normalizePokemonRouteId(
                url.searchParams.get(
                    'pokemon'
                )
            );

        if (queryId) {
            return queryId;
        }

        const pathMatch =
            url.pathname.match(
                /\/pokemon\/([^/]+)\/?$/i
            );

        if (
            pathMatch &&
            pathMatch[1]
        ) {
            return normalizePokemonRouteId(
                pathMatch[1]
            );
        }

        const hash =
            url.hash.replace(
                /^#/,
                ''
            );

        const hashPathMatch =
            hash.match(
                /^\/?pokemon\/([^/?#]+)/i
            );

        if (
            hashPathMatch &&
            hashPathMatch[1]
        ) {
            return normalizePokemonRouteId(
                hashPathMatch[1]
            );
        }

        const hashParams =
            new URLSearchParams(
                hash
            );

        return normalizePokemonRouteId(
            hashParams.get(
                'pokemon'
            )
        );
    }


    function getPokemonRecordById(id) {
        const wanted =
            normalizePokemonRouteId(
                id
            );

        if (!wanted) {
            return null;
        }

        return buildPokemonRecords()
            .find(
                record =>
                    record.id
                        .toLowerCase() ===
                    wanted.toLowerCase()
            ) || null;
    }


    function getPokemonQueryUrl(record) {
        const url =
            new URL(
                siteBaseUrl
            );

        url.searchParams.set(
            'pokemon',
            record.id
        );

        return url.toString();
    }


    function getPokemonPreviewRouteUrl(record) {
        return (
            siteBaseUrl +
            'pokemon/' +
            encodeURIComponent(
                record.id
            ) +
            '/'
        );
    }


    function getPokemonShareUrl(record) {
        return generatedPreviewRoutesEnabled
            ? getPokemonPreviewRouteUrl(
                record
            )
            : getPokemonQueryUrl(
                record
            );
    }


    async function detectGeneratedPreviewRoutes() {
        try {
            const response =
                await fetch(
                    siteBaseUrl +
                    'pokemon/routes-ready.txt',
                    {
                        cache: 'no-store'
                    }
                );

            generatedPreviewRoutesEnabled =
                response.ok;
        } catch (error) {
            generatedPreviewRoutesEnabled =
                false;
        }

        if (currentModalRecord) {
            updateDocumentMetadata(
                currentModalRecord
            );
        }
    }


    function getPokemonPreviewImage(record) {
        return (
            record.assets.artwork ||
            record.assets.front ||
            record.assets.icon ||
            record.assets.back ||
            null
        );
    }


    function setNamedMeta(
        name,
        content
    ) {
        let element =
            document.querySelector(
                `meta[name="${name}"]`
            );

        if (!element) {
            element =
                document.createElement(
                    'meta'
                );

            element.setAttribute(
                'name',
                name
            );

            document.head.appendChild(
                element
            );
        }

        element.setAttribute(
            'content',
            content
        );
    }


    function setPropertyMeta(
        property,
        content
    ) {
        let element =
            document.querySelector(
                `meta[property="${property}"]`
            );

        if (!element) {
            element =
                document.createElement(
                    'meta'
                );

            element.setAttribute(
                'property',
                property
            );

            document.head.appendChild(
                element
            );
        }

        element.setAttribute(
            'content',
            content
        );
    }


    function removeMeta(
        selector
    ) {
        const element =
            document.querySelector(
                selector
            );

        if (element) {
            element.remove();
        }
    }


    function updateDocumentMetadata(
        record = null
    ) {
        if (!record) {
            document.title =
                defaultPageTitle;

            setNamedMeta(
                'description',
                defaultPageDescription
            );

            setPropertyMeta(
                'og:title',
                defaultPageTitle
            );

            setPropertyMeta(
                'og:description',
                defaultPageDescription
            );

            setPropertyMeta(
                'og:url',
                siteBaseUrl
            );

            setNamedMeta(
                'twitter:title',
                defaultPageTitle
            );

            setNamedMeta(
                'twitter:description',
                defaultPageDescription
            );

            removeMeta(
                'meta[property="og:image"]'
            );

            removeMeta(
                'meta[name="twitter:image"]'
            );

            canonicalLink.href =
                siteBaseUrl;

            return;
        }

        const displayName =
            getDisplayName(
                record
            );

        const progress =
            getRecordProgress(
                record
            );

        const title =
            `${displayName} — Team Verdigris Pokémon Assets`;

        const description =
            `${displayName} artwork, sprites, shiny sprites, icons and additional assets. ` +
            `${progress.complete}/${progress.total} core graphics available.`;

        const shareUrl =
            getPokemonShareUrl(
                record
            );

        const previewImage =
            getPokemonPreviewImage(
                record
            );

        document.title =
            title;

        setNamedMeta(
            'description',
            description
        );

        setPropertyMeta(
            'og:title',
            title
        );

        setPropertyMeta(
            'og:description',
            description
        );

        setPropertyMeta(
            'og:url',
            shareUrl
        );

        setNamedMeta(
            'twitter:title',
            title
        );

        setNamedMeta(
            'twitter:description',
            description
        );

        if (previewImage) {
            setPropertyMeta(
                'og:image',
                previewImage.download_url
            );

            setNamedMeta(
                'twitter:image',
                previewImage.download_url
            );
        } else {
            removeMeta(
                'meta[property="og:image"]'
            );

            removeMeta(
                'meta[name="twitter:image"]'
            );
        }

        canonicalLink.href =
            shareUrl;
    }


    function setPokemonLocation(
        record,
        replace = false
    ) {
        const target =
            new URL(
                window.location.href
            );

        const base =
            new URL(
                siteBaseUrl
            );

        target.pathname =
            base.pathname;

        target.searchParams.set(
            'pokemon',
            record.id
        );

        target.hash =
            '';

        if (
            target.toString() ===
            window.location.href
        ) {
            return;
        }

        const method =
            replace
                ? 'replaceState'
                : 'pushState';

        window.history[method](
            {
                pokemon:
                    record.id
            },
            '',
            target
        );
    }


    function clearPokemonLocation(
        replace = true
    ) {
        const target =
            new URL(
                window.location.href
            );

        const base =
            new URL(
                siteBaseUrl
            );

        target.pathname =
            base.pathname;

        target.searchParams.delete(
            'pokemon'
        );

        target.hash =
            '';

        const method =
            replace
                ? 'replaceState'
                : 'pushState';

        window.history[method](
            {
                pokemon: null
            },
            '',
            target
        );
    }


    function applyLocationRoute() {
        if (!dataReady) {
            return;
        }

        const requestedId =
            getPokemonIdFromLocation();

        if (!requestedId) {
            closeAssetModal({
                updateUrl: false,
                updateMetadata: true
            });

            return;
        }

        const record =
            getPokemonRecordById(
                requestedId
            );

        if (!record) {
            closeAssetModal({
                updateUrl: false,
                updateMetadata: true
            });

            showCopyToast(
                `No Pokémon asset record found for ${requestedId}.`,
                true
            );

            return;
        }

        openAssetModal(
            record,
            {
                updateUrl: false
            }
        );
    }


    async function copyPokemonShareLink(
        record
    ) {
        if (!record) {
            return;
        }

        const url =
            getPokemonShareUrl(
                record
            );

        try {
            await navigator.clipboard.writeText(
                url
            );

            showCopyToast(
                `Copied link for ${getDisplayName(record)}`
            );
        } catch (error) {
            console.warn(
                'Could not copy Pokémon link:',
                error
            );

            showCopyToast(
                url,
                true
            );
        }
    }


    async function sharePokemonRecord(
        record
    ) {
        if (!record) {
            return;
        }

        const url =
            getPokemonShareUrl(
                record
            );

        const title =
            `${getDisplayName(record)} — Team Verdigris Pokémon Assets`;

        if (navigator.share) {
            try {
                await navigator.share({
                    title,
                    url
                });

                return;
            } catch (error) {
                if (
                    error &&
                    error.name ===
                        'AbortError'
                ) {
                    return;
                }

                console.warn(
                    'Could not open share sheet:',
                    error
                );
            }
        }

        await copyPokemonShareLink(
            record
        );
    }


    /* =============================================================
       CONFIG HELPERS
       ============================================================= */

    function getConfig(key) {
        return folderConfig.find(
            config =>
                config.key === key
        );
    }


    function getVisibleFolderConfig() {
        return folderConfig.filter(
            config =>
                !(
                    hideUnusedAssets.checked &&
                    config.unused

        );
    }


    function getRequiredConfig() {
        return folderConfig.filter(
            config =>
                config.required

    /* =============================================================
       GITHUB LOADING
       ============================================================= */

    /*
     * Load the repository file tree in ONE GitHub API request.
     *
     * The previous version made one GitHub API request per asset folder.
     * On mobile networks, many users can share the same public IP address,
     * which makes GitHub's unauthenticated API rate limit easier to hit.
     *
     * A single recursive tree request is both faster and much less likely
     * to fail because of rate limiting.
     */
    async function fetchRepositoryTree() {
        const url =
            `https://api.github.com/repos/` +
            `${organization}/${repository}/git/trees/main?recursive=1`;

        const response =
            await fetch(
                url,
                {
                    headers: {
                        'Accept':
                            'application/vnd.github+json'
                    }
                }
            );

        if (!response.ok) {
            let detail = '';

            try {
                const data =
                    await response.json();

                if (data && data.message) {
                    detail =
                        `: ${data.message}`;
                }
            } catch (error) {
            }

            throw new Error(
                `GitHub returned ${response.status}${detail}`
            );
        }

        const data =
            await response.json();

        if (
            !data ||
            !Array.isArray(data.tree)
        ) {
            throw new Error(
                'Unexpected GitHub repository tree response.'
            );
        }

        if (data.truncated) {
            console.warn(
                'GitHub returned a truncated repository tree.'
            );
        }

        return data.tree;
    }


    function buildFolderDataFromTree(
        tree
    ) {
        folderConfig.forEach(
            config => {
                rawFolderData[
                    config.key
                ] = [];
            }
        );

        tree
            .filter(item =>
                item.type === 'blob' &&
                isImageFile(
                    item.path || ''
                )
            )
            .forEach(item => {
                const matchingConfig =
                    folderConfig.find(
                        config => {
                            const prefix =
                                `${config.folder}/`;

                            return (
                                item.path
                                    .toLowerCase()
                                    .startsWith(
                                        prefix.toLowerCase()
                                    ) &&
                                !item.path
                                    .substring(
                                        prefix.length
                                    )
                                    .includes('/')
                            );
                        }
                    );

                if (!matchingConfig) {
                    return;
                }

                const filename =
                    item.path.substring(
                        item.path.lastIndexOf('/') + 1
                    );

                const encodedPath =
                    item.path
                        .split('/')
                        .map(
                            part =>
                                encodeURIComponent(
                                    part
                                )
                        )
                        .join('/');

                rawFolderData[
                    matchingConfig.key
                ].push({
                    name: filename,
                    path: item.path,
                    type: 'file',
                    download_url:
                        `https://raw.githubusercontent.com/` +
                        `${organization}/${repository}/main/${encodedPath}`,
                    parsed:
                        parsePokemonFilename(
                            filename
                        )
                });
            });

        Object.keys(
            rawFolderData
        ).forEach(key => {
            rawFolderData[
                key
            ].sort(
                (a, b) =>
                    compareNames(
                        a.name,
                        b.name
                    )
            );
        });
    }


    async function loadAllData() {
        content.innerHTML =
            '<div class="status">Loading assets...</div>';

        try {
            const tree =
                await fetchRepositoryTree();

            buildFolderDataFromTree(
                tree
            );

            const totalLoaded =
                Object.values(
                    rawFolderData
                ).reduce(
                    (sum, files) =>
                        sum +
                        files.length,
                    0
                );

            if (totalLoaded === 0) {
                throw new Error(
                    'The repository loaded, but no configured image assets were found.'
                );
            }

            dataReady =
                true;

            render();

        } catch (error) {
            console.error(
                'Could not load Pokémon assets:',
                error
            );

            content.innerHTML = '';

            const status =
                document.createElement(
                    'div'
                );

            status.className =
                'status';

            const title =
                document.createElement(
                    'strong'
                );

            title.textContent =
                'Could not load Pokémon assets.';

            const message =
                document.createElement(
                    'div'
                );

            message.style.marginTop =
                '6px';

            message.textContent =
                (
                    error &&
                    error.message
                )
                    ? error.message
                    : 'Unknown loading error.';

            const hint =
                document.createElement(
                    'div'
                );

            hint.style.marginTop =
                '8px';

            hint.style.color =
                'var(--muted)';

            hint.textContent =
                'Try refreshing the page. If this persists, GitHub may be temporarily rate-limiting requests from your network.';

            status.appendChild(
                title
            );

            status.appendChild(
                message
            );

            status.appendChild(
                hint
            );

            content.appendChild(
                status
            );
        }
    }

    function getActiveFiles(
        assetKey
    ) {
        let files =
            rawFolderData[
                assetKey
            ] || [];

        if (
            !showOldFiles.checked
        ) {
            files =

    /*
     * Creates one record for each exact visual variant.
     *
     * Example:
     *
     * PIKACHU
     * PIKACHU_female
     * DEOXYS_1
     *
     * each becomes its own record.
     */
    function buildPokemonRecords() {
        const records =
            new Map();

        getVisibleFolderConfig()
            .forEach(config => {
                getActiveFiles(
                    config.key
                ).forEach(file => {
                    const id =
                        file.parsed
                            .variantId;

                    if (
                        !records.has(id)
                    ) {
                        records.set(
                            id,
                            {
                                id,
                                parsed:
                                    file.parsed,
                                assets: {},
                                additionalArt: {}
                            }
                        );
                    }

                    const record =
                        records.get(id);

                    if (
                        file.parsed
                            .isAdditionalArt
                    ) {
                        if (
                            !record.additionalArt[
                                config.key
                            ]
                        ) {
                            record.additionalArt[
                                config.key
                            ] = [];
                        }

                        record.additionalArt[
                            config.key
                        ].push(file);
                    } else {
                        record.assets[
                            config.key
                        ] = file;

                        /*
                         * Prefer the canonical filename as the record's
                         * parsed identity rather than an Additional Art
                         * filename encountered first.
                         */
                        record.parsed =
                            file.parsed;
                    }
                });
            });

        return Array
            .from(
                records.values()
            )
            .sort(
                (a, b) =>
                    compareNames(
                        getDisplayName(a),
                        getDisplayName(b)
                    )
            );
    }


    function getRecordProgress(record) {
        const required =
            getRequiredConfig();

        const complete =
            required.filter(
                config =>
                    Boolean(
                        record.assets[
                            config.key
                        ]
                    )
            ).length;

        return {
            complete,
            total: required.length,
            percent:
                required.length === 0
                    ? 100
                    : Math.round(
                        complete /
                        required.length *
                        100
                    )
        };
    }


    function recordMatchesProgressFilter(
        record
    ) {
        const filter =
            progressFilter.value;

        if (filter === 'all') {
            return true;
        }

        const progress =
            getRecordProgress(
                record
            );

        if (filter === 'complete') {
            return (
                progress.complete ===
                progress.total
            );
        }

        if (filter === 'incomplete') {
            return (
                progress.complete <
                progress.total
            );
        }

        if (/^\d+$/.test(filter)) {
            return (
                progress.complete ===
                Number(filter)
            );
        }

        if (
            filter.startsWith(
                'missing:'
            )
        ) {
            const key =
                filter.substring(
                    'missing:'.length
                );

            return !Boolean(
                record.assets[key]
            );
        }

        return true;
    }


    function sortPokemonRecords(
        records
    ) {
        return [...records].sort(
            (a, b) => {
                if (
                    sortMode.value ===
                    'progressAsc'
                ) {
                    const difference =
                        getRecordProgress(a)
                            .complete -
                        getRecordProgress(b)
                            .complete;

                    if (difference !== 0) {
                        return difference;
                    }
                }

                if (
                    sortMode.value ===
                    'progressDesc'
                ) {
                    const difference =
                        getRecordProgress(b)
                            .complete -
                        getRecordProgress(a)
                            .complete;

                    if (difference !== 0) {
                        return difference;
                    }
                }

                return compareNames(
                    getDisplayName(a),
                    getDisplayName(b)
                );
            }
        );
    }

    function showCopyToast(

    ) {

    async function convertBlobToPng(
        blob
    ) {
        if (
            blob.type === 'image/png'
        ) {
            return blob;
        }

        const bitmap =
            await createImageBitmap(
                blob
            );

        const canvas =
            document.createElement(
                'canvas'
            );

        canvas.width =
            bitmap.width;

        canvas.height =
            bitmap.height;

        const context =
            canvas.getContext('2d');

        context.drawImage(
            bitmap,
            0,
            0
        );

        bitmap.close();

        return await new Promise(
            (resolve, reject) => {
                canvas.toBlob(
                    result => {
                        if (result) {
                            resolve(result);
                        } else {
                            reject(
                                new Error(
                                    'Could not convert image to PNG.'
                                )
                            );
                        }
                    },
                    'image/png'
                );
            }
        );
    }


    async function copyImageToClipboard(
        file,
        label
    ) {
        let pngBlob = null;

        try {
            const response =
                await fetch(
                    file.download_url
                );

            if (!response.ok) {
                throw new Error(
                    `Could not load image (${response.status}).`
                );
            }

            const sourceBlob =
                await response.blob();

            pngBlob =
                await convertBlobToPng(
                    sourceBlob
                );

            /*
             * 1. Preferred: copy the actual image.
             */
            if (
                navigator.clipboard &&
                typeof ClipboardItem !==
                    'undefined'
            ) {
                try {
                    await navigator.clipboard.write([
                        new ClipboardItem({
                            'image/png':
                                pngBlob
                        })
                    ]);

                    showCopyToast(
                        `Copied ${label} to clipboard`
                    );

                    return;

                } catch (clipboardError) {
                    console.warn(
                        'Direct image clipboard write failed:',
                        clipboardError
                    );
                }
            }

            /*
             * 2. Fallback: copy the image URL as text.
             *
             * This is much more widely supported on mobile than
             * writing image data to the clipboard.
             */
            if (
                navigator.clipboard &&
                navigator.clipboard.writeText
            ) {
                try {
                    await navigator.clipboard.writeText(
                        file.download_url
                    );

                    showCopyToast(
                        'Image copy is unavailable here. Copied the image link instead — press and hold the image for Copy/Save Image.'
                    );

                    return;

                } catch (linkClipboardError) {
                    console.warn(
                        'Text clipboard fallback failed:',
                        linkClipboardError
                    );
                }
            }

            /*
             * 3. Final fallback: open the mobile share sheet.
             */
            if (
                navigator.share &&
                typeof File !==
                    'undefined'
            ) {
                const safeName =
                    `${label}`
                        .replace(
                            /[^a-z0-9._-]+/gi,
                            '_'
                        )
                        .replace(
                            /^_+|_+$/g,
                            ''
                        ) ||
                    'pokemon_image';

                const imageFile =
                    new File(
                        [pngBlob],
                        `${safeName}.png`,
                        {
                            type:
                                'image/png'
                        }
                    );

                const shareData = {
                    files: [
                        imageFile
                    ],
                    title:
                        label
                };

                if (
                    !navigator.canShare ||
                    navigator.canShare(
                        shareData
                    )
                ) {
                    try {
                        await navigator.share(
                            shareData
                        );

                        return;

                    } catch (shareError) {
                        if (
                            shareError &&
                            shareError.name ===
                                'AbortError'
                        ) {
                            return;
                        }

                        console.warn(
                            'Image sharing fallback failed:',
                            shareError
                        );
                    }
                }
            }

            /*
             * No programmatic copy/share route remains.
             * Native long-press stays enabled on the image itself.
             */
            showCopyToast(
                'Copy and share are unavailable in this browser. Press and hold the image to use the browser’s Copy/Save Image menu.',
                true
            );

        } catch (error) {
            console.error(
                'Image copy failed:',
                error
            );

            /*
             * If the image itself could not be fetched/converted,
             * still try to copy its link before giving up.
             */
            if (
                navigator.clipboard &&
                navigator.clipboard.writeText
            ) {
                try {
                    await navigator.clipboard.writeText(
                        file.download_url
                    );

                    showCopyToast(
                        'Could not copy the image itself. Copied the image link instead — press and hold the image for Copy/Save Image.'
                    );

                    return;

                } catch (linkClipboardError) {
                    console.warn(
                        'Text clipboard fallback after image failure failed:',
                        linkClipboardError
                    );
                }
            }

            if (
                navigator.share
            ) {
                try {
                    await navigator.share({
                        title:
                            label,
                        url:
                            file.download_url
                    });

                    return;

                } catch (shareError) {
                    if (
                        shareError &&
                        shareError.name ===
                            'AbortError'
                    ) {
                        return;
                    }

                    console.warn(
                        'URL sharing fallback failed:',
                        shareError
                    );
                }
            }

            showCopyToast(
                'Could not copy this image or link. Press and hold the image to use the browser’s image menu.',
                true
            );
        }
    }



    function makeDisplayCopyable(
        element,
        file,
        label
    ) {
        element.classList.add(
            'copyable-image'
        );

        element.title =
            'Click to copy image; on mobile, press and hold if needed';

        element.addEventListener(
            'click',
            event => {
                event.stopPropagation();

                copyImageToClipboard(
                    file,
                    label
                );
            }
        );

        return element;
    }


    function createImageElement(
        file,
        alt,
        copyable = false
    ) {
        const image =
            document.createElement(
                'img'
            );

        image.src =
            file.download_url;

        image.alt =
            alt;

        image.loading =
            'lazy';

        if (copyable) {
            return makeDisplayCopyable(
                image,
                file,
                alt
            );
        }

        return image;
    }

    function createAnimatedIcon(
        file,
        maxWidth,
        maxHeight,
        copyable = false
    ) {
        const wrapper =
            document.createElement(
                'div'
            );

        const loader =
            new Image();

        loader.crossOrigin =
            'anonymous';

        loader.onload =
            () => {
                const frameWidth =
                    loader.naturalWidth /
                    2;

                const frameHeight =
                    loader.naturalHeight;

                if (
                    frameWidth <= 0 ||
                    frameHeight <= 0
                ) {
                    return;
                }

                let scale =
                    Math.min(
                        maxWidth /
                            frameWidth,
                        maxHeight /
                            frameHeight
                    );

                if (
                    !Number.isFinite(scale) ||
                    scale <= 0
                ) {
                    scale = 1;
                }

                const width =
                    Math.max(
                        1,
                        Math.floor(
                            frameWidth *
                            scale
                        )
                    );

                const height =
                    Math.max(
                        1,
                        Math.floor(
                            frameHeight *
                            scale
                        )
                    );

                wrapper.style.width =
                    `${width}px`;

                wrapper.style.height =
                    `${height}px`;

                wrapper.style
                    .backgroundImage =
                    `url("${file.download_url}")`;

                wrapper.className =
                    'icon-animation';
            };

        loader.src =
            file.download_url;

        if (copyable) {
            return makeDisplayCopyable(
                wrapper,
                file,
                file.parsed?.originalStem || file.name
            );
        }

        return wrapper;
    }


    /* =============================================================
       AUTOMATIC POKEMON COLORS
       ============================================================= */

    async function getArtworkPalette(
        file
    ) {
        if (!file) {
            return null;
        }

        if (
            paletteCache.has(
                file.download_url
            )
        ) {
            return paletteCache.get(
                file.download_url
            );
        }

        const promise =
            new Promise(
                resolve => {
                    const image =
                        new Image();

                    image.crossOrigin =
                        'anonymous';

                    image.onload = () => {
                        try {
                            const canvas =
                                document
                                    .createElement(
                                        'canvas'
                                    );

                            canvas.width =
                                40;

                            canvas.height =
                                40;

                            const ctx =
                                canvas
                                    .getContext(
                                        '2d',
                                        {
                                            willReadFrequently:
                                                true
                                        }
                                    );

                            ctx.drawImage(
                                image,
                                0,
                                0,
                                40,
                                40
                            );

                            const pixels =
                                ctx.getImageData(
                                    0,
                                    0,
                                    40,
                                    40
                                ).data;

                            const buckets =
                                new Map();

                            for (
                                let i = 0;
                                i < pixels.length;
                                i += 4
                            ) {
                                const r =
                                    pixels[i];

                                const g =
                                    pixels[i + 1];

                                const b =
                                    pixels[i + 2];

                                const a =
                                    pixels[i + 3];

                                if (a < 100) {
                                    continue;
                                }

                                const luminance =
                                    (
                                        r +
                                        g +
                                        b
                                    ) / 3;

                                const maxChannel =
                                    Math.max(
                                        r,
                                        g,
                                        b
                                    );

                                const minChannel =
                                    Math.min(
                                        r,
                                        g,
                                        b
                                    );

                                const chroma =
                                    maxChannel -
                                    minChannel;

                                /*
                                 * Ignore pixels that are:
                                 * - near-white
                                 * - near-black
                                 * - gray or too close to gray
                                 *
                                 * Chroma is the difference between
                                 * the strongest and weakest RGB
                                 * channels. Neutral gray has a
                                 * chroma of 0. A cutoff of 35 keeps
                                 * significant colors while ignoring
                                 * gray shading and weak gray tints.
                                 */
                                if (
                                    luminance > 244 ||
                                    luminance < 18 ||
                                    chroma < 35
                                ) {
                                    continue;
                                }

                                const qr =
                                    Math.round(
                                        r / 32
                                    ) * 32;

                                const qg =
                                    Math.round(
                                        g / 32
                                    ) * 32;

                                const qb =
                                    Math.round(
                                        b / 32
                                    ) * 32;

                                const key =
                                    `${qr},${qg},${qb}`;

                                buckets.set(
                                    key,
                                    (
                                        buckets.get(
                                            key
                                        ) || 0
                                    ) + 1
                                );
                            }

                            const ranked =
                                Array.from(
                                    buckets.entries()
                                )
                                .sort(
                                    (a, b) =>
                                        b[1] -
                                        a[1]
                                )
                                .map(
                                    entry =>
                                        entry[0]
                                            .split(',')
                                            .map(Number)
                                );

                            if (
                                ranked.length === 0
                            ) {
                                resolve(null);
                                return;
                            }

                            const main =
                                ranked[0];

                            let accent =
                                ranked.find(
                                    color =>
                                        colorDistance(
                                            main,
                                            color
                                        ) > 90
                                );

                            if (!accent) {
                                accent =
                                    createAccentColor(
                                        main
                                    );
                            }

                            resolve({
                                main,
                                accent
                            });

                        } catch (error) {
                            console.warn(
                                'Could not sample artwork colors:',
                                error
                            );

                            resolve(null);
                        }
                    };

                    image.onerror =
                        () => resolve(null);

                    image.src =
                        file.download_url;
                }
            );

        paletteCache.set(
            file.download_url,
            promise
        );

        return promise;
    }


    function colorDistance(
        a,
        b
    ) {
        return Math.sqrt(
            Math.pow(
                a[0] - b[0],
                2
            ) +
            Math.pow(
                a[1] - b[1],
                2
            ) +
            Math.pow(
                a[2] - b[2],
                2
            )
        );
    }


    function createAccentColor(
        color
    ) {
        const average =
            (
                color[0] +
                color[1] +
                color[2]
            ) / 3;

        if (average > 140) {
            return color.map(
                value =>
                    Math.max(
                        0,
                        Math.round(
                            value * 0.62
                        )
                    )
            );
        }

        return color.map(
            value =>
                Math.min(
                    255,
                    Math.round(
                        value +
                        (
                            255 - value
                        ) * 0.38
                    )
                )
        );
    }


    async function applyPokemonColors(
        element,
        record
    ) {
        if (
            cardStyle.value !==
            'pokemon'
        ) {
            return;
        }

        const source =
            record.assets.artwork ||
            record.assets.front;

        const palette =
            await getArtworkPalette(
                source
            );

        if (!palette) {
            return;
        }

        element.style.setProperty(
            '--pokemon-main',
            palette.main.join(',')
        );

        element.style.setProperty(
            '--pokemon-accent',
            palette.accent.join(',')
        );

        element.classList.add(
            'colored'
        );
    }

        });

        if (

    /* =============================================================
       FOLDER VIEW
       ============================================================= */

    function renderFolderView() {
        content.innerHTML = '';

        const visibleConfig =
            getVisibleFolderConfig();

        if (
            shinyMode.value ===
            'separate'
        ) {
            visibleConfig.forEach(
                config => {
                    renderFolderSection(
                        config,
                        getActiveFiles(
                            config.key
                        )
                    );
                }
            );

            applySearch();
            return;
        }

        /*
         * Paired front and shiny-front.
         */
        if (
            visibleConfig.some(
                config =>
                    config.key ===
                    'front'
            )
        ) {
            renderPairedFolderSection(
                'Front',
                getActiveFiles(
                    'front'
                ).filter(
                    file =>
                        !file.parsed
                            .isAdditionalArt
                ),
                getActiveFiles(
                    'frontShiny'
                ).filter(
                    file =>
                        !file.parsed
                            .isAdditionalArt
                )
            );
        }

        /*
         * Paired back and shiny-back.
         */
        if (
            visibleConfig.some(
                config =>
                    config.key ===
                    'back'
            )
        ) {
            renderPairedFolderSection(
                'Back',
                getActiveFiles(
                    'back'
                ).filter(
                    file =>
                        !file.parsed
                            .isAdditionalArt
                ),
                getActiveFiles(
                    'backShiny'
                ).filter(
                    file =>
                        !file.parsed
                            .isAdditionalArt
                )
            );
        }

        visibleConfig
            .filter(
                config =>
                    ![
                        'front',
                        'frontShiny',
                        'back',
                        'backShiny'
                    ].includes(
                        config.key
                    )
            )
            .forEach(
                config => {
                    renderFolderSection(
                        config,
                        getActiveFiles(
                            config.key
                        )
                    );
                }
            );

        applySearch();
    }

    function createPairedAssetCard(
        id,
        normalFile,
        shinyFile
    ) {
        const source =
            normalFile ||
            shinyFile;

        const parsed =
            source.parsed;

        const card =
            document.createElement(
                'div'
            );

        card.className =
            'asset-card';

        card.dataset.search =
            (
                id +
                ' ' +
                parsed.baseName
            ).toLowerCase();

        const preview =
            document.createElement(
                'div'
            );

        preview.className =
            'asset-preview checkerboard';

        if (
            shinyMode.value ===
            'hover'
        ) {
            const stack =
                document.createElement(
                    'div'
                );

            stack.className =
                'hover-stack';

            if (normalFile) {
                const normal =
                    createImageElement(
                        normalFile,
                        `${id} normal`
                    );

                normal.className =
                    'normal-image';

                stack.appendChild(
                    normal
                );
            }

            if (shinyFile) {
                stack.classList.add(
                    'has-shiny'
                );

                const shiny =
                    createImageElement(
                        shinyFile,
                        `${id} shiny`
                    );

                shiny.className =
                    'shiny-image';

                stack.appendChild(
                    shiny
                );

                const star =
                    document.createElement(
                        'div'
                    );

                star.className =
                    'hover-indicator shiny-indicator';

                star.textContent =
                    '★';

                stack.appendChild(
                    star
                );
            } else {
                stack.classList.add(
                    'missing-shiny'
                );

                const missing =
                    document.createElement(
                        'div'
                    );

                missing.className =
                    'hover-indicator missing-shiny-indicator';

                missing.textContent =
                    '⊘';

                stack.appendChild(
                    missing
                );
            }

            preview.appendChild(
                stack
            );
        }


        if (
            shinyMode.value ===
            'toggle'
        ) {
            const wrap =
                document.createElement(
                    'div'
                );

            wrap.className =
                'toggle-wrap';

            const stack =
                document.createElement(
                    'div'
                );

            stack.className =
                'toggle-stack';

            let normal = null;
            let shiny = null;

            if (normalFile) {
                normal =
                    createImageElement(
                        normalFile,
                        `${id} normal`
                    );

                normal.className =
                    'normal-image';

                stack.appendChild(
                    normal
                );
            }

            if (shinyFile) {
                shiny =
                    createImageElement(
                        shinyFile,
                        `${id} shiny`
                    );

                shiny.className =
                    'shiny-image';

                stack.appendChild(
                    shiny
                );
            }

            wrap.appendChild(
                stack
            );

            if (
                normal &&
                shiny
            ) {
                const button =
                    document.createElement(
                        'button'
                    );

                button.className =
                    'shiny-toggle-button';

                button.textContent =
                    'Show Shiny';

                let active =
                    false;

                button.onclick =
                    () => {
                        active =
                            !active;

                        normal.style.display =
                            active
                                ? 'none'
                                : '';

                        shiny.style.display =
                            active
                                ? 'block'
                                : 'none';

                        button.textContent =
                            active
                                ? 'Show Normal'
                                : 'Show Shiny';
                    };

                wrap.appendChild(
                    button
                );
            }

            preview.appendChild(
                wrap
            );
        }

        const name =
            document.createElement(
                'div'
            );

        name.className =
            'asset-name';

        name.textContent =
            id;

        card.appendChild(
            preview
        );

        card.appendChild(
            name
        );

        if (
            shinyMode.value ===
                'toggle' &&
            normalFile &&
            !shinyFile
        ) {
            const warning =
                document.createElement(
                    'div'
                );

            warning.className =
                'asset-warning';

            warning.textContent =
                'Missing shiny';

            card.appendChild(
                warning
            );
        }

        return card;
    }

    function renderPokemonView() {
        content.innerHTML = '';

        const allRecords =
            buildPokemonRecords();

        const grid =
            document.createElement(
                'div'
            );

        grid.className =
            'pokemon-grid';

        if (
            formMode.value ===
            'separate'
        ) {
            const records =
                sortPokemonRecords(
                    allRecords.filter(
                        record =>
                            recordMatchesProgressFilter(
                                record
                            )
                    )
                );

            records.forEach(
                record => {
                    grid.appendChild(
                        createPokemonCard(
                            record
                        )
                    );
                }
            );
        } else {
            let groups =
                groupPokemonRecords(
                    allRecords
                );

            groups =
                groups.filter(
                    group =>
                        getGroupRecords(group)
                            .some(
                                record =>
                                    recordMatchesProgressFilter(
                                        record
                                    )
                            )
                );

            groups =
                sortPokemonGroups(
                    groups
                );

            groups.forEach(
                group => {
                    grid.appendChild(
                        createGroupedPokemonCard(
                            group
                        )
                    );
                }
            );
        }

        if (
            grid.children.length === 0
        ) {
            if (
                allRecords.length === 0
            ) {
                content.innerHTML =
                    '<div class="status">No Pokémon asset records were loaded. Refresh the page or check the GitHub loading error in the browser console.</div>';
            } else {
                content.innerHTML =
                    '<div class="status">No Pokémon match the current progress filter.</div>';
            }

            return;
        }

        content.appendChild(
            grid
        );

        applySearch();
    }


    function groupPokemonRecords(
        records
    ) {
        const groups =
            new Map();

        records.forEach(
            record => {
                const base =
                    record.parsed
                        .baseName;

                if (
                    !groups.has(base)
                ) {
                    groups.set(
                        base,
                        []
                    );
                }

                groups
                    .get(base)
                    .push(record);
            }
        );

        return Array
            .from(
                groups.entries()
            )
            .map(
                ([baseName, variants]) => {
                    const primary =
                        variants.find(
                            record =>
                                record.parsed
                                    .formNumber ===
                                    null &&
                                !record.parsed
                                    .isFemale &&
                                !record.parsed
                                    .isOld
                        ) ||
                        variants[0];

                    return {
                        baseName,
                        primary,
                        alternates:
                            variants.filter(
                                variant =>
                                    variant !==
                                    primary
                            )
                    };
                }
            );
    }


    function getGroupRecords(group) {
        return [
            group.primary,
            ...group.alternates
        ];
    }


    function getGroupProgress(group) {
        const progressValues =
            getGroupRecords(group)
                .map(
                    record =>
                        getRecordProgress(
                            record
                        )
                );

        return progressValues.reduce(
            (worst, current) =>
                current.complete <
                worst.complete
                    ? current
                    : worst,
            progressValues[0]
        );
    }


    function sortPokemonGroups(groups) {
        return [...groups].sort(
            (a, b) => {
                if (
                    sortMode.value ===
                    'progressAsc'
                ) {
                    const difference =
                        getGroupProgress(a)
                            .complete -
                        getGroupProgress(b)
                            .complete;

                    if (difference !== 0) {
                        return difference;
                    }
                }

                if (
                    sortMode.value ===
                    'progressDesc'
                ) {
                    const difference =
                        getGroupProgress(b)
                            .complete -
                        getGroupProgress(a)
                            .complete;

                    if (difference !== 0) {
                        return difference;
                    }
                }

                return compareNames(
                    a.baseName,
                    b.baseName
                );
            }
        );
    }


    function createPokemonCard(
        record
    ) {
        const card =
            createPokemonCardShell(
                record
            );

        applyPokemonColors(
            card,
            record
        );

        return card;
    }


    function createGroupedPokemonCard(
        group
    ) {
        const card =
            createPokemonCardShell(
                group.primary,
                group.baseName,
                getGroupProgress(group),
                group.alternates.length > 0
                    ? 'Lowest form progress'
                    : 'Graphic progress'
            );

        card.dataset.search +=
            ' ' +
            group.alternates
                .map(
                    record =>
                        getDisplayName(
                            record
                        )
                )
                .join(' ')
                .toLowerCase();

        if (
            group.alternates.length >
            0
        ) {
            const body =
                card.querySelector(
                    '.pokemon-body'
                );

            const section =
                document.createElement(
                    'div'
                );

            section.className =
                'alternate-forms';

            const heading =
                document.createElement(
                    'div'
                );

            heading.className =
                'alternate-forms-title';

            heading.textContent =
                'Alternate Forms';

            const list =
                document.createElement(
                    'div'
                );

            list.className =
                'alternate-form-list';

            group.alternates.forEach(
                alternate => {
                    const button =
                        document.createElement(
                            'button'
                        );

                    button.type =
                        'button';

                    button.className =
                        'alternate-form-button';

                    button.textContent =
                        getVariantLabel(
                            alternate.parsed
                        ) ||
                        alternate.id;

                    button.onclick =
                        event => {
                            event.stopPropagation();
                            openAssetModal(
                                alternate
                            );
                        };

                    list.appendChild(
                        button
                    );
                }
            );

            section.appendChild(
                heading
            );

            section.appendChild(
                list
            );

            body.appendChild(
                section
            );
        }

        applyPokemonColors(
            card,
            group.primary
        );

        return card;
    }


    function createPokemonCardShell(
        record,
        forcedTitle = null,
        progressOverride = null,
        progressLabel = 'Graphic progress'
    ) {
        const card =
            document.createElement(
                'article'
            );

        card.className =
            'pokemon-card';

        card.dataset.search =
            (
                record.id +
                ' ' +
                getDisplayName(record)
            ).toLowerCase();

        const cover =
            document.createElement(
                'div'
            );

        cover.className =
            'pokemon-cover checkerboard';

        const coverFile =
            record.assets.artwork ||
            record.assets.front ||
            record.assets.icon ||
            record.assets.back;

        if (coverFile) {
            let display;

            if (
                coverFile ===
                    record.assets.icon &&
                iconMode.value ===
                    'animated'
            ) {
                display =
                    createAnimatedIcon(
                        coverFile,
                        200,
                        200
                    );
            } else {
                display =
                    createImageElement(
                        coverFile,
                        getDisplayName(
                            record
                        )
                    );
            }

            cover.appendChild(
                display
            );
        } else {
            cover.textContent =
                'No preview';
        }

        if (
            record.parsed.isOld
        ) {
            const badge =
                document.createElement(
                    'div'
                );

            badge.className =
                'archived-badge';

            badge.textContent =
                'OLD';

            cover.appendChild(
                badge
            );
        }

        const body =
            document.createElement(
                'div'
            );

        body.className =
            'pokemon-body';

        const titleRow =
            document.createElement(
                'div'
            );

        titleRow.className =
            'pokemon-title-row';

        const title =
            document.createElement(
                'h2'
            );

        title.className =
            'pokemon-name';

        title.textContent =
            forcedTitle ||
            record.parsed.baseName;

        titleRow.appendChild(
            title
        );

        const variant =
            getVariantLabel(
                record.parsed
            );

        if (
            variant &&
            !forcedTitle
        ) {
            const badge =
                document.createElement(
                    'span'
                );

            badge.className =
                'variant-badge';

            if (
                record.parsed.isOld
            ) {
                badge.classList.add(
                    'old'
                );
            }

            badge.textContent =
                variant;

            titleRow.appendChild(
                badge
            );
        }

        body.appendChild(
            titleRow
        );

        const requiredConfig =
            getRequiredConfig();

        const progress =
            progressOverride ||
            getRecordProgress(record);

        if (
            progressDisplay.value ===
            'list'
        ) {
            const checklist =
                document.createElement(
                    'div'
                );

            checklist.className =
                'asset-list';

            requiredConfig.forEach(
                config => {
                    const exists =
                        Boolean(
                            record.assets[
                                config.key
                            ]
                        );

                    const status =
                        document.createElement(
                            'div'
                        );

                    status.className =
                        `asset-status ${
                            exists
                                ? 'exists'
                                : 'missing'
                        }`;

                    status.textContent =
                        `${
                            exists
                                ? '✓'
                                : '✗'
                        } ${config.label}`;

                    checklist.appendChild(
                        status
                    );
                }
            );

            body.appendChild(
                checklist
            );

            if (
                progress.complete ===
                progress.total
            ) {
                const complete =
                    document.createElement(
                        'div'
                    );

                complete.className =
                    'complete-summary';

                complete.textContent =
                    '🎉 All graphics complete!';

                body.appendChild(
                    complete
                );
            }
        } else if (
            progressDisplay.value ===
            'meter'
        ) {
            const meter =
                document.createElement(
                    'div'
                );

            meter.className =
                'progress-meter';

            meter.title =
                `${progress.complete}/${progress.total} graphics complete`;

            requiredConfig.forEach(
                config => {
                    const segment =
                        document.createElement(
                            'div'
                        );

                    const exists =
                        Boolean(
                            record.assets[
                                config.key
                            ]
                        );

                    segment.className =
                        `progress-segment ${
                            exists
                                ? 'complete'
                                : 'missing'
                        }`;

                    segment.title =
                        `${config.label}: ${
                            exists
                                ? 'Complete'
                                : 'Missing'
                        }`;

                    meter.appendChild(
                        segment
                    );
                }
            );

            body.appendChild(
                meter
            );
        }

        card.appendChild(
            cover
        );

        card.appendChild(
            body
        );

        card.tabIndex = 0;
        card.setAttribute(
            'role',
            'button'
        );
        card.setAttribute(
            'aria-label',
            `View all assets for ${getDisplayName(record)}`
        );

        card.addEventListener(
            'click',
            () => openAssetModal(record)
        );

        card.addEventListener(
            'keydown',
            event => {
                if (
                    event.key === 'Enter' ||
                    event.key === ' '
                ) {
                    event.preventDefault();
                    openAssetModal(record);
                }
            }
        );

        return card;
    }


    /* =============================================================
       ASSET MODAL
       ============================================================= */

    function openAssetModal(
        record,
        options = {}
    ) {
        const updateUrl =
            options.updateUrl !==
            false;

        const replaceUrl =
            options.replaceUrl ===
            true;

        currentModalRecord =
            record;

        if (updateUrl) {
            setPokemonLocation(
                record,
                replaceUrl
            );
        }

        updateDocumentMetadata(
            record
        );

        modalTitle.textContent =
            getDisplayName(
                record
            );

        modalBody.innerHTML =
            '';

        modalWindow.classList.remove(
            'colored'
        );

        modalWindow.removeAttribute(
            'style'
        );

        const siblingRecords =
            sortPokemonRecords(
                buildPokemonRecords()
                    .filter(
                        sibling =>
                            sibling.parsed
                                .baseName ===
                            record.parsed
                                .baseName
                    )
            );

        if (
            siblingRecords.length > 1
        ) {
            const nav =
                document.createElement(
                    'div'
                );

            nav.className =
                'modal-variant-nav';

            const heading =
                document.createElement(
                    'div'
                );

            heading.className =
                'modal-section-title';

            heading.textContent =
                'Forms';

            const list =
                document.createElement(
                    'div'
                );

            list.className =
                'modal-variant-list';

            siblingRecords.forEach(
                sibling => {
                    const button =
                        document.createElement(
                            'button'
                        );

                    button.type =
                        'button';

                    button.className =
                        'modal-variant-button';

                    const label =
                        getVariantLabel(
                            sibling.parsed
                        ) ||
                        'Base';

                    const progress =
                        getRecordProgress(
                            sibling
                        );

                    button.textContent =
                        `${label} · ${progress.complete}/${progress.total}`;

                    if (
                        sibling.id ===
                        record.id
                    ) {
                        button.classList.add(
                            'active'
                        );

                        button.disabled =
                            true;
                    } else {
                        button.onclick =
                            () =>
                                openAssetModal(
                                    sibling
                                );
                    }

                    list.appendChild(
                        button
                    );
                }
            );

            nav.appendChild(
                heading
            );

            nav.appendChild(
                list
            );

            modalBody.appendChild(
                nav
            );
        }

        const coreHeading =
            document.createElement(
                'div'
            );

        coreHeading.className =
            'modal-section-title';

        coreHeading.textContent =
            'Assets';

        modalBody.appendChild(
            coreHeading
        );

        const grid =
            document.createElement(
                'div'
            );

        grid.className =
            'modal-asset-grid';

        getVisibleFolderConfig()
            .forEach(config => {
                const item =
                    document.createElement(
                        'div'
                    );

                item.className =
                    'modal-asset';

                const preview =
                    document.createElement(
                        'div'
                    );

                preview.className =
                    'modal-asset-preview checkerboard';

                const file =
                    record.assets[
                        config.key
                    ];

                if (file) {
                    let display;

                    if (
                        config.key ===
                            'icon' &&
                        iconMode.value ===
                            'animated'
                    ) {
                        display =
                            createAnimatedIcon(
                                file,
                                170,
                                170,
                                true
                            );
                    } else {
                        display =
                            createImageElement(
                                file,
                                `${record.id} ${config.label}`,
                                true
                            );
                    }

                    preview.appendChild(
                        display
                    );
                } else {
                    const missing =
                        document.createElement(
                            'div'
                        );

                    missing.className =
                        'modal-asset-missing';

                    missing.textContent =
                        'Not available';

                    preview.appendChild(
                        missing
                    );
                }

                const label =
                    document.createElement(
                        'div'
                    );

                label.className =
                    'modal-asset-label';

                label.textContent =
                    config.label;

                item.appendChild(
                    preview
                );

                item.appendChild(
                    label
                );

                grid.appendChild(
                    item
                );
            });

        modalBody.appendChild(
            grid
        );

        const additionalItems =
            [];

        getVisibleFolderConfig()
            .forEach(config => {
                const files =
                    record.additionalArt[
                        config.key
                    ] || [];

                files.forEach(
                    file => {
                        additionalItems.push({
                            config,
                            file
                        });
                    }
                );
            });

        if (
            additionalItems.length > 0
        ) {
            const section =
                document.createElement(
                    'div'
                );

            section.className =
                'additional-art-section';

            const heading =
                document.createElement(
                    'div'
                );

            heading.className =
                'modal-section-title';

            heading.textContent =
                `Additional Art (${additionalItems.length})`;

            const additionalGrid =
                document.createElement(
                    'div'
                );

            additionalGrid.className =
                'modal-asset-grid';

            additionalItems.forEach(
                ({ config, file }) => {
                    const item =
                        document.createElement(
                            'div'
                        );

                    item.className =
                        'modal-asset';

                    const preview =
                        document.createElement(
                            'div'
                        );

                    preview.className =
                        'modal-asset-preview checkerboard';

                    let display;

                    if (
                        config.key ===
                            'icon' &&
                        iconMode.value ===
                            'animated'
                    ) {
                        display =
                            createAnimatedIcon(
                                file,
                                170,
                                170,
                                true
                            );
                    } else {
                        display =
                            createImageElement(
                                file,
                                file.name,
                                true
                            );
                    }

                    preview.appendChild(
                        display
                    );

                    const label =
                        document.createElement(
                            'div'
                        );

                    label.className =
                        'modal-asset-label';

                    label.textContent =
                        config.label;

                    const detail =
                        document.createElement(
                            'div'
                        );

                    detail.className =
                        'additional-art-label';

                    detail.textContent =
                        file.parsed
                            .additionalArtLabel ||
                        file.parsed
                            .originalStem;

                    item.appendChild(
                        preview
                    );

                    item.appendChild(
                        label
                    );

                    item.appendChild(
                        detail
                    );

                    additionalGrid.appendChild(
                        item
                    );
                }
            );

            section.appendChild(
                heading
            );

            section.appendChild(
                additionalGrid
            );

            modalBody.appendChild(
                section
            );
        }

        assetModal.classList.remove(
            'hidden'
        );

        document.body.style.overflow =
            'hidden';

        applyPokemonColors(
            modalWindow,
            record
        );
    }


    function closeAssetModal(
        options = {}
    ) {
        const updateUrl =
            options.updateUrl !==
            false;

        const updateMetadata =
            options.updateMetadata !==
            false;

        const hadRecord =
            Boolean(
                currentModalRecord
            );

        currentModalRecord =
            null;

        assetModal.classList.add(
            'hidden'
        );

        modalBody.innerHTML =
            '';

        document.body.style.overflow =
            '';

        if (
            updateUrl &&
            hadRecord
        ) {
            clearPokemonLocation(
                true
            );
        }

        if (updateMetadata) {
            updateDocumentMetadata();
        }
    }


    /* =============================================================
       SEARCH
       ============================================================= */

    function applySearch() {
        const query =
            searchInput.value
                .trim()
                .toLowerCase();

        document
            .querySelectorAll(
                '.asset-card, .pokemon-card'
            )
            .forEach(
                card => {
                    const matches =
                        card.dataset.search
                            .includes(
                                query
                            );

                    card.classList.toggle(
                        'hidden',
                        !matches
                    );
                }
            );

        document
            .querySelectorAll(
                '.folder-section'
            )
            .forEach(
                section => {
                    const visible =
                        section
                            .querySelectorAll(
                                '.asset-card:not(.hidden)'
                            )
                            .length;

                    section.classList.toggle(
                        'hidden',
                        query !== '' &&
                        visible === 0
                    );
                }
            );
    }


    /* =============================================================
       EVENTS
       ============================================================= */

    modalClose.addEventListener(
        'click',
        () => closeAssetModal()
    );


    modalCopyLink.addEventListener(
        'click',
        () =>
            copyPokemonShareLink(
                currentModalRecord
            )
    );


    modalShareLink.addEventListener(
        'click',
        () =>
            sharePokemonRecord(
                currentModalRecord
            )
    );


    window.addEventListener(
        'popstate',
        applyLocationRoute
    );


    assetModal.addEventListener(
        'click',
        event => {
            if (
                event.target ===
                assetModal
            ) {
                closeAssetModal();
            }
        }
    );


    document.addEventListener(
        'keydown',
        event => {
            if (
                event.key ===
                    'Escape' &&
                !assetModal
                    .classList
                    .contains(
                        'hidden'
                    )
            ) {
                closeAssetModal();
            }
        }
    );


    searchInput.addEventListener(
        'input',
        applySearch
    );


    themeMode.addEventListener(
        'change',
        () => {
            document.documentElement.dataset.theme =
                themeMode.value;
        }
    );


    [
        viewMode,
        shinyMode,
        iconMode,
        formMode,
        cardStyle,
        sortMode,
        progressFilter,
        progressDisplay
    ].forEach(
        element =>
            element.addEventListener(
                'change',
                render
            )
    );


    hideUnusedAssets.addEventListener(
        'change',
        render
    );


    showOldFiles.addEventListener(
        'change',
        render
    );


    /* =============================================================
       START
       ============================================================= */

    detectGeneratedPreviewRoutes();
    loadAllData();
</script>

</body>
</html>

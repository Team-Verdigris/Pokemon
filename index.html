    /* =============================================================
       DATA
       ============================================================= */

    const rawFolderData = {};

    const paletteCache =
        new Map();


    /* =============================================================
       FILE / NAME PARSING
       ============================================================= */

    function isImageFile(filename) {
        return /\.(png|jpe?g)$/i.test(
            filename
        );
    }


    function stripExtension(filename) {
        return filename.replace(
            /\.(png|jpe?g)$/i,
            ''
        );
    }


    /*
     * Recognized examples:
     *
     * PIKACHU
     * PIKACHU_female
     * DEOXYS_1
     * DEOXYS_2
     * DEOXYS_1_female
     * PIKACHU_old
     * PIKACHU_OLD
     * DEOXYS_1_old
     */
    function parsePokemonFilename(filename) {
        const originalStem =
            stripExtension(
                filename
            );

        let stem =
            originalStem;

        let isOld =
            false;

        if (/_old$/i.test(stem)) {
            isOld = true;

            stem =
                stem.replace(
                    /_old$/i,
                    ''
                );
        }

        /*
         * Naming rules:
         *
         * MON                -> base
         * MON_1              -> Form 1
         * MON_female         -> female variant
         * MON_1_female       -> female Form 1
         * MON_old            -> archived base
         * MON_ALT            -> Additional Art for MON
         * MON_1_ALT          -> Additional Art for Form 1
         * MON_female_ALT     -> Additional Art for female variant
         *
         * Any suffix token that is not a number, "female", or
         * the already-stripped "old" is Additional Art.
         */
        const parts =
            stem.split('_');

        const baseName =
            parts.shift() || stem;

        let formNumber =
            null;

        let isFemale =
            false;

        const additionalParts =
            [];

        if (
            parts.length > 0 &&
            /^\d+$/.test(parts[0])
        ) {
            formNumber =
                Number(parts.shift());
        }

        if (
            parts.length > 0 &&
            /^female$/i.test(parts[0])
        ) {
            isFemale = true;
            parts.shift();
        }

        additionalParts.push(
            ...parts
        );

        const additionalArtLabel =
            additionalParts.length > 0
                ? additionalParts.join('_')
                : null;

        const isAdditionalArt =
            additionalArtLabel !== null;

        let variantId =
            baseName;

        if (formNumber !== null) {
            variantId +=
                `_${formNumber}`;
        }

        if (isFemale) {
            variantId +=
                '_female';
        }

        if (isOld) {
            variantId +=
                '_old';
        }

        return {
            originalStem,
            baseName,
            formNumber,
            isFemale,
            isOld,
            isAdditionalArt,
            additionalArtLabel,
            variantId
        };
    }


    function getVariantLabel(parsed) {
        const parts = [];

        if (
            parsed.formNumber !== null
        ) {
            parts.push(
                `Form ${parsed.formNumber}`
            );
        }

        if (parsed.isFemale) {
            parts.push(
                'Female'
            );
        }

        if (parsed.isOld) {
            parts.push(
                'OLD'
            );
        }

        return parts.join(' · ');
    }


    function getDisplayName(record) {
        const variant =
            getVariantLabel(
                record.parsed
            );

        if (!variant) {
            return record.parsed.baseName;
        }

        return (
            `${record.parsed.baseName} — ` +
            variant
        );
    }


    function compareNames(a, b) {
        return a.localeCompare(
            b,
            undefined,
            {
                numeric: true,
                sensitivity: 'base'
            }
        );
    }


    /* =============================================================
       CONFIG HELPERS
       ============================================================= */

    function getConfig(key) {
        return folderConfig.find(
            config =>
                config.key === key
        );
    }


    function getVisibleFolderConfig() {
        return folderConfig.filter(
            config =>
                !(
                    hideUnusedAssets.checked &&
                    config.unused
                )
        );
    }


    function getRequiredConfig() {
        return folderConfig.filter(
            config =>
                config.required
        );
    }


    /* =============================================================
       GITHUB LOADING
       ============================================================= */

    async function fetchFolder(config) {
        const url =
            `https://api.github.com/repos/` +
            `${organization}/${repository}/contents/` +
            encodeURIComponent(
                config.folder
            );

        const response =
            await fetch(url);

        /*
         * Optional folders are permitted to not exist.
         */
        if (
            response.status === 404 &&
            config.unused
        ) {
            return [];
        }

        if (!response.ok) {
            throw new Error(
                `GitHub returned ${response.status} ` +
                `for ${config.folder}`
            );
        }

        const data =
            await response.json();

        if (!Array.isArray(data)) {
            throw new Error(
                `Unexpected response for ${config.folder}`
            );
        }

        return data
            .filter(file =>
                file.type === 'file' &&
                isImageFile(file.name)
            )
            .map(file => ({
                ...file,
                parsed:
                    parsePokemonFilename(
                        file.name
                    )
            }))
            .sort(
                (a, b) =>
                    compareNames(
                        a.name,
                        b.name
                    )
            );
    }


    async function loadAllData() {
        content.innerHTML =
            '<div class="status">Loading assets...</div>';

        const results =
            await Promise.allSettled(
                folderConfig.map(
                    async config => {
                        rawFolderData[
                            config.key
                        ] =
                            await fetchFolder(
                                config
                            );
                    }
                )
            );

        results.forEach(
            (result, index) => {
                if (
                    result.status ===
                    'rejected'
                ) {
                    console.error(
                        folderConfig[index]
                            .folder,
                        result.reason
                    );

                    rawFolderData[
                        folderConfig[index]
                            .key
                    ] = [];
                }
            }
        );

        render();
    }


    /* =============================================================
       ACTIVE FILES
       ============================================================= */

    function getActiveFiles(
        assetKey
    ) {
        let files =
            rawFolderData[
                assetKey
            ] || [];

        if (
            !showOldFiles.checked
        ) {
            files =
                files.filter(
                    file =>
                        !file.parsed.isOld
                );
        }

        return files;
    }


    /*
     * Creates one record for each exact visual variant.
     *
     * Example:
     *
     * PIKACHU
     * PIKACHU_female
     * DEOXYS_1
     *
     * each becomes its own record.
     */
    function buildPokemonRecords() {
        const records =
            new Map();

        getVisibleFolderConfig()
            .forEach(config => {
                getActiveFiles(
                    config.key
                ).forEach(file => {
                    const id =
                        file.parsed
                            .variantId;

                    if (
                        !records.has(id)
                    ) {
                        records.set(
                            id,
                            {
                                id,
                                parsed:
                                    file.parsed,
                                assets: {},
                                additionalArt: {}
                            }
                        );
                    }

                    const record =
                        records.get(id);

                    if (
                        file.parsed
                            .isAdditionalArt
                    ) {
                        if (
                            !record.additionalArt[
                                config.key
                            ]
                        ) {
                            record.additionalArt[
                                config.key
                            ] = [];
                        }

                        record.additionalArt[
                            config.key
                        ].push(file);
                    } else {
                        record.assets[
                            config.key
                        ] = file;

                        /*
                         * Prefer the canonical filename as the record's
                         * parsed identity rather than an Additional Art
                         * filename encountered first.
                         */
                        record.parsed =
                            file.parsed;
                    }
                });
            });

        return Array
            .from(
                records.values()
            )
            .sort(
                (a, b) =>
                    compareNames(
                        getDisplayName(a),
                        getDisplayName(b)
                    )
            );
    }


    function getRecordProgress(record) {
        const required =
            getRequiredConfig();

        const complete =
            required.filter(
                config =>
                    Boolean(
                        record.assets[
                            config.key
                        ]
                    )
            ).length;

        return {
            complete,
            total: required.length,
            percent:
                required.length === 0
                    ? 100
                    : Math.round(
                        complete /
                        required.length *
                        100
                    )
        };
    }


    function recordMatchesProgressFilter(
        record
    ) {
        const filter =
            progressFilter.value;

        if (filter === 'all') {
            return true;
        }

        const progress =
            getRecordProgress(
                record
            );

        if (filter === 'complete') {
            return (
                progress.complete ===
                progress.total
            );
        }

        if (filter === 'incomplete') {
            return (
                progress.complete <
                progress.total
            );
        }

        if (/^\d+$/.test(filter)) {
            return (
                progress.complete ===
                Number(filter)
            );
        }

        if (
            filter.startsWith(
                'missing:'
            )
        ) {
            const key =
                filter.substring(
                    'missing:'.length
                );

            return !Boolean(
                record.assets[key]
            );
        }

        return true;
    }


    function sortPokemonRecords(
        records
    ) {
        return [...records].sort(
            (a, b) => {
                if (
                    sortMode.value ===
                    'progressAsc'
                ) {
                    const difference =
                        getRecordProgress(a)
                            .complete -
                        getRecordProgress(b)
                            .complete;

                    if (difference !== 0) {
                        return difference;
                    }
                }

                if (
                    sortMode.value ===
                    'progressDesc'
                ) {
                    const difference =
                        getRecordProgress(b)
                            .complete -
                        getRecordProgress(a)
                            .complete;

                    if (difference !== 0) {
                        return difference;
                    }
                }

                return compareNames(
                    getDisplayName(a),
                    getDisplayName(b)
                );
            }
        );
    }


    /* =============================================================
       IMAGE HELPERS
       ============================================================= */

    function createImageElement(
        file,
        alt
    ) {
        const image =
            document.createElement(
                'img'
            );

        image.src =
            file.download_url;

        image.alt =
            alt;

        image.loading =
            'lazy';

        return image;
    }


    function createAnimatedIcon(
        file,
        maxWidth,
        maxHeight
    ) {
        const wrapper =
            document.createElement(
                'div'
            );

        const loader =
            new Image();

        loader.crossOrigin =
            'anonymous';

        loader.onload =
            () => {
                const frameWidth =
                    loader.naturalWidth /
                    2;

                const frameHeight =
                    loader.naturalHeight;

                if (
                    frameWidth <= 0 ||
                    frameHeight <= 0
                ) {
                    return;
                }

                let scale =
                    Math.min(
                        maxWidth /
                            frameWidth,
                        maxHeight /
                            frameHeight
                    );

                if (
                    !Number.isFinite(scale) ||
                    scale <= 0
                ) {
                    scale = 1;
                }

                const width =
                    Math.max(
                        1,
                        Math.floor(
                            frameWidth *
                            scale
                        )
                    );

                const height =
                    Math.max(
                        1,
                        Math.floor(
                            frameHeight *
                            scale
                        )
                    );

                wrapper.style.width =
                    `${width}px`;

                wrapper.style.height =
                    `${height}px`;

                wrapper.style
                    .backgroundImage =
                    `url("${file.download_url}")`;

                wrapper.className =
                    'icon-animation';
            };

        loader.src =
            file.download_url;

        return wrapper;
    }


    /* =============================================================
       AUTOMATIC POKEMON COLORS
       ============================================================= */

    async function getArtworkPalette(
        file
    ) {
        if (!file) {
            return null;
        }

        if (
            paletteCache.has(
                file.download_url
            )
        ) {
            return paletteCache.get(
                file.download_url
            );
        }

        const promise =
            new Promise(
                resolve => {
                    const image =
                        new Image();

                    image.crossOrigin =
                        'anonymous';

                    image.onload = () => {
                        try {
                            const canvas =
                                document
                                    .createElement(
                                        'canvas'
                                    );

                            canvas.width =
                                40;

                            canvas.height =
                                40;

                            const ctx =
                                canvas
                                    .getContext(
                                        '2d',
                                        {
                                            willReadFrequently:
                                                true
                                        }
                                    );

                            ctx.drawImage(
                                image,
                                0,
                                0,
                                40,
                                40
                            );

                            const pixels =
                                ctx.getImageData(
                                    0,
                                    0,
                                    40,
                                    40
                                ).data;

                            const buckets =
                                new Map();

                            for (
                                let i = 0;
                                i < pixels.length;
                                i += 4
                            ) {
                                const r =
                                    pixels[i];

                                const g =
                                    pixels[i + 1];

                                const b =
                                    pixels[i + 2];

                                const a =
                                    pixels[i + 3];

                                if (a < 100) {
                                    continue;
                                }

                                const luminance =
                                    (
                                        r +
                                        g +
                                        b
                                    ) / 3;

                                /*
                                 * Ignore near-white and
                                 * near-black pixels.
                                 */
                                if (
                                    luminance > 244 ||
                                    luminance < 18
                                ) {
                                    continue;
                                }

                                const qr =
                                    Math.round(
                                        r / 32
                                    ) * 32;

                                const qg =
                                    Math.round(
                                        g / 32
                                    ) * 32;

                                const qb =
                                    Math.round(
                                        b / 32
                                    ) * 32;

                                const key =
                                    `${qr},${qg},${qb}`;

                                buckets.set(
                                    key,
                                    (
                                        buckets.get(
                                            key
                                        ) || 0
                                    ) + 1
                                );
                            }

                            const ranked =
                                Array.from(
                                    buckets.entries()
                                )
                                .sort(
                                    (a, b) =>
                                        b[1] -
                                        a[1]
                                )
                                .map(
                                    entry =>
                                        entry[0]
                                            .split(',')
                                            .map(Number)
                                );

                            if (
                                ranked.length === 0
                            ) {
                                resolve(null);
                                return;
                            }

                            const main =
                                ranked[0];

                            let accent =
                                ranked.find(
                                    color =>
                                        colorDistance(
                                            main,
                                            color
                                        ) > 90
                                );

                            if (!accent) {
                                accent =
                                    createAccentColor(
                                        main
                                    );
                            }

                            resolve({
                                main,
                                accent
                            });

                        } catch (error) {
                            console.warn(
                                'Could not sample artwork colors:',
                                error
                            );

                            resolve(null);
                        }
                    };

                    image.onerror =
                        () => resolve(null);

                    image.src =
                        file.download_url;
                }
            );

        paletteCache.set(
            file.download_url,
            promise
        );

        return promise;
    }


    function colorDistance(
        a,
        b
    ) {
        return Math.sqrt(
            Math.pow(
                a[0] - b[0],
                2
            ) +
            Math.pow(
                a[1] - b[1],
                2
            ) +
            Math.pow(
                a[2] - b[2],
                2
            )
        );
    }


    function createAccentColor(
        color
    ) {
        const average =
            (
                color[0] +
                color[1] +
                color[2]
            ) / 3;

        if (average > 140) {
            return color.map(
                value =>
                    Math.max(
                        0,
                        Math.round(
                            value * 0.62
                        )
                    )
            );
        }

        return color.map(
            value =>
                Math.min(
                    255,
                    Math.round(
                        value +
                        (
                            255 - value
                        ) * 0.38
                    )
                )
        );
    }


    async function applyPokemonColors(
        element,
        record
    ) {
        if (
            cardStyle.value !==
            'pokemon'
        ) {
            return;
        }

        const source =
            record.assets.artwork ||
            record.assets.front;

        const palette =
            await getArtworkPalette(
                source
            );

        if (!palette) {
            return;
        }

        element.style.setProperty(
            '--pokemon-main',
            palette.main.join(',')
        );

        element.style.setProperty(
            '--pokemon-accent',
            palette.accent.join(',')
        );

        element.classList.add(
            'colored'
        );
    }


    /* =============================================================
       RENDER
       ============================================================= */

    function render() {
        closeAssetModal();

        if (
            viewMode.value ===
            'pokemon'
        ) {
            renderPokemonView();
        } else {
            renderFolderView();
        }
    }


    /* =============================================================
       FOLDER VIEW
       ============================================================= */

    function renderFolderView() {
        content.innerHTML = '';

        const visibleConfig =
            getVisibleFolderConfig();

        if (
            shinyMode.value ===
            'separate'
        ) {
            visibleConfig.forEach(
                config => {
                    renderFolderSection(
                        config,
                        getActiveFiles(
                            config.key
                        )
                    );
                }
            );

            applySearch();
            return;
        }

        /*
         * Paired front and shiny-front.
         */
        if (
            visibleConfig.some(
                config =>
                    config.key ===
                    'front'
            )
        ) {
            renderPairedFolderSection(
                'Front',
                getActiveFiles(
                    'front'
                ).filter(
                    file =>
                        !file.parsed
                            .isAdditionalArt
                ),
                getActiveFiles(
                    'frontShiny'
                ).filter(
                    file =>
                        !file.parsed
                            .isAdditionalArt
                )
            );
        }

        /*
         * Paired back and shiny-back.
         */
        if (
            visibleConfig.some(
                config =>
                    config.key ===
                    'back'
            )
        ) {
            renderPairedFolderSection(
                'Back',
                getActiveFiles(
                    'back'
                ).filter(
                    file =>
                        !file.parsed
                            .isAdditionalArt
                ),
                getActiveFiles(
                    'backShiny'
                ).filter(
                    file =>
                        !file.parsed
                            .isAdditionalArt
                )
            );
        }

        visibleConfig
            .filter(
                config =>
                    ![
                        'front',
                        'frontShiny',
                        'back',
                        'backShiny'
                    ].includes(
                        config.key
                    )
            )
            .forEach(
                config => {
                    renderFolderSection(
                        config,
                        getActiveFiles(
                            config.key
                        )
                    );
                }
            );

        applySearch();
    }


    function renderFolderSection(
        config,
        files
    ) {
        const section =
            document.createElement(
                'section'
            );

        section.className =
            'folder-section';

        const header =
            document.createElement(
                'div'
            );

        header.className =
            'folder-header';

        const title =
            document.createElement(
                'h2'
            );

        title.className =
            'folder-title';

        title.textContent =
            config.label;

        const count =
            document.createElement(
                'span'
            );

        count.className =
            'folder-count';

        count.textContent =
            `${files.length} image` +
            `${files.length === 1 ? '' : 's'}`;

        const grid =
            document.createElement(
                'div'
            );

        grid.className =
            'asset-grid';

        files.forEach(
            file => {
                grid.appendChild(
                    createBasicAssetCard(
                        file,
                        config.key
                    )
                );
            }
        );

        header.appendChild(
            title
        );

        header.appendChild(
            count
        );

        section.appendChild(
            header
        );

        section.appendChild(
            grid
        );

        content.appendChild(
            section
        );
    }


    function createBasicAssetCard(
        file,
        assetType
    ) {
        const card =
            document.createElement(
                'div'
            );

        card.className =
            'asset-card';

        card.dataset.search =
            (
                file.name +
                ' ' +
                file.parsed.baseName
            ).toLowerCase();

        const preview =
            document.createElement(
                'div'
            );

        preview.className =
            'asset-preview checkerboard';

        let display;

        if (
            assetType === 'icon' &&
            iconMode.value ===
            'animated'
        ) {
            display =
                createAnimatedIcon(
                    file,
                    150,
                    150
                );
        } else {
            display =
                createImageElement(
                    file,
                    file.name
                );
        }

        preview.appendChild(
            display
        );

        if (
            file.parsed.isOld
        ) {
            const badge =
                document.createElement(
                    'div'
                );

            badge.className =
                'archived-badge';

            badge.textContent =
                'OLD';

            preview.appendChild(
                badge
            );
        }

        const name =
            document.createElement(
                'div'
            );

        name.className =
            'asset-name';

        name.textContent =
            file.parsed
                .originalStem;

        card.appendChild(
            preview
        );

        card.appendChild(
            name
        );

        return card;
    }


    function renderPairedFolderSection(
        label,
        normalFiles,
        shinyFiles
    ) {
        const normalMap =
            new Map(
                normalFiles.map(
                    file => [
                        file.parsed
                            .variantId,
                        file
                    ]
                )
            );

        const shinyMap =
            new Map(
                shinyFiles.map(
                    file => [
                        file.parsed
                            .variantId,
                        file
                    ]
                )
            );

        const names =
            Array.from(
                new Set([
                    ...normalMap.keys(),
                    ...shinyMap.keys()
                ])
            ).sort(
                compareNames
            );

        const section =
            document.createElement(
                'section'
            );

        section.className =
            'folder-section';

        const header =
            document.createElement(
                'div'
            );

        header.className =
            'folder-header';

        const title =
            document.createElement(
                'h2'
            );

        title.className =
            'folder-title';

        title.textContent =
            label;

        const count =
            document.createElement(
                'span'
            );

        count.className =
            'folder-count';

        count.textContent =
            `${names.length} Pokémon`;

        const grid =
            document.createElement(
                'div'
            );

        grid.className =
            'asset-grid';

        names.forEach(
            name => {
                grid.appendChild(
                    createPairedAssetCard(
                        name,
                        normalMap.get(
                            name
                        ),
                        shinyMap.get(
                            name
                        )
                    )
                );
            }
        );

        header.appendChild(
            title
        );

        header.appendChild(
            count
        );

        section.appendChild(
            header
        );

        section.appendChild(
            grid
        );

        content.appendChild(
            section
        );
    }


    function createPairedAssetCard(
        id,
        normalFile,
        shinyFile
    ) {
        const source =
            normalFile ||
            shinyFile;

        const parsed =
            source.parsed;

        const card =
            document.createElement(
                'div'
            );

        card.className =
            'asset-card';

        card.dataset.search =
            (
                id +
                ' ' +
                parsed.baseName
            ).toLowerCase();

        const preview =
            document.createElement(
                'div'
            );

        preview.className =
            'asset-preview checkerboard';

        if (
            shinyMode.value ===
            'hover'
        ) {
            const stack =
                document.createElement(
                    'div'
                );

            stack.className =
                'hover-stack';

            if (normalFile) {
                const normal =
                    createImageElement(
                        normalFile,
                        `${id} normal`
                    );

                normal.className =
                    'normal-image';

                stack.appendChild(
                    normal
                );
            }

            if (shinyFile) {
                stack.classList.add(
                    'has-shiny'
                );

                const shiny =
                    createImageElement(
                        shinyFile,
                        `${id} shiny`
                    );

                shiny.className =
                    'shiny-image';

                stack.appendChild(
                    shiny
                );

                const star =
                    document.createElement(
                        'div'
                    );

                star.className =
                    'hover-indicator shiny-indicator';

                star.textContent =
                    '★';

                stack.appendChild(
                    star
                );
            } else {
                stack.classList.add(
                    'missing-shiny'
                );

                const missing =
                    document.createElement(
                        'div'
                    );

                missing.className =
                    'hover-indicator missing-shiny-indicator';

                missing.textContent =
                    '⊘';

                stack.appendChild(
                    missing
                );
            }

            preview.appendChild(
                stack
            );
        }


        if (
            shinyMode.value ===
            'toggle'
        ) {
            const wrap =
                document.createElement(
                    'div'
                );

            wrap.className =
                'toggle-wrap';

            const stack =
                document.createElement(
                    'div'
                );

            stack.className =
                'toggle-stack';

            let normal = null;
            let shiny = null;

            if (normalFile) {
                normal =
                    createImageElement(
                        normalFile,
                        `${id} normal`
                    );

                normal.className =
                    'normal-image';

                stack.appendChild(
                    normal
                );
            }

            if (shinyFile) {
                shiny =
                    createImageElement(
                        shinyFile,
                        `${id} shiny`
                    );

                shiny.className =
                    'shiny-image';

                stack.appendChild(
                    shiny
                );
            }

            wrap.appendChild(
                stack
            );

            if (
                normal &&
                shiny
            ) {
                const button =
                    document.createElement(
                        'button'
                    );

                button.className =
                    'shiny-toggle-button';

                button.textContent =
                    'Show Shiny';

                let active =
                    false;

                button.onclick =
                    () => {
                        active =
                            !active;

                        normal.style.display =
                            active
                                ? 'none'
                                : '';

                        shiny.style.display =
                            active
                                ? 'block'
                                : 'none';

                        button.textContent =
                            active
                                ? 'Show Normal'
                                : 'Show Shiny';
                    };

                wrap.appendChild(
                    button
                );
            }

            preview.appendChild(
                wrap
            );
        }

        const name =
            document.createElement(
                'div'
            );

        name.className =
            'asset-name';

        name.textContent =
            id;

        card.appendChild(
            preview
        );

        card.appendChild(
            name
        );

        if (
            shinyMode.value ===
                'toggle' &&
            normalFile &&
            !shinyFile
        ) {
            const warning =
                document.createElement(
                    'div'
                );

            warning.className =
                'asset-warning';

            warning.textContent =
                'Missing shiny';

            card.appendChild(
                warning
            );
        }

        return card;
    }


    /* =============================================================
       POKEMON VIEW
       ============================================================= */

    function renderPokemonView() {
        content.innerHTML = '';

        const allRecords =
            buildPokemonRecords();

        const grid =
            document.createElement(
                'div'
            );

        grid.className =
            'pokemon-grid';

        if (
            formMode.value ===
            'separate'
        ) {
            const records =
                sortPokemonRecords(
                    allRecords.filter(
                        record =>
                            recordMatchesProgressFilter(
                                record
                            )
                    )
                );

            records.forEach(
                record => {
                    grid.appendChild(
                        createPokemonCard(
                            record
                        )
                    );
                }
            );
        } else {
            let groups =
                groupPokemonRecords(
                    allRecords
                );

            groups =
                groups.filter(
                    group =>
                        getGroupRecords(group)
                            .some(
                                record =>
                                    recordMatchesProgressFilter(
                                        record
                                    )
                            )
                );

            groups =
                sortPokemonGroups(
                    groups
                );

            groups.forEach(
                group => {
                    grid.appendChild(
                        createGroupedPokemonCard(
                            group
                        )
                    );
                }
            );
        }

        if (
            grid.children.length === 0
        ) {
            content.innerHTML =
                '<div class="status">No Pokémon match the current progress filter.</div>';

            return;
        }

        content.appendChild(
            grid
        );

        applySearch();
    }


    function groupPokemonRecords(
        records
    ) {
        const groups =
            new Map();

        records.forEach(
            record => {
                const base =
                    record.parsed
                        .baseName;

                if (
                    !groups.has(base)
                ) {
                    groups.set(
                        base,
                        []
                    );
                }

                groups
                    .get(base)
                    .push(record);
            }
        );

        return Array
            .from(
                groups.entries()
            )
            .map(
                ([baseName, variants]) => {
                    const primary =
                        variants.find(
                            record =>
                                record.parsed
                                    .formNumber ===
                                    null &&
                                !record.parsed
                                    .isFemale &&
                                !record.parsed
                                    .isOld
                        ) ||
                        variants[0];

                    return {
                        baseName,
                        primary,
                        alternates:
                            variants.filter(
                                variant =>
                                    variant !==
                                    primary
                            )
                    };
                }
            );
    }


    function getGroupRecords(group) {
        return [
            group.primary,
            ...group.alternates
        ];
    }


    function getGroupProgress(group) {
        const progressValues =
            getGroupRecords(group)
                .map(
                    record =>
                        getRecordProgress(
                            record
                        )
                );

        return progressValues.reduce(
            (worst, current) =>
                current.complete <
                worst.complete
                    ? current
                    : worst,
            progressValues[0]
        );
    }


    function sortPokemonGroups(groups) {
        return [...groups].sort(
            (a, b) => {
                if (
                    sortMode.value ===
                    'progressAsc'
                ) {
                    const difference =
                        getGroupProgress(a)
                            .complete -
                        getGroupProgress(b)
                            .complete;

                    if (difference !== 0) {
                        return difference;
                    }
                }

                if (
                    sortMode.value ===
                    'progressDesc'
                ) {
                    const difference =
                        getGroupProgress(b)
                            .complete -
                        getGroupProgress(a)
                            .complete;

                    if (difference !== 0) {
                        return difference;
                    }
                }

                return compareNames(
                    a.baseName,
                    b.baseName
                );
            }
        );
    }


    function createPokemonCard(
        record
    ) {
        const card =
            createPokemonCardShell(
                record
            );

        applyPokemonColors(
            card,
            record
        );

        return card;
    }


    function createGroupedPokemonCard(
        group
    ) {
        const card =
            createPokemonCardShell(
                group.primary,
                group.baseName,
                getGroupProgress(group),
                group.alternates.length > 0
                    ? 'Lowest form progress'
                    : 'Graphic progress'
            );

        card.dataset.search +=
            ' ' +
            group.alternates
                .map(
                    record =>
                        getDisplayName(
                            record
                        )
                )
                .join(' ')
                .toLowerCase();

        if (
            group.alternates.length >
            0
        ) {
            const body =
                card.querySelector(
                    '.pokemon-body'
                );

            const section =
                document.createElement(
                    'div'
                );

            section.className =
                'alternate-forms';

            const heading =
                document.createElement(
                    'div'
                );

            heading.className =
                'alternate-forms-title';

            heading.textContent =
                'Alternate Forms';

            const list =
                document.createElement(
                    'div'
                );

            list.className =
                'alternate-form-list';

            group.alternates.forEach(
                alternate => {
                    const button =
                        document.createElement(
                            'button'
                        );

                    button.type =
                        'button';

                    button.className =
                        'alternate-form-button';

                    button.textContent =
                        getVariantLabel(
                            alternate.parsed
                        ) ||
                        alternate.id;

                    button.onclick =
                        () =>
                            openAssetModal(
                                alternate
                            );

                    list.appendChild(
                        button
                    );
                }
            );

            section.appendChild(
                heading
            );

            section.appendChild(
                list
            );

            body.appendChild(
                section
            );
        }

        applyPokemonColors(
            card,
            group.primary
        );

        return card;
    }


    function createPokemonCardShell(
        record,
        forcedTitle = null,
        progressOverride = null,
        progressLabel = 'Graphic progress'
    ) {
        const card =
            document.createElement(
                'article'
            );

        card.className =
            'pokemon-card';

        card.dataset.search =
            (
                record.id +
                ' ' +
                getDisplayName(record)
            ).toLowerCase();

        const cover =
            document.createElement(
                'div'
            );

        cover.className =
            'pokemon-cover checkerboard';

        const coverFile =
            record.assets.artwork ||
            record.assets.front ||
            record.assets.icon ||
            record.assets.back;

        if (coverFile) {
            let display;

            if (
                coverFile ===
                    record.assets.icon &&
                iconMode.value ===
                    'animated'
            ) {
                display =
                    createAnimatedIcon(
                        coverFile,
                        200,
                        200
                    );
            } else {
                display =
                    createImageElement(
                        coverFile,
                        getDisplayName(
                            record
                        )
                    );
            }

            cover.appendChild(
                display
            );
        } else {
            cover.textContent =
                'No preview';
        }

        if (
            record.parsed.isOld
        ) {
            const badge =
                document.createElement(
                    'div'
                );

            badge.className =
                'archived-badge';

            badge.textContent =
                'OLD';

            cover.appendChild(
                badge
            );
        }

        const body =
            document.createElement(
                'div'
            );

        body.className =
            'pokemon-body';

        const titleRow =
            document.createElement(
                'div'
            );

        titleRow.className =
            'pokemon-title-row';

        const title =
            document.createElement(
                'h2'
            );

        title.className =
            'pokemon-name';

        title.textContent =
            forcedTitle ||
            record.parsed.baseName;

        titleRow.appendChild(
            title
        );

        const variant =
            getVariantLabel(
                record.parsed
            );

        if (
            variant &&
            !forcedTitle
        ) {
            const badge =
                document.createElement(
                    'span'
                );

            badge.className =
                'variant-badge';

            if (
                record.parsed.isOld
            ) {
                badge.classList.add(
                    'old'
                );
            }

            badge.textContent =
                variant;

            titleRow.appendChild(
                badge
            );
        }

        body.appendChild(
            titleRow
        );

        const checklist =
            document.createElement(
                'div'
            );

        checklist.className =
            'asset-list';

        let missing =
            0;

        getRequiredConfig()
            .forEach(config => {
                const exists =
                    Boolean(
                        record.assets[
                            config.key
                        ]
                    );

                const status =
                    document.createElement(
                        'div'
                    );

                status.className =
                    `asset-status ${
                        exists
                            ? 'exists'
                            : 'missing'
                    }`;

                status.textContent =
                    `${
                        exists
                            ? '✓'
                            : '✗'
                    } ${config.label}`;

                checklist.appendChild(
                    status
                );

                if (!exists) {
                    missing++;
                }
            });

        body.appendChild(
            checklist
        );

        if (missing === 0) {
            const complete =
                document.createElement(
                    'div'
                );

            complete.className =
                'complete-summary';

            complete.textContent =
                '🎉 All graphics complete!';

            body.appendChild(
                complete
            );
        }

        const button =
            document.createElement(
                'button'
            );

        button.type =
            'button';

        button.className =
            'view-assets-button';

        button.textContent =
            'View All Assets';

        button.onclick =
            () =>
                openAssetModal(
                    record
                );

        body.appendChild(
            button
        );

        card.appendChild(
            cover
        );

        card.appendChild(
            body
        );

        return card;
    }


    /* =============================================================
       ASSET MODAL
       ============================================================= */

    function openAssetModal(
        record
    ) {
        modalTitle.textContent =
            getDisplayName(
                record
            );

        modalBody.innerHTML =
            '';

        modalWindow.classList.remove(
            'colored'
        );

        modalWindow.removeAttribute(
            'style'
        );

        const siblingRecords =
            sortPokemonRecords(
                buildPokemonRecords()
                    .filter(
                        sibling =>
                            sibling.parsed
                                .baseName ===
                            record.parsed
                                .baseName
                    )
            );

        if (
            siblingRecords.length > 1
        ) {
            const nav =
                document.createElement(
                    'div'
                );

            nav.className =
                'modal-variant-nav';

            const heading =
                document.createElement(
                    'div'
                );

            heading.className =
                'modal-section-title';

            heading.textContent =
                'Forms';

            const list =
                document.createElement(
                    'div'
                );

            list.className =
                'modal-variant-list';

            siblingRecords.forEach(
                sibling => {
                    const button =
                        document.createElement(
                            'button'
                        );

                    button.type =
                        'button';

                    button.className =
                        'modal-variant-button';

                    const label =
                        getVariantLabel(
                            sibling.parsed
                        ) ||
                        'Base';

                    const progress =
                        getRecordProgress(
                            sibling
                        );

                    button.textContent =
                        `${label} · ${progress.complete}/${progress.total}`;

                    if (
                        sibling.id ===
                        record.id
                    ) {
                        button.classList.add(
                            'active'
                        );

                        button.disabled =
                            true;
                    } else {
                        button.onclick =
                            () =>
                                openAssetModal(
                                    sibling
                                );
                    }

                    list.appendChild(
                        button
                    );
                }
            );

            nav.appendChild(
                heading
            );

            nav.appendChild(
                list
            );

            modalBody.appendChild(
                nav
            );
        }

        const coreHeading =
            document.createElement(
                'div'
            );

        coreHeading.className =
            'modal-section-title';

        coreHeading.textContent =
            'Assets';

        modalBody.appendChild(
            coreHeading
        );

        const grid =
            document.createElement(
                'div'
            );

        grid.className =
            'modal-asset-grid';

        getVisibleFolderConfig()
            .forEach(config => {
                const item =
                    document.createElement(
                        'div'
                    );

                item.className =
                    'modal-asset';

                const preview =
                    document.createElement(
                        'div'
                    );

                preview.className =
                    'modal-asset-preview checkerboard';

                const file =
                    record.assets[
                        config.key
                    ];

                if (file) {
                    let display;

                    if (
                        config.key ===
                            'icon' &&
                        iconMode.value ===
                            'animated'
                    ) {
                        display =
                            createAnimatedIcon(
                                file,
                                170,
                                170
                            );
                    } else {
                        display =
                            createImageElement(
                                file,
                                `${record.id} ${config.label}`
                            );
                    }

                    preview.appendChild(
                        display
                    );
                } else {
                    const missing =
                        document.createElement(
                            'div'
                        );

                    missing.className =
                        'modal-asset-missing';

                    missing.textContent =
                        'Not available';

                    preview.appendChild(
                        missing
                    );
                }

                const label =
                    document.createElement(
                        'div'
                    );

                label.className =
                    'modal-asset-label';

                label.textContent =
                    config.label;

                item.appendChild(
                    preview
                );

                item.appendChild(
                    label
                );

                grid.appendChild(
                    item
                );
            });

        modalBody.appendChild(
            grid
        );

        const additionalItems =
            [];

        getVisibleFolderConfig()
            .forEach(config => {
                const files =
                    record.additionalArt[
                        config.key
                    ] || [];

                files.forEach(
                    file => {
                        additionalItems.push({
                            config,
                            file
                        });
                    }
                );
            });

        if (
            additionalItems.length > 0
        ) {
            const section =
                document.createElement(
                    'div'
                );

            section.className =
                'additional-art-section';

            const heading =
                document.createElement(
                    'div'
                );

            heading.className =
                'modal-section-title';

            heading.textContent =
                `Additional Art (${additionalItems.length})`;

            const additionalGrid =
                document.createElement(
                    'div'
                );

            additionalGrid.className =
                'modal-asset-grid';

            additionalItems.forEach(
                ({ config, file }) => {
                    const item =
                        document.createElement(
                            'div'
                        );

                    item.className =
                        'modal-asset';

                    const preview =
                        document.createElement(
                            'div'
                        );

                    preview.className =
                        'modal-asset-preview checkerboard';

                    let display;

                    if (
                        config.key ===
                            'icon' &&
                        iconMode.value ===
                            'animated'
                    ) {
                        display =
                            createAnimatedIcon(
                                file,
                                170,
                                170
                            );
                    } else {
                        display =
                            createImageElement(
                                file,
                                file.name
                            );
                    }

                    preview.appendChild(
                        display
                    );

                    const label =
                        document.createElement(
                            'div'
                        );

                    label.className =
                        'modal-asset-label';

                    label.textContent =
                        config.label;

                    const detail =
                        document.createElement(
                            'div'
                        );

                    detail.className =
                        'additional-art-label';

                    detail.textContent =
                        file.parsed
                            .additionalArtLabel ||
                        file.parsed
                            .originalStem;

                    item.appendChild(
                        preview
                    );

                    item.appendChild(
                        label
                    );

                    item.appendChild(
                        detail
                    );

                    additionalGrid.appendChild(
                        item
                    );
                }
            );

            section.appendChild(
                heading
            );

            section.appendChild(
                additionalGrid
            );

            modalBody.appendChild(
                section
            );
        }

        assetModal.classList.remove(
            'hidden'
        );

        document.body.style.overflow =
            'hidden';

        applyPokemonColors(
            modalWindow,
            record
        );
    }


    function closeAssetModal() {
        assetModal.classList.add(
            'hidden'
        );

        modalBody.innerHTML =
            '';

        document.body.style.overflow =
            '';
    }


    /* =============================================================
       SEARCH
       ============================================================= */

    function applySearch() {
        const query =
            searchInput.value
                .trim()
                .toLowerCase();

        document
            .querySelectorAll(
                '.asset-card, .pokemon-card'
            )
            .forEach(
                card => {
                    const matches =
                        card.dataset.search
                            .includes(
                                query
                            );

                    card.classList.toggle(
                        'hidden',
                        !matches
                    );
                }
            );

        document
            .querySelectorAll(
                '.folder-section'
            )
            .forEach(
                section => {
                    const visible =
                        section
                            .querySelectorAll(
                                '.asset-card:not(.hidden)'
                            )
                            .length;

                    section.classList.toggle(
                        'hidden',
                        query !== '' &&
                        visible === 0
                    );
                }
            );
    }


    /* =============================================================
       EVENTS
       ============================================================= */

    modalClose.addEventListener(
        'click',
        closeAssetModal
    );


    assetModal.addEventListener(
        'click',
        event => {
            if (
                event.target ===
                assetModal
            ) {
                closeAssetModal();
            }
        }
    );


    document.addEventListener(
        'keydown',
        event => {
            if (
                event.key ===
                    'Escape' &&
                !assetModal
                    .classList
                    .contains(
                        'hidden'
                    )
            ) {
                closeAssetModal();
            }
        }
    );


    searchInput.addEventListener(
        'input',
        applySearch
    );


    [
        viewMode,
        shinyMode,
        iconMode,
        formMode,
        cardStyle,
        sortMode,
        progressFilter
    ].forEach(
        element =>
            element.addEventListener(
                'change',
                render
            )
    );


    hideUnusedAssets.addEventListener(
        'change',
        render
    );


    showOldFiles.addEventListener(
        'change',
        render
    );


    /* =============================================================
       START
       ============================================================= */

    loadAllData();
</script>

</body>

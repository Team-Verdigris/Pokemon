<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Team Verdigris Pokédex, artwork, sprites, concept art, and asset library.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Verdigris Dex">
    <meta property="og:title" content="Verdigris Dex — Pokémon & Asset Library">
    <meta property="og:description" content="Browse Team Verdigris Pokémon, artwork, sprites, stats, concept art, and archived assets.">
    <meta name="twitter:card" content="summary_large_image">
    <title>Verdigris Dex — Pokémon & Asset Library</title>

    <style>
        * { box-sizing: border-box; }

        :root {
            color-scheme: dark;
            --bg: #0d1214;
            --panel: #151c1f;
            --panel-2: #1b2529;
            --panel-3: #223036;
            --field: #0f1618;
            --border: #304047;
            --border-strong: #465a62;
            --text: #edf3f3;
            --muted: #97a8ad;
            --accent: #6dc7b9;
            --accent-strong: #8ad9cd;
            --accent-soft: rgba(109, 199, 185, 0.13);
            --good: #63c5b7;
            --bad: #d49457;
            --bad-soft: rgba(212, 148, 87, 0.13);
            --shadow: rgba(0, 0, 0, 0.34);
            --checker-a: #263236;
            --checker-b: #1a2225;
            --type-normal: #9aa0a6;
            --type-fire: #e56d47;
            --type-water: #5795d6;
            --type-electric: #d8b63f;
            --type-grass: #68a95b;
            --type-ice: #71c1c7;
            --type-fighting: #bf5a52;
            --type-poison: #a266b1;
            --type-ground: #b8915e;
            --type-flying: #8399d3;
            --type-psychic: #d7688a;
            --type-bug: #8fa94a;
            --type-rock: #a59061;
            --type-ghost: #756fa5;
            --type-dragon: #7466c8;
            --type-dark: #665f62;
            --type-steel: #7f9aa6;
            --type-fairy: #cf88b4;
            --type-sound: #2f7f78;
        }

        html[data-theme="light"] {
            color-scheme: light;
            --bg: #f2f5f5;
            --panel: #ffffff;
            --panel-2: #f7f9f9;
            --panel-3: #eaf0f1;
            --field: #ffffff;
            --border: #d5dfe1;
            --border-strong: #b9c8cc;
            --text: #182124;
            --muted: #64757a;
            --accent: #28796f;
            --accent-strong: #17665d;
            --accent-soft: rgba(40, 121, 111, 0.10);
            --good: #2f8e82;
            --bad: #9b6333;
            --bad-soft: rgba(155, 99, 51, 0.10);
            --shadow: rgba(23, 40, 46, 0.12);
            --checker-a: #e5ebec;
            --checker-b: #f5f7f7;
        }

        html { min-height: 100%; }
        body {
            min-height: 100vh;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, input, select { font: inherit; }
        button { color: inherit; }
        a { color: var(--accent-strong); }
        .hidden { display: none !important; }

        .checkerboard {
            background-color: var(--checker-b);
            background-image:
                linear-gradient(45deg, var(--checker-a) 25%, transparent 25%),
                linear-gradient(-45deg, var(--checker-a) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--checker-a) 75%),
                linear-gradient(-45deg, transparent 75%, var(--checker-a) 75%);
            background-size: 18px 18px;
            background-position: 0 0, 0 9px, 9px -9px, -9px 0;
        }

        /* Shell */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            background: color-mix(in srgb, var(--panel) 94%, transparent);
            backdrop-filter: blur(14px);
        }

        .topbar,
        .searchbar,
        main {
            width: min(1500px, calc(100% - 32px));
            margin-inline: auto;
        }

        .topbar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            min-height: 62px;
            align-items: center;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            white-space: nowrap;
        }
        .brand-logo {
            display: block;
            width: auto;
            height: 38px;
            max-width: 190px;
            object-fit: contain;
        }
        .brand-subtitle { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }

        .main-nav { display: flex; align-items: stretch; align-self: stretch; justify-content: center; }
        .nav-button {
            position: relative;
            min-width: 96px;
            border: 0;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-weight: 700;
        }
        .nav-button:hover { color: var(--text); }
        .nav-button.active { color: var(--text); }
        .nav-button.active::after {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 0;
            height: 3px;
            border-radius: 3px 3px 0 0;
            background: var(--accent);
        }

        .header-actions { display: flex; gap: 7px; }
        .icon-button,
        .toolbar-button,
        .plain-button {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-2);
            cursor: pointer;
        }
        .icon-button {
            display: inline-grid;
            width: 38px;
            height: 38px;
            place-items: center;
            font-size: 18px;
        }
        .icon-button:hover,
        .toolbar-button:hover,
        .plain-button:hover { border-color: var(--border-strong); background: var(--panel-3); }

        .searchbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            padding: 0 0 12px;
        }
        .search-wrap { position: relative; }
        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            color: var(--muted);
            transform: translateY(-50%);
            pointer-events: none;
        }
        #searchInput {
            width: 100%;
            height: 43px;
            padding: 0 42px 0 39px;
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            outline: none;
            background: var(--field);
            color: var(--text);
        }
        #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        #clearSearch {
            position: absolute;
            right: 8px;
            top: 50%;
            width: 28px;
            height: 28px;
            border: 0;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transform: translateY(-50%);
        }
        .toolbar-button { min-width: 94px; padding: 0 13px; font-weight: 750; }

        .active-filter-bar {
            display: flex;
            width: min(1500px, calc(100% - 32px));
            margin: 0 auto;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 0 10px;
        }
        .filter-chip,
        .tag-chip,
        .category-chip,
        .pokemon-chip,
        .type-chip,
        .ability-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid var(--border);
            border-radius: 999px;
            line-height: 1;
        }
        .filter-chip { padding: 6px 9px; background: var(--accent-soft); color: var(--accent-strong); font-size: 11px; font-weight: 750; }
        .filter-chip button { border: 0; padding: 0; background: transparent; color: inherit; cursor: pointer; font-weight: 900; }

        main { margin-top: 20px; margin-bottom: 60px; }

        .view-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
            margin: 0 0 15px;
        }
        .view-title { margin: 0; font-size: 24px; letter-spacing: -.025em; }
        .view-meta { margin-top: 4px; color: var(--muted); font-size: 12px; }
        .view-controls { display: flex; align-items: center; gap: 8px; }
        .compact-select {
            min-height: 35px;
            padding: 5px 30px 5px 9px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--field);
            color: var(--text);
        }

        .status {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
            color: var(--muted);
        }

        /* Cards */
        .pokemon-grid,
        .gallery-grid,
        .asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 13px;
        }
        .pokemon-card,
        .gallery-card,
        .asset-card {
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: var(--panel);
            box-shadow: 0 4px 15px transparent;
            transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
        }
        .pokemon-card,
        .gallery-card { cursor: pointer; }
        .pokemon-card:hover,
        .gallery-card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: 0 7px 20px var(--shadow); }
        .pokemon-card:focus-visible,
        .gallery-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .pokemon-cover,
        .gallery-cover,
        .asset-preview {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .pokemon-cover { height: 205px; padding: 13px; }
        .gallery-cover { aspect-ratio: 4 / 3; padding: 8px; }
        .asset-preview { height: 165px; padding: 8px; }
        .pokemon-cover img,
        .gallery-cover img,
        .asset-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .pokemon-cover img,
        .asset-preview img.pixelated { image-rendering: pixelated; }
        .pokemon-card-body,
        .gallery-card-body,
        .asset-card-body { padding: 11px 12px 12px; }
        .card-eyebrow { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; }
        .card-title-row { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 8px; margin-top: 3px; }
        .card-title { min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; }
        .card-subtitle { margin-top: 4px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
        .card-chip-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .form-count,
        .archive-badge,
        .gallery-count {
            padding: 3px 6px;
            border-radius: 999px;
            background: var(--panel-3);
            color: var(--muted);
            font-size: 9px;
            font-weight: 800;
        }
        .archive-badge { background: var(--bad-soft); color: var(--bad); }
        .gallery-count { background: var(--accent-soft); color: var(--accent-strong); }

        .type-chip {
            padding: 4px 7px;
            border-color: color-mix(in srgb, var(--type-color, var(--border)) 68%, var(--border));
            background: color-mix(in srgb, var(--type-color, var(--panel-3)) 18%, var(--panel));
            color: color-mix(in srgb, var(--type-color, var(--text)) 72%, var(--text));
            cursor: pointer;
            font-size: 9px;
            font-weight: 850;
            text-transform: uppercase;
            letter-spacing: .035em;
        }
        .type-chip:hover { background: color-mix(in srgb, var(--type-color, var(--panel-3)) 28%, var(--panel)); }
        .type-chip[data-type="NORMAL"] { --type-color: var(--type-normal); }
        .type-chip[data-type="FIRE"] { --type-color: var(--type-fire); }
        .type-chip[data-type="WATER"] { --type-color: var(--type-water); }
        .type-chip[data-type="ELECTRIC"] { --type-color: var(--type-electric); }
        .type-chip[data-type="GRASS"] { --type-color: var(--type-grass); }
        .type-chip[data-type="ICE"] { --type-color: var(--type-ice); }
        .type-chip[data-type="FIGHTING"] { --type-color: var(--type-fighting); }
        .type-chip[data-type="POISON"] { --type-color: var(--type-poison); }
        .type-chip[data-type="GROUND"] { --type-color: var(--type-ground); }
        .type-chip[data-type="FLYING"] { --type-color: var(--type-flying); }
        .type-chip[data-type="PSYCHIC"] { --type-color: var(--type-psychic); }
        .type-chip[data-type="BUG"] { --type-color: var(--type-bug); }
        .type-chip[data-type="ROCK"] { --type-color: var(--type-rock); }
        .type-chip[data-type="GHOST"] { --type-color: var(--type-ghost); }
        .type-chip[data-type="DRAGON"] { --type-color: var(--type-dragon); }
        .type-chip[data-type="DARK"] { --type-color: var(--type-dark); }
        .type-chip[data-type="STEEL"] { --type-color: var(--type-steel); }
        .type-chip[data-type="FAIRY"] { --type-color: var(--type-fairy); }
        .type-chip[data-type="SOUND"] { --type-color: var(--type-sound); }

        .progress-meter { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-top: 10px; }
        .progress-segment { height: 5px; border-radius: 4px; background: var(--bad-soft); }
        .progress-segment.complete { background: var(--good); }
        .progress-text { margin-top: 5px; color: var(--muted); font-size: 9px; text-align: right; }

        .icon-animation { display: inline-block; flex: 0 0 auto; background-repeat: no-repeat; background-position: left top; background-size: 200% 100%; image-rendering: pixelated; animation: icon-two-frame .5s steps(1,end) infinite; }
        @keyframes icon-two-frame { 0%,49.999% { background-position:left top; } 50%,100% { background-position:right top; } }

        /* Gallery */
        .gallery-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .category-chip { padding: 7px 10px; background: var(--panel); color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 750; }
        .category-chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
        .gallery-card .pokemon-chip { padding: 4px 6px; background: var(--panel-2); color: var(--muted); font-size: 9px; cursor: pointer; }
        .gallery-card .pokemon-chip:hover { color: var(--text); border-color: var(--border-strong); }
        .tag-chip { padding: 4px 6px; background: var(--panel-2); color: var(--muted); font-size: 9px; }
        .gallery-category { color: var(--muted); font-size: 10px; }

        /* Folder browser */
        .folder-browser { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 18px; }
        .folder-sidebar { align-self: start; overflow: hidden; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
        .folder-sidebar button { display: block; width: 100%; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; text-align: left; }
        .folder-sidebar button:last-child { border-bottom: 0; }
        .folder-sidebar button:hover { background: var(--panel-2); color: var(--text); }
        .folder-sidebar button.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 800; }
        .asset-card-body { color: var(--muted); font-size: 11px; text-align: center; overflow-wrap: anywhere; }

        /* Panels */
        .panel-backdrop {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,.42);
        }
        .side-panel {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 210;
            width: min(420px, 92vw);
            height: 100vh;
            overflow: auto;
            border-left: 1px solid var(--border);
            background: var(--panel);
            box-shadow: -16px 0 45px var(--shadow);
        }
        .panel-header { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 18px; border-bottom: 1px solid var(--border); background: var(--panel); }
        .panel-header h2 { margin: 0; font-size: 18px; }
        .panel-body { padding: 18px; }
        .panel-section { margin-bottom: 22px; }
        .panel-section:last-child { margin-bottom: 0; }
        .panel-section h3 { margin: 0 0 10px; color: var(--accent-strong); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
        .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
        .field { display: flex; min-width: 0; flex-direction: column; gap: 5px; }
        .field.full { grid-column: 1 / -1; }
        .field label { color: var(--muted); font-size: 10px; font-weight: 750; }
        .field select,
        .field input[type="number"] { width: 100%; min-height: 36px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--field); color: var(--text); }
        .check-row { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--field); font-size: 11px; }
        .type-filter-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .type-filter-grid .type-chip.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
        .panel-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .plain-button { min-height: 36px; padding: 7px 11px; font-weight: 750; }
        .plain-button.primary { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }

        /* Modal */
        .modal-backdrop { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; padding: 22px; background: rgba(0,0,0,.68); }
        .modal-window { width: min(1120px, 100%); max-height: calc(100vh - 44px); overflow: auto; border: 1px solid var(--border); border-radius: 13px; background: var(--panel); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
        .modal-header { position: sticky; top: 0; z-index: 8; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--panel) 96%, transparent); backdrop-filter: blur(10px); }
        .modal-heading { min-width: 0; }
        .modal-kicker { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; }
        .modal-title { margin: 2px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 20px; }
        .modal-actions { display: flex; gap: 6px; }
        .modal-actions .plain-button { min-height: 32px; padding: 5px 9px; font-size: 11px; }
        .modal-close { width: 33px; height: 33px; border: 1px solid var(--border); border-radius: 8px; background: var(--field); cursor: pointer; font-size: 20px; }
        .modal-body { padding: 18px; }
        .detail-hero { display: grid; grid-template-columns: minmax(260px, .9fr) minmax(320px, 1.25fr); gap: 20px; }
        .hero-image { display: flex; min-height: 330px; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--border); border-radius: 11px; padding: 14px; }
        .hero-image img { max-width: 100%; max-height: 360px; object-fit: contain; }
        .hero-copy { min-width: 0; }
        .dex-number { color: var(--muted); font-size: 12px; font-weight: 800; }
        .detail-name { margin: 4px 0 6px; font-size: 30px; letter-spacing: -.03em; }
        .species-line { color: var(--muted); font-size: 13px; }
        .detail-types { display: flex; flex-wrap: wrap; gap: 6px; margin: 11px 0 15px; }
        .detail-types .type-chip { padding: 7px 11px; font-size: 10px; }
        .dex-entry { margin: 0; line-height: 1.55; color: color-mix(in srgb, var(--text) 90%, var(--muted)); }
        .detail-section { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); }
        .section-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
        .section-title { margin: 0; font-size: 14px; }
        .section-meta { color: var(--muted); font-size: 10px; }
        .form-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 15px; }
        .form-tab { padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--field); cursor: pointer; font-size: 11px; }
        .form-tab.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: 800; }
        .ability-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
        .ability-chip { padding: 7px 9px; background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 11px; }
        .ability-chip.hidden-ability::before { content: "Hidden"; margin-right: 3px; color: var(--muted); font-size: 8px; font-weight: 900; text-transform: uppercase; }
        .evolution-row { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
        .evolution-node { padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel-2); cursor: pointer; font-size: 11px; }
        .evolution-node.current { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: 800; }
        .evolution-arrow { color: var(--muted); }

        .stats-grid { display: grid; gap: 7px; }
        .stat-row { display: grid; grid-template-columns: 72px 38px minmax(0,1fr); align-items: center; gap: 8px; font-size: 11px; }
        .stat-label { color: var(--muted); font-weight: 750; }
        .stat-value { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; }
        .stat-track { height: 8px; overflow: hidden; border-radius: 999px; background: var(--panel-3); }
        .stat-fill { height: 100%; border-radius: inherit; background: var(--accent); }
        .bst-row { display: flex; justify-content: space-between; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border); font-size: 12px; font-weight: 850; }

        .modal-asset-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
        .modal-asset { overflow: hidden; border: 1px solid var(--border); border-radius: 9px; background: var(--panel-2); }
        .modal-asset-preview { display: flex; height: 170px; align-items: center; justify-content: center; padding: 9px; overflow: hidden; }
        .modal-asset-preview img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
        .modal-asset-label { padding: 8px 9px; border-top: 1px solid var(--border); font-size: 10px; font-weight: 800; }
        .missing-asset { color: var(--muted); font-size: 11px; }
        .gallery-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .gallery-mini { overflow: hidden; border: 1px solid var(--border); border-radius: 9px; background: var(--panel-2); cursor: pointer; }
        .gallery-mini-image { display: flex; height: 125px; align-items: center; justify-content: center; overflow: hidden; padding: 7px; }
        .gallery-mini-image img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .gallery-mini-title { padding: 7px 8px; border-top: 1px solid var(--border); font-size: 10px; font-weight: 750; }
        .archive-list { display: flex; flex-wrap: wrap; gap: 7px; }
        .archive-link { padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--bad-soft); color: var(--bad); cursor: pointer; font-size: 10px; font-weight: 800; }

        .gallery-detail-image { display: flex; min-height: 420px; align-items: center; justify-content: center; padding: 12px; border: 1px solid var(--border); border-radius: 11px; }
        .gallery-detail-image img { max-width: 100%; max-height: 70vh; object-fit: contain; }
        .gallery-detail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
        .metadata-block { padding: 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel-2); }
        .metadata-label { margin-bottom: 7px; color: var(--muted); font-size: 9px; font-weight: 850; text-transform: uppercase; letter-spacing: .07em; }
        .metadata-value { font-size: 12px; overflow-wrap: anywhere; }

        .copyable-image { cursor: copy; -webkit-touch-callout: default; }
        .copy-toast { position: fixed; left: 50%; bottom: 26px; z-index: 500; max-width: min(460px, calc(100vw - 30px)); padding: 10px 13px; opacity: 0; pointer-events: none; transform: translate(-50%, 8px); border: 1px solid var(--border-strong); border-radius: 8px; background: var(--panel-3); box-shadow: 0 9px 28px var(--shadow); font-size: 12px; font-weight: 750; transition: .15s ease; }
        .copy-toast.visible { opacity: 1; transform: translate(-50%, 0); }
        .copy-toast.error { color: var(--bad); }

        @media (max-width: 900px) {
            .brand-subtitle { display: none; }
            .topbar { gap: 10px; }
            .main-nav { justify-content: flex-start; overflow-x: auto; }
            .nav-button { min-width: 82px; }
            .folder-browser { grid-template-columns: 1fr; }
            .folder-sidebar { display: flex; overflow-x: auto; }
            .folder-sidebar button { width: auto; min-width: max-content; border-right: 1px solid var(--border); border-bottom: 0; }
            .detail-hero { grid-template-columns: 1fr; }
            .hero-image { min-height: 280px; }
        }

        @media (max-width: 650px) {
            .topbar, .searchbar, main, .active-filter-bar { width: min(100% - 20px, 1500px); }
            .topbar { grid-template-columns: 1fr auto; min-height: 56px; }
            .brand { grid-column: 1; }
            .header-actions { grid-column: 2; }
            .main-nav { grid-column: 1 / -1; order: 3; height: 42px; }
            .nav-button { min-width: 33.333%; }
            .searchbar { padding-top: 8px; }
            .toolbar-button { min-width: 76px; padding-inline: 8px; }
            main { margin-top: 15px; }
            .view-heading { align-items: flex-start; flex-direction: column; gap: 8px; }
            .pokemon-grid, .gallery-grid, .asset-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
            .pokemon-cover { height: 170px; }
            .gallery-card-body, .pokemon-card-body { padding: 9px; }
            .card-title { font-size: 14px; }
            .modal-backdrop { padding: 8px; }
            .modal-window { max-height: calc(100vh - 16px); }
            .modal-header { padding: 10px; }
            .modal-actions .plain-button { display: none; }
            .modal-body { padding: 12px; }
            .detail-name { font-size: 25px; }
            .modal-asset-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
            .modal-asset-preview { height: 135px; }
            .gallery-detail-meta { grid-template-columns: 1fr; }
            .field-grid { grid-template-columns: 1fr; }
            .field.full { grid-column: auto; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="topbar">
            <div class="brand" aria-label="Verdigris Dex home">
                <img class="brand-logo" src="logo.png" alt="Team Verdigris">
                <span class="brand-subtitle">Pokédex & Asset Library</span>
            </div>

            <nav class="main-nav" aria-label="Primary navigation">
                <button class="nav-button active" data-view="pokemon" type="button">Pokémon</button>
                <button class="nav-button" data-view="gallery" type="button">Gallery</button>
                <button class="nav-button" data-view="folder" type="button">Folders</button>
            </nav>

            <div class="header-actions">
                <button id="themeToggle" class="icon-button" type="button" title="Toggle light/dark theme" aria-label="Toggle theme">☾</button>
                <button id="settingsButton" class="icon-button" type="button" title="Preferences" aria-label="Preferences">⚙</button>
            </div>
        </div>

        <div class="searchbar">
            <div class="search-wrap">
                <span class="search-icon">⌕</span>
                <input id="searchInput" type="search" placeholder="Search Pokémon, types, abilities, stats, gallery…" autocomplete="off">
                <button id="clearSearch" type="button" aria-label="Clear search">×</button>
            </div>
            <button id="filtersButton" class="toolbar-button" type="button">Filters</button>
        </div>

        <div id="activeFilterBar" class="active-filter-bar hidden"></div>
    </header>

    <main>
        <div id="content"><div class="status">Loading Verdigris Dex…</div></div>
    </main>

    <div id="panelBackdrop" class="panel-backdrop hidden"></div>

    <aside id="filtersPanel" class="side-panel hidden" aria-label="Pokémon filters">
        <div class="panel-header">
            <h2>Filters</h2>
            <button class="icon-button panel-close" type="button" aria-label="Close filters">×</button>
        </div>
        <div class="panel-body">
            <section class="panel-section" id="pokemonFilterSection">
                <h3>Pokémon</h3>
                <div class="field-grid">
                    <div class="field full">
                        <label>Types — selecting multiple means all selected types</label>
                        <div id="typeFilterGrid" class="type-filter-grid"></div>
                    </div>
                    <div class="field full">
                        <label for="abilityFilter">Ability</label>
                        <select id="abilityFilter"><option value="">Any ability</option></select>
                    </div>
                </div>
            </section>

            <section class="panel-section" id="statFilterSection">
                <h3>Base Stats</h3>
                <div class="field-grid" id="statFilterGrid"></div>
            </section>

            <section class="panel-section" id="assetFilterSection">
                <h3>Assets</h3>
                <div class="field-grid">
                    <div class="field">
                        <label for="progressFilter">Graphic progress</label>
                        <select id="progressFilter">
                            <option value="all">Any progress</option>
                            <option value="complete">Complete 6/6</option>
                            <option value="incomplete">Incomplete</option>
                            <option value="missing:artwork">Missing Artwork</option>
                            <option value="missing:front">Missing Front</option>
                            <option value="missing:frontShiny">Missing Front Shiny</option>
                            <option value="missing:back">Missing Back</option>
                            <option value="missing:backShiny">Missing Back Shiny</option>
                            <option value="missing:icon">Missing Icon</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="sortMode">Sort</label>
                        <select id="sortMode"></select>
                    </div>
                </div>
            </section>

            <section class="panel-section" id="galleryFilterSection">
                <h3>Gallery</h3>
                <div class="field-grid">
                    <div class="field full">
                        <label for="galleryRelationFilter">Relationship</label>
                        <select id="galleryRelationFilter">
                            <option value="all">All Gallery items</option>
                            <option value="pokemon">Pokémon-related</option>
                            <option value="general">General / no Pokémon</option>
                        </select>
                    </div>
                </div>
            </section>

            <div class="panel-actions">
                <button id="clearFiltersButton" class="plain-button" type="button">Clear</button>
                <button class="plain-button primary panel-close" type="button">Done</button>
            </div>
        </div>
    </aside>

    <aside id="settingsPanel" class="side-panel hidden" aria-label="Display preferences">
        <div class="panel-header">
            <h2>Preferences</h2>
            <button class="icon-button panel-close" type="button" aria-label="Close preferences">×</button>
        </div>
        <div class="panel-body">
            <section class="panel-section">
                <h3>Display</h3>
                <div class="field-grid">
                    <div class="field">
                        <label for="iconMode">Icons</label>

                            <option value="animated">Animated</option>

                    </div>
                    <div class="field">
                        <label for="cardStyle">Pokémon cards</label>

                            <option value="pokemon">Artwork colors</option>
                            <option value="neutral">Neutral</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="progressDisplay">Asset progress</label>
                        <select id="progressDisplay">
                            <option value="meter">Meter</option>

                        <select id="archiveMode">

                            <option value="hidden">Hidden</option>

                        </select>

                        <label>Utility folders</label>

    <div id="detailModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-window">
            <div class="modal-header">
                <div class="modal-heading">
                    <div id="modalKicker" class="modal-kicker"></div>
                    <h2 id="modalTitle" class="modal-title"></h2>
                </div>
                <div class="modal-actions">
                    <button id="modalCopyLink" class="plain-button" type="button">Copy Link</button>
                    <button id="modalShare" class="plain-button" type="button">Share</button>
                    <button id="modalClose" class="modal-close" type="button" aria-label="Close">×</button>
                </div>
            </div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <div id="copyToast" class="copy-toast" role="status" aria-live="polite"></div>

<script>
(() => {
    'use strict';

    const ORGANIZATION = 'Team-Verdigris';
    const REPOSITORY = 'Pokemon';
    const BRANCH = 'main';
    const GALLERY_ROOT = 'Gallery';
    const ARCHIVE_ROOT = 'Archived';
    const BASE_TITLE = 'Verdigris Dex — Pokémon & Asset Library';

    const ASSET_CONFIG = [
        { key: 'artwork', folder: 'Artworks', label: 'Artwork', required: true, utility: false },
        { key: 'front', folder: 'Front', label: 'Front', required: true, utility: false },
        { key: 'frontShiny', folder: 'Front shiny', label: 'Front Shiny', required: true, utility: false },
        { key: 'back', folder: 'Back', label: 'Back', required: true, utility: false },
        { key: 'backShiny', folder: 'Back shiny', label: 'Back Shiny', required: true, utility: false },
        { key: 'icon', folder: 'Icons', label: 'Icon', required: true, utility: false },
        { key: 'egg', folder: 'Eggs', label: 'Egg', required: false, utility: false },
        { key: 'return', folder: 'Return', label: 'Return', required: false, utility: true }
    ];

    const STAT_CONFIG = [
        { key: 'hp', label: 'HP', alias: 'hp' },
        { key: 'attack', label: 'Attack', alias: 'atk' },
        { key: 'defense', label: 'Defense', alias: 'def' },
        { key: 'special_attack', label: 'Sp. Attack', alias: 'spa' },
        { key: 'special_defense', label: 'Sp. Defense', alias: 'spd' },
        { key: 'speed', label: 'Speed', alias: 'spe' },
        { key: 'total', label: 'BST', alias: 'bst' }
    ];

    const elements = {
        content: document.getElementById('content'),
        searchInput: document.getElementById('searchInput'),
        clearSearch: document.getElementById('clearSearch'),
        activeFilterBar: document.getElementById('activeFilterBar'),
        themeToggle: document.getElementById('themeToggle'),
        filtersButton: document.getElementById('filtersButton'),
        settingsButton: document.getElementById('settingsButton'),
        panelBackdrop: document.getElementById('panelBackdrop'),
        filtersPanel: document.getElementById('filtersPanel'),
        settingsPanel: document.getElementById('settingsPanel'),
        typeFilterGrid: document.getElementById('typeFilterGrid'),
        abilityFilter: document.getElementById('abilityFilter'),
        statFilterGrid: document.getElementById('statFilterGrid'),
        progressFilter: document.getElementById('progressFilter'),
        sortMode: document.getElementById('sortMode'),
        galleryRelationFilter: document.getElementById('galleryRelationFilter'),
        clearFiltersButton: document.getElementById('clearFiltersButton'),
        pokemonFilterSection: document.getElementById('pokemonFilterSection'),
        statFilterSection: document.getElementById('statFilterSection'),
        assetFilterSection: document.getElementById('assetFilterSection'),
        galleryFilterSection: document.getElementById('galleryFilterSection'),
        iconMode: document.getElementById('iconMode'),
        cardStyle: document.getElementById('cardStyle'),
        progressDisplay: document.getElementById('progressDisplay'),
        formMode: document.getElementById('formMode'),
        archiveMode: document.getElementById('archiveMode'),
        hideUnusedAssets: document.getElementById('hideUnusedAssets'),
        detailModal: document.getElementById('detailModal'),
        modalKicker: document.getElementById('modalKicker'),
        modalTitle: document.getElementById('modalTitle'),
        modalBody: document.getElementById('modalBody'),
        modalCopyLink: document.getElementById('modalCopyLink'),
        modalShare: document.getElementById('modalShare'),
        modalClose: document.getElementById('modalClose'),
        copyToast: document.getElementById('copyToast')
    };

    const state = {
        loaded: false,
        tree: [],
        snapshot: null,
        snapshotPath: null,
        snapshotGeneratedAt: null,
        pokemonRecords: [],
        pokemonById: new Map(),
        speciesGroups: [],
        speciesByBase: new Map(),
        galleryItems: [],
        galleryById: new Map(),
        rawAssets: {},
        archivedAssets: {},
        currentView: 'pokemon',
        selectedFolder: 'artwork',
        selectedGalleryCategory: '',
        selectedTypes: new Set(),
        ability: '',
        statRanges: {},
        progressFilter: 'all',
        galleryRelation: 'all',
        sortMode: 'dex',
        modal: null,
        copyToastTimer: null,
        paletteCache: new Map()
    };

    const prefs = {
        theme: 'dark',
        iconMode: 'animated',
        cardStyle: 'pokemon',
        progressDisplay: 'meter',
        formMode: 'grouped',
        archiveMode: 'search',
        hideUnusedAssets: true
    };

    function isImageFile(path) {
        return /\.(png|jpe?g|webp)$/i.test(path || '');
    }

    function stripExtension(filename) {
        return String(filename || '').replace(/\.(png|jpe?g|webp)$/i, '');
    }

    function basename(path) {
        const pieces = String(path || '').split('/');
        return pieces[pieces.length - 1] || '';
    }

    function encodeRepoPath(path) {
        return String(path).split('/').map(encodeURIComponent).join('/');
    }

    function rawUrl(path) {
        return `https://raw.githubusercontent.com/${ORGANIZATION}/${REPOSITORY}/${BRANCH}/${encodeRepoPath(path)}`;
    }

    function slugify(value) {
        return String(value || '')
            .normalize('NFKD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '') || 'item';
    }

    function compareText(a, b) {
        return String(a || '').localeCompare(String(b || ''), undefined, { numeric: true, sensitivity: 'base' });
    }

    function escapeSearchText(value) {
        return String(value ?? '').toLowerCase();
    }

    function parsePokemonFilename(filename, archivedByPath = false) {
        const originalStem = stripExtension(filename);
        let stem = originalStem;
        let isOld = archivedByPath;

        if (/_old$/i.test(stem)) {
            isOld = true;
            stem = stem.replace(/_old$/i, '');
        }

        const parts = stem.split('_');
        const baseName = parts.shift() || stem;
        let formNumber = null;
        let isFemale = false;

        if (parts.length && /^\d+$/.test(parts[0])) {
            formNumber = Number(parts.shift());
        }
        if (parts.length && /^female$/i.test(parts[0])) {
            isFemale = true;
            parts.shift();
        }

        const additionalArtLabel = parts.length ? parts.join('_') : null;
        let variantId = baseName;
        if (formNumber !== null) variantId += `_${formNumber}`;
        if (isFemale) variantId += '_female';
        if (isOld) variantId += '_old';

        return {
            originalStem,
            baseName,
            formNumber,
            isFemale,
            isOld,
            isAdditionalArt: additionalArtLabel !== null,
            additionalArtLabel,
            variantId
        };
    }

    function parseGalleryFilename(path) {
        const file = basename(path);
        const stem = stripExtension(file);
        const parts = stem.split('__');
        const title = (parts.shift() || stem).trim();
        const pokemon = [];
        const tags = [];

        parts.forEach(part => {
            if (/^P-/i.test(part)) {
                pokemon.push(...part.slice(2).split('+').map(v => v.trim().toUpperCase()).filter(Boolean));
            } else if (/^T-/i.test(part)) {
                tags.push(...part.slice(2).split('+').map(v => v.trim()).filter(Boolean));
            }
        });

        const categoryPath = path.slice(`${GALLERY_ROOT}/`.length, path.length - file.length).replace(/\/$/, '');
        const categories = categoryPath ? categoryPath.split('/').filter(Boolean) : [];

        return { file, title, pokemon: [...new Set(pokemon)], tags: [...new Set(tags)], categories, categoryPath };
    }

    function getVariantLabel(record) {
        if (record.dex?.form_name) return record.dex.form_name;
        const parts = [];
        if (record.parsed.formNumber !== null) parts.push(`Form ${record.parsed.formNumber}`);
        if (record.parsed.isFemale) parts.push('Female');
        if (record.parsed.isOld) parts.push('Archived');
        return parts.join(' · ');
    }

    function getDisplayName(record) {
        if (record.dex?.display_name) return record.dex.display_name;
        const variant = getVariantLabel(record);
        return variant ? `${record.parsed.baseName} — ${variant}` : record.parsed.baseName;
    }

    function getActiveAssetConfig() {
        return ASSET_CONFIG.filter(config => !(prefs.hideUnusedAssets && config.utility));
    }

    function getRequiredConfig() {
        return ASSET_CONFIG.filter(config => config.required);
    }

    function loadPreferences() {
        try {
            const saved = JSON.parse(localStorage.getItem('verdigrisDex.preferences') || '{}');
            Object.assign(prefs, saved || {});
        } catch (error) {
            console.warn('Could not read saved preferences', error);
        }

        document.documentElement.dataset.theme = prefs.theme;
        elements.iconMode.value = prefs.iconMode;
        elements.cardStyle.value = prefs.cardStyle;
        elements.progressDisplay.value = prefs.progressDisplay;
        elements.formMode.value = prefs.formMode;
        elements.archiveMode.value = prefs.archiveMode;
        elements.hideUnusedAssets.checked = Boolean(prefs.hideUnusedAssets);
        updateThemeButton();
    }

    function savePreferences() {
        localStorage.setItem('verdigrisDex.preferences', JSON.stringify(prefs));
    }

    function updateThemeButton() {
        elements.themeToggle.textContent = prefs.theme === 'dark' ? '☾' : '☀';
        elements.themeToggle.title = prefs.theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
    }

    async function fetchRepositoryTree() {
        const response = await fetch(`https://api.github.com/repos/${ORGANIZATION}/${REPOSITORY}/git/trees/${BRANCH}?recursive=1`, {
            headers: { Accept: 'application/vnd.github+json' }
        });
        if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data.tree)) throw new Error('Unexpected GitHub repository tree response.');
        if (data.truncated) console.warn('GitHub returned a truncated repository tree.');
        return data.tree;
    }

    async function loadSnapshotFromTree(tree) {
        const candidates = tree
            .filter(item => item.type === 'blob' && !String(item.path).includes('/') && /^pokemon_snapshot.*\.json$/i.test(item.path))
            .map(item => item.path);

        if (!candidates.length) return null;

        const ordered = [
            ...candidates.filter(path => /^pokemon_snapshot\.json$/i.test(path)),
            ...candidates.filter(path => !/^pokemon_snapshot\.json$/i.test(path)).sort(compareText).reverse()
        ];

        let best = null;
        for (const path of ordered) {
            try {
                const response = await fetch(rawUrl(path), { cache: 'no-store' });
                if (!response.ok) continue;
                const data = await response.json();
                if (!Array.isArray(data?.pokemon)) continue;
                if (!best || String(data.generated_at || '') > String(best.data.generated_at || '')) {
                    best = { path, data };
                }
                if (/^pokemon_snapshot\.json$/i.test(path)) break;
            } catch (error) {
                console.warn(`Could not load ${path}`, error);
            }
        }

        if (best) {
            state.snapshotPath = best.path;
            state.snapshotGeneratedAt = best.data.generated_at || null;
            return best.data;
        }
        return null;
    }

    function buildAssetCollections(tree) {
        state.rawAssets = Object.fromEntries(ASSET_CONFIG.map(config => [config.key, []]));
        state.archivedAssets = Object.fromEntries(ASSET_CONFIG.map(config => [config.key, []]));

        tree.filter(item => item.type === 'blob' && isImageFile(item.path)).forEach(item => {
            for (const config of ASSET_CONFIG) {
                const activePrefix = `${config.folder}/`;
                const archivePrefix = `${ARCHIVE_ROOT}/${config.folder}/`;
                let archivedByPath = false;
                let relative = null;

                if (item.path.toLowerCase().startsWith(activePrefix.toLowerCase())) {
                    relative = item.path.slice(activePrefix.length);
                } else if (item.path.toLowerCase().startsWith(archivePrefix.toLowerCase())) {
                    relative = item.path.slice(archivePrefix.length);
                    archivedByPath = true;
                }

                if (relative === null || relative.includes('/')) continue;

                const file = {
                    name: basename(item.path),
                    path: item.path,
                    download_url: rawUrl(item.path),
                    parsed: parsePokemonFilename(basename(item.path), archivedByPath)
                };
                (archivedByPath ? state.archivedAssets : state.rawAssets)[config.key].push(file);
                break;
            }
        });

        Object.values(state.rawAssets).forEach(files => files.sort((a,b) => compareText(a.name,b.name)));
        Object.values(state.archivedAssets).forEach(files => files.sort((a,b) => compareText(a.name,b.name)));
    }

    function buildGalleryItems(tree) {
        const files = tree.filter(item => item.type === 'blob' && isImageFile(item.path) && item.path.toLowerCase().startsWith(`${GALLERY_ROOT.toLowerCase()}/`));
        const usedIds = new Map();

        state.galleryItems = files.map(item => {
            const parsed = parseGalleryFilename(item.path);
            const baseId = slugify(parsed.title);
            const count = (usedIds.get(baseId) || 0) + 1;
            usedIds.set(baseId, count);
            const id = count === 1 ? baseId : `${baseId}-${count}`;

            return {
                id,
                path: item.path,
                download_url: rawUrl(item.path),
                ...parsed,
                searchText: escapeSearchText([
                    parsed.title,
                    parsed.file,
                    parsed.categoryPath,
                    parsed.categories.join(' '),
                    parsed.pokemon.join(' '),
                    parsed.tags.join(' ')
                ].join(' '))
            };
        }).sort((a,b) => compareText(a.title,b.title));

        state.galleryById = new Map(state.galleryItems.map(item => [item.id, item]));
    }

    function snapshotRecordId(species, form) {
        if (form.form_number === 0) return species.id;
        if (/^female$/i.test(form.form_name || '')) return `${species.id}_female`;
        return `${species.id}_${form.form_number}`;
    }

    function buildPokemonRecords() {
        const map = new Map();

        function ensureRecord(id, parsed = null) {
            if (!map.has(id)) {
                const fallbackParsed = parsed || parsePokemonFilename(`${id}.png`, /_old$/i.test(id));
                map.set(id, {
                    id,
                    parsed: fallbackParsed,
                    assets: {},
                    additionalArt: {},
                    dex: null,
                    gallery: [],
                    archivedVariants: [],
                    searchText: ''
                });
            }
            return map.get(id);
        }

        ASSET_CONFIG.forEach(config => {
            [...state.rawAssets[config.key], ...state.archivedAssets[config.key]].forEach(file => {
                const record = ensureRecord(file.parsed.variantId, file.parsed);
                if (file.parsed.isAdditionalArt) {
                    if (!record.additionalArt[config.key]) record.additionalArt[config.key] = [];
                    record.additionalArt[config.key].push(file);
                } else {
                    record.assets[config.key] = file;
                    record.parsed = file.parsed;
                }
            });
        });

        if (state.snapshot) {
            state.snapshot.pokemon.forEach(species => {
                species.forms.forEach(form => {
                    const id = snapshotRecordId(species, form);
                    const parsed = parsePokemonFilename(`${id}.png`, false);
                    parsed.baseName = species.id;
                    if (/^female$/i.test(form.form_name || '')) parsed.isFemale = true;
                    const record = ensureRecord(id, parsed);
                    record.dex = {
                        ...form,
                        pokemon_id: species.id,
                        pokemon_name: species.name,
                        pokedex_number: species.pokedex_number
                    };
                    record.parsed.baseName = species.id;
                });
            });
        }

        state.galleryItems.forEach(item => {
            item.pokemon.forEach(baseName => {
                let matching = [...map.values()].filter(record => !record.parsed.isOld && record.parsed.baseName.toUpperCase() === baseName.toUpperCase());
                if (!matching.length) matching = [ensureRecord(baseName, parsePokemonFilename(`${baseName}.png`, false))];
                matching.forEach(record => record.gallery.push(item));
            });
        });

        const currentByCanonical = new Map();
        [...map.values()].filter(r => !r.parsed.isOld).forEach(record => currentByCanonical.set(canonicalVariantId(record), record));
        [...map.values()].filter(r => r.parsed.isOld).forEach(archived => {
            const current = currentByCanonical.get(canonicalVariantId(archived));
            if (current) {
                archived.dex = archived.dex || current.dex;
                current.archivedVariants.push(archived);
            }
        });

        state.pokemonRecords = [...map.values()].sort((a,b) => compareText(getDisplayName(a), getDisplayName(b)));
        state.pokemonById = new Map(state.pokemonRecords.map(record => [record.id.toLowerCase(), record]));

        state.pokemonRecords.forEach(record => {
            const dex = record.dex;
            const abilities = dex ? [...(dex.abilities?.standard || []), ...(dex.abilities?.hidden || [])] : [];
            record.searchText = escapeSearchText([
                record.id,
                record.parsed.baseName,
                getDisplayName(record),
                dex?.pokedex_number,
                dex?.species_name,
                dex?.category,
                dex?.pokedex_entry,
                ...(dex?.types || []).flatMap(type => [type.id, type.name]),
                ...abilities.flatMap(ability => [ability.id, ability.name]),
                ...(dex?.evolves_into || []).flatMap(evo => [evo.id, evo.name]),
                ...Object.values(record.assets).flatMap(file => [file.name, file.path]),
                ...Object.values(record.additionalArt).flat().flatMap(file => [file.name, file.path]),
                ...record.gallery.flatMap(item => [item.title, item.file, item.categoryPath, ...item.tags])
            ].filter(Boolean).join(' '));
        });

        buildSpeciesGroups();
    }

    function canonicalVariantId(record) {
        let id = record.parsed.baseName;
        if (record.parsed.formNumber !== null) id += `_${record.parsed.formNumber}`;
        if (record.parsed.isFemale) id += '_female';
        return id.toLowerCase();
    }

    function buildSpeciesGroups() {
        const groups = new Map();
        state.pokemonRecords.filter(r => !r.parsed.isOld).forEach(record => {
            const key = record.parsed.baseName.toUpperCase();
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(record);
        });

        state.speciesGroups = [...groups.entries()].map(([baseName, forms]) => {
            forms.sort((a,b) => {
                const aNum = a.dex?.form_number ?? a.parsed.formNumber ?? 0;
                const bNum = b.dex?.form_number ?? b.parsed.formNumber ?? 0;
                return aNum - bNum;
            });
            const primary = forms.find(record => (record.dex?.form_number ?? record.parsed.formNumber ?? 0) === 0 && !record.parsed.isFemale) || forms[0];
            const gallery = [...new Map(forms.flatMap(r => r.gallery).map(item => [item.id,item])).values()];
            return { baseName, forms, primary, gallery };
        }).sort((a,b) => {
            const aDex = a.primary.dex?.pokedex_number ?? Number.MAX_SAFE_INTEGER;
            const bDex = b.primary.dex?.pokedex_number ?? Number.MAX_SAFE_INTEGER;
            return aDex - bDex || compareText(a.baseName,b.baseName);
        });
        state.speciesByBase = new Map(state.speciesGroups.map(group => [group.baseName.toLowerCase(), group]));
    }

    function getRecordProgress(record) {
        const required = getRequiredConfig();
        const complete = required.filter(config => Boolean(record.assets[config.key])).length;
        return { complete, total: required.length };
    }

    function getGalleryForBase(baseName) {
        return state.galleryItems.filter(item => item.pokemon.some(p => p.toUpperCase() === baseName.toUpperCase()));
    }

    function getCoverForRecord(record) {
        const exactSingle = record.gallery.find(item => item.pokemon.length === 1 && item.pokemon[0].toUpperCase() === record.parsed.baseName.toUpperCase());
        const anyGallery = record.gallery[0];
        return record.assets.artwork || exactSingle || record.assets.front || anyGallery || record.assets.icon || record.assets.back || null;
    }

    function getCoverUrl(cover) {
        return cover?.download_url || null;
    }

    function isGalleryCover(cover) {
        return Boolean(cover && 'title' in cover && 'pokemon' in cover);
    }

    function createImage(file, alt, { copyable = false, pixelated = false } = {}) {
        const img = document.createElement('img');
        img.src = file.download_url;
        img.alt = alt;
        img.loading = 'lazy';
        if (pixelated) img.classList.add('pixelated');
        if (copyable) {
            img.classList.add('copyable-image');
            img.title = 'Click to copy image';
            img.addEventListener('click', event => {
                event.stopPropagation();
                copyImage(file, alt);
            });
        }
        return img;
    }

    function createAnimatedIcon(file, maxWidth, maxHeight, copyable = false) {
        const wrapper = document.createElement('div');
        const loader = new Image();
        loader.onload = () => {
            const frameWidth = loader.naturalWidth / 2;
            const frameHeight = loader.naturalHeight;
            const scale = Math.min(maxWidth / frameWidth, maxHeight / frameHeight, 8);
            wrapper.style.width = `${Math.max(1, Math.floor(frameWidth * scale))}px`;
            wrapper.style.height = `${Math.max(1, Math.floor(frameHeight * scale))}px`;
            wrapper.style.backgroundImage = `url("${file.download_url}")`;
            wrapper.className = 'icon-animation';
            if (copyable) wrapper.classList.add('copyable-image');
        };
        loader.src = file.download_url;
        if (copyable) wrapper.addEventListener('click', event => { event.stopPropagation(); copyImage(file, file.name); });
        return wrapper;
    }

    async function copyImage(file, label) {
        try {
            const response = await fetch(file.download_url);
            if (!response.ok) throw new Error('Image fetch failed');
            const blob = await response.blob();
            if (navigator.clipboard && typeof ClipboardItem !== 'undefined') {
                let output = blob;
                if (blob.type !== 'image/png') {
                    const bitmap = await createImageBitmap(blob);
                    const canvas = document.createElement('canvas');
                    canvas.width = bitmap.width;
                    canvas.height = bitmap.height;
                    canvas.getContext('2d').drawImage(bitmap,0,0);
                    bitmap.close();
                    output = await new Promise((resolve,reject) => canvas.toBlob(result => result ? resolve(result) : reject(new Error('Conversion failed')), 'image/png'));
                }
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': output })]);
                showToast(`Copied ${label}`);
                return;
            }
            await navigator.clipboard.writeText(file.download_url);
            showToast('Copied image link');
        } catch (error) {
            console.warn('Image copy failed', error);
            try {
                await navigator.clipboard.writeText(file.download_url);
                showToast('Copied image link');
            } catch {
                showToast('Could not copy image', true);
            }
        }
    }

    function showToast(message, error = false) {
        clearTimeout(state.copyToastTimer);
        elements.copyToast.textContent = message;
        elements.copyToast.classList.toggle('error', error);
        elements.copyToast.classList.add('visible');
        state.copyToastTimer = setTimeout(() => elements.copyToast.classList.remove('visible'), 1800);
    }

    async function getArtworkPalette(file) {
        if (!file) return null;
        if (state.paletteCache.has(file.download_url)) return state.paletteCache.get(file.download_url);
        const promise = new Promise(resolve => {
            const image = new Image();
            image.crossOrigin = 'anonymous';
            image.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 32;
                    canvas.height = 32;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(image,0,0,32,32);
                    const pixels = ctx.getImageData(0,0,32,32).data;
                    const buckets = new Map();
                    for (let i=0;i<pixels.length;i+=4) {
                        const [r,g,b,a] = [pixels[i],pixels[i+1],pixels[i+2],pixels[i+3]];
                        if (a < 120) continue;
                        const lum = (r+g+b)/3;
                        const chroma = Math.max(r,g,b) - Math.min(r,g,b);
                        if (lum > 242 || lum < 20 || chroma < 30) continue;
                        const q = [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v/32)*32)));
                        const key = q.join(',');
                        buckets.set(key,(buckets.get(key)||0)+1);
                    }
                    const ranked = [...buckets.entries()].sort((a,b)=>b[1]-a[1]).map(([key])=>key.split(',').map(Number));
                    resolve(ranked[0] || null);
                } catch { resolve(null); }
            };
            image.onerror = () => resolve(null);
            image.src = file.download_url;
        });
        state.paletteCache.set(file.download_url,promise);
        return promise;
    }

    async function applyCardColor(card, record) {
        if (prefs.cardStyle !== 'pokemon') return;
        const source = record.assets.artwork || record.assets.front;
        const rgb = await getArtworkPalette(source);
        if (!rgb || !card.isConnected) return;
        card.style.background = `linear-gradient(180deg, rgba(${rgb.join(',')},.18), var(--panel) 48%)`;
    }

    function makeTypeChip(type, { filterable = true } = {}) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'type-chip';
        button.dataset.type = String(type.id || type.name || '').toUpperCase();
        button.textContent = type.name || type.id;
        if (!filterable) button.disabled = true;
        else button.addEventListener('click', event => {
            event.stopPropagation();
            state.selectedTypes.add(button.dataset.type);
            state.currentView = 'pokemon';
            closeModal({ updateUrl: false });
            populateFilters();
            syncRoute({ push: true });
            render();
        });
        return button;
    }

    function makeAbilityChip(ability, hidden = false) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `ability-chip${hidden ? ' hidden-ability' : ''}`;
        button.textContent = ability.name;
        button.addEventListener('click', () => {
            state.ability = ability.id;

            closeModal({ updateUrl: false });

        });
